  function importBulkCustomers() {
    if (!BULK_IMPORT_CUSTOMERS.length) return;
    if (
      !global.confirm(
        `นำเข้ารายชื่อลูกค้า ${BULK_IMPORT_CUSTOMERS.length} รายชื่อจากไฟล์ Excel? ระบบจะข้ามรายชื่อที่มีชื่อซ้ำกับที่มีอยู่แล้วในระบบให้อัตโนมัติ`
      )
    )
      return;
    const existingNames = new Set(DB.getCustomers().map((c) => (c.name || "").trim().toLowerCase()));
    let added = 0;
    let skipped = 0;
    BULK_IMPORT_CUSTOMERS.forEach((row) => {
      const key = (row.name || "").trim().toLowerCase();
      if (!key || existingNames.has(key)) {
        skipped++;
        return;
      }
      DB.addCustomer({ code: row.code, name: row.name, phone: row.phone, address: row.address });
      existingNames.add(key);
      added++;
    });
    renderCustomerTable();
    global.alert(`นำเข้าลูกค้าสำเร็จ ${added} รายชื่อ (ข้ามรายชื่อซ้ำ/มีอยู่แล้ว ${skipped} รายชื่อ)`);
  }

  function importBulkSuppliers() {
    if (!BULK_IMPORT_SUPPLIERS.length) return;
    if (
      !global.confirm(
        `นำเข้ารายชื่อซัพพลายเออร์ ${BULK_IMPORT_SUPPLIERS.length} รายจากระบบเดิม? ระบบจะข้ามรายชื่อที่มีชื่อซ้ำกับที่มีอยู่แล้วให้อัตโนมัติ`
      )
    )
      return;
    const existingNames = new Set(DB.getSuppliers().map((s) => (s.name || "").trim().toLowerCase()));
    let added = 0;
    let skipped = 0;
    BULK_IMPORT_SUPPLIERS.forEach((row) => {
      const key = (row.name || "").trim().toLowerCase();
      if (!key || existingNames.has(key)) {
        skipped++;
        return;
      }
      DB.addSupplier({
        code: row.code,
        name: row.name,
        phone: row.phone,
        address: row.address,
        contact_person: row.contact_person,
        note: [row.note, row.legacy_code ? "รหัสเดิม: " + row.legacy_code : ""].filter(Boolean).join(" / "),
      });
      existingNames.add(key);
      added++;
    });
    renderSupplierTable();
    global.alert(`นำเข้าซัพพลายเออร์สำเร็จ ${added} ราย (ข้ามซ้ำ ${skipped} ราย)`);
  }

  // คำนวณรหัสผ้าจริงจาก base_code + รหัสซัพพลายเออร์ "ปัจจุบัน" (ไม่พึ่ง prefix ที่ hardcode ไว้)
  function computeBulkFabricCode(row, supplierByName) {
    const sup = row.supplier_name ? supplierByName.get(row.supplier_name.trim().toLowerCase()) : null;
    if (row.exact_code) {
      return { code: row.code || "", supplierId: sup ? sup.id : null };
    }
    const prefix = sup && sup.code ? sup.code.slice(-3) : "";
    const base = row.base_code || row.code || "";
    const code = prefix ? `${prefix}-${base}` : base;
    return { code, supplierId: sup ? sup.id : null };
  }

  function importBulkFabrics(opts) {
    opts = opts || {};
    if (!BULK_IMPORT_FABRICS.length) return { added: 0, skipped: 0 };
    if (!opts.silent) {
      if (
        !global.confirm(
          `นำเข้ารายการสินค้าที่เตรียมไว้ ${BULK_IMPORT_FABRICS.length} รายการ? รหัสผ้าจะถูกเติม prefix ตามรหัสซัพพลายเออร์ปัจจุบันโดยอัตโนมัติ และระบบจะข้ามรหัสที่ซ้ำกับที่มีอยู่แล้วให้อัตโนมัติ`
        )
      )
        return { added: 0, skipped: 0 };
    }
    const suppliers = DB.getSuppliers();
    const supplierByName = new Map(suppliers.map((s) => [s.name.trim().toLowerCase(), s]));
    const existingKeys = new Set(
      DB.getFabrics(null, { onlyActive: false }).map((f) => (f.code || "").trim().toLowerCase())
    );
    let added = 0;
    let skipped = 0;
    BULK_IMPORT_FABRICS.forEach((row) => {
      const { code, supplierId } = computeBulkFabricCode(row, supplierByName);
      const key = code.trim().toLowerCase();
      if (!key || existingKeys.has(key)) {
        skipped++;
        return;
      }
      DB.addFabric({
        code: code,
        name: row.name,
        category: row.category,
        color: row.color || "",
        unit: row.unit || "หลา",
        sell_price: row.sell_price,
        cost_price: row.cost_price,
        reorder_point: row.reorder_point,
        supplier_id: supplierId,
        note: row.note || "",
      });
      existingKeys.add(key);
      added++;
    });
    if (added > 0 && refs.stockTableContainer) renderStockTable();
    if (!opts.silent) {
      global.alert(`นำเข้าสินค้าสำเร็จ ${added} ราย (ข้ามซ้ำ ${skipped} ราย)`);
    }
    return { added, skipped };
  }

  function applySupplierPrefixToFabrics() {
    const fabrics = DB.getFabrics(null, { onlyActive: false });
    if (fabrics.length === 0) {
      global.alert("ยังไม่มีสินค้าในคลัง");
      return;
    }
    if (
      !global.confirm(
        `ต้องการเติมรหัสซัพพลายเออร์ (3 ตัวท้ายของรหัสซัพพลายเออร์) ไว้หน้ารหัสผ้าทุกรายการที่มีซัพพลายเออร์หรือไม่? (รายการที่ขึ้นต้นด้วย prefix นี้อยู่แล้วจะไม่ถูกเติมซ้ำ — ถ้ารหัสมี prefix เก่าซ้อนอยู่ ให้ใช้ปุ่ม "ลบผ้าตามรหัสขึ้นต้น" ลบรายการที่ผิดออกก่อนแล้วนำเข้าใหม่)`
      )
    )
      return;
    let updated = 0;
    let skippedNoSupplier = 0;
    let skippedAlready = 0;
    fabrics.forEach((f) => {
      if (!f.supplier_id) {
        skippedNoSupplier++;
        return;
      }
      const sup = DB.getSupplier(f.supplier_id);
      if (!sup || !sup.code) {
        skippedNoSupplier++;
        return;
      }
      const prefix = sup.code.slice(-3);
      if (f.code.startsWith(prefix + "-")) {
        skippedAlready++;
        return;
      }
      DB.updateFabric(f.id, { code: prefix + "-" + f.code });
      updated++;
    });
    if (refs.stockTableContainer) renderStockTable();
    global.alert(
      `เติมรหัสซัพพลายเออร์เรียบร้อย ${updated} รายการ (ข้าม ${skippedAlready} รายการที่มีรหัสอยู่แล้ว, ข้าม ${skippedNoSupplier} รายการที่ไม่มีซัพพลายเออร์)`
    );
  }

  function renumberAllSupplierCodes() {
    const suppliers = [...store.suppliers].sort((a, b) => {
      const c = (a.code || "").localeCompare(b.code || "", undefined, { numeric: true });
      return c !== 0 ? c : a.id - b.id;
    });
    if (suppliers.length === 0) {
      global.alert("ยังไม่มีซัพพลายเออร์");
      return;
    }
    if (
      !global.confirm(
        `ต้องการออกรหัสซัพพลายเออร์ใหม่ทั้งหมด ${suppliers.length} ราย เรียงตามรหัส/ลำดับที่มีอยู่ให้เป็นชุดเดียวกันไม่ซ้ำกันหรือไม่?\nรหัสเดิมทั้งหมดจะถูกแทนที่ด้วยรหัสใหม่ (SU00001, SU00002, ...) และรหัสผ้าที่มี prefix ซัพพลายเออร์อยู่แล้วจะถูกปรับ prefix ให้ตรงกันโดยอัตโนมัติ การกระทำนี้ย้อนกลับไม่ได้`
      )
    )
      return;
    const allFabrics = DB.getFabrics(null, { onlyActive: false });
    let fabricsFixed = 0;
    suppliers.forEach((s, idx) => {
      const oldCode = s.code || "";
      const newCode = "SU" + String(idx + 1).padStart(5, "0");
      const oldPrefix = oldCode.slice(-3);
      const newPrefix = newCode.slice(-3);
      DB.updateSupplier(s.id, { code: newCode });
      if (oldPrefix === newPrefix || !oldPrefix) return;
      allFabrics
        .filter((f) => f.supplier_id === s.id && f.code.startsWith(oldPrefix + "-"))
        .forEach((f) => {
          DB.updateFabric(f.id, { code: newPrefix + f.code.slice(oldPrefix.length) });
          fabricsFixed++;
        });
    });
    renderSupplierTable();
    global.alert(
      `ออกรหัสซัพพลายเออร์ใหม่เรียบร้อย ${suppliers.length} ราย (SU00001 ถึง SU${String(suppliers.length).padStart(5, "0")}) ไม่มีรหัสซ้ำแล้ว` +
        (fabricsFixed ? ` และปรับ prefix รหัสผ้าให้ตรงกัน ${fabricsFixed} รายการ` : "")
    );
  }

  function openSupplierModal(sid) {

    const phoneInput = textInput(sup ? sup.phone : "");
    const addressInput = textInput(sup ? sup.address : "");
    const taxInput = textInput(sup ? sup.tax_id : "");
    const contactInput = textInput(sup ? sup.contact_person : "");
    const creditInput = numberInput(sup ? sup.credit_limit : 0);
    const noteInput = textInput(sup ? sup.note : "");
    const codeField = sup
      ? (() => {
          const codeInput = textInput(sup.code);
          codeInput.disabled = true;
          return formField("รหัสผู้จัดจำหน่าย", codeInput);
        })()
      : null;
    const form = el(
      "div",
      { class: "form-grid" },

      formField("ที่อยู่", addressInput),
      formField("เลขผู้เสียภาษี (ถ้ามี)", taxInput),
      formField("ผู้ติดต่อ", contactInput),

      formField("หมายเหตุ", noteInput)
    );
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const name = nameInput.value.trim();
          if (!name) {
            global.alert("กรุณากรอกชื่อซัพพลายเออร์");
            return;
          }
          const data = {
            name,
            phone: phoneInput.value.trim(),
            address: addressInput.value.trim(),
            tax_id: taxInput.value.trim(),
            contact_person: contactInput.value.trim(),
            credit_limit: Number(creditInput.value) || 0,
            note: noteInput.value.trim(),
          };

        },

    );

  }

  function openSupplierPayModal(sid) {
    const sup = DB.getSupplier(sid);
    if (sup.credit_balance <= 0) {
      global.alert("ไม่มียอดค้างชำระกับซัพพลายเออร์รายนี้");
      return;
    }
    const amountInput = numberInput(sup.credit_balance);
    const methodSelect = selectInput(
      [{ value: "เงินสด", label: "เงินสด" }, { value: "โอนเงิน", label: "โอนเงิน" }],
      "เงินสด"
    );
    const noteInput = textInput("");
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const amt = Number(amountInput.value);
          if (!amt || amt <= 0) {
            global.alert("กรุณาระบุจำนวนเงินให้ถูกต้อง");
            return;
          }
          if (amt > sup.credit_balance) {
            global.alert("จำนวนเงินมากกว่ายอดค้างชำระ");
            return;
          }
          DB.paySupplierCredit(sid, amt, methodSelect.value, noteInput.value.trim());
          closeModal();
          renderSupplierTable();
          global.alert(`บันทึกจ่ายชำระหนี้ ${money(amt)} บาท เรียบร้อย`);
        },
      },
      "บันทึกจ่ายชำระ"
    );
    const body = el(
      "div",
      {},
      el("p", { text: `${sup.name} ค้างชำระ ${money(sup.credit_balance)} บาท` }),
      formField("จำนวนเงินที่จ่าย", amountInput),
      formField("ช่องทาง", methodSelect),
      formField("หมายเหตุ", noteInput),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("supplierPay", { amountInput, methodSelect, noteInput, saveBtn });
    openModal("จ่ายชำระหนี้ซัพพลายเออร์", body);
  }

  function renderPurchaseTable() {
    const container = refs.purchaseTableContainer;
    clear(container);
    let purchases = DB.getPurchases();
    if (!purchaseShowAll) {
      const fromDate = purchaseDate || DB.todayStr();
      const toDate = purchaseDateTo || DB.todayStr();
      purchases = purchases.filter((p) => {
        const d = p.date.slice(0, 10);
        return d >= fromDate && d <= toDate;
      });
    }
    const pq = purchaseSearch.trim().toLowerCase();
    if (pq) {
      purchases = purchases.filter((p) => {
        const s = DB.getSupplier(p.supplier_id);
        const supName = s ? s.name : "";
        return (p.po_no || "").toLowerCase().includes(pq) || supName.toLowerCase().includes(pq);
      });
    }
    if (purchasePaymentFilter) {
      purchases = purchases.filter((p) => p.payment_status === purchasePaymentFilter);
    }
    if (refs.purchaseSummary) {
      const totalAmount = purchases.reduce((sum, p) => sum + p.total, 0);
      refs.purchaseSummary.textContent = `รวม ${purchases.length} ใบ ยอดรวม ${money(totalAmount)} บาท`;
    }
    const rows = purchases.map((p) => {
      const s = DB.getSupplier(p.supplier_id);
      return [
        p.po_no,
        fmtDate(p.date),
        s ? s.name : "",
        money(p.discount || 0),
        p.vat_amount ? money(p.vat_amount) : "-",
        money(p.total),
        p.status,
        p.payment_status,
      ];
    });
    const table = buildDataTable(
      ["เลขที่เอกสารรับเข้า", "วันที่", "ผู้จัดจำหน่าย", "ส่วนลด", "ภาษีมูลค่าเพิ่ม", "ยอดรวม", "สถานะรับของ", "สถานะชำระเงิน"],
      rows,
      {
        cellStyle: (row, ci, colName) =>
          colName === "สถานะชำระเงิน" && row[ci] === "ค้างชำระ" ? { color: "var(--danger)", fontWeight: "600" } : null,
        actions: (idx) => {
          const p = purchases[idx];
          const actions = [{ label: "ดูรายการ", onClick: () => openPurchaseItemsModal(p.id) }];
          if (p.status !== "รับสินค้าแล้ว") {
            actions.push({
              label: "รับสินค้า",
              onClick: () => {
                if (global.confirm("ยืนยันรับสินค้าเข้าสต็อกตามใบสั่งซื้อนี้?")) {
                  DB.receivePurchase(p.id);
                  renderPurchaseTable();
                }
              },
            });
          }
          if (p.paid < p.total) {
            actions.push({ label: "บันทึกจ่ายเงิน", onClick: () => openPurchasePayModal(p.id) });
          }
          if (p.payment_status === "ชำระแล้ว") {
            actions.push({
              label: "ยกเลิกการชำระ",
              onClick: () => {
                if (global.confirm(`ต้องการยกเลิกการชำระเงินของใบสั่งซื้อ ${p.po_no} กลับเป็นสถานะค้างชำระหรือไม่?`)) {
                  DB.unpayPurchase(p.id);
                  renderPurchaseTable();
                }
              },
            });
          }
          actions.push({ label: "แก้ไข", onClick: () => openPurchaseModal(p.id) });
          actions.push({
            label: "ลบ",
            onClick: () => {
              const msg =
                p.status === "รับสินค้าแล้ว"
                  ? `ใบสั่งซื้อ ${p.po_no} รับสินค้าเข้าสต็อกไปแล้ว การลบจะตัดสต็อกที่รับเข้าออกและปรับยอดหนี้ซัพพลายเออร์คืนให้อัตโนมัติ ต้องการลบหรือไม่?`
                  : `ต้องการลบใบสั่งซื้อ ${p.po_no} หรือไม่?`;
              if (global.confirm(msg)) {
                DB.deletePurchase(p.id);
                renderPurchaseTable();
              }
            },
          });
          return actions;
        },
      }
    );
    container.appendChild(table);
  }

  function openPurchaseModal(editPurchaseId) {
    const suppliers = DB.getSuppliers();
    const fabrics = DB.getFabrics();
    if (suppliers.length === 0) {
      global.alert("กรุณาเพิ่มซัพพลายเออร์ก่อน");
      return;
    }
    if (fabrics.length === 0) {
      global.alert("กรุณาเพิ่มรายการผ้าก่อน");
      return;
    }

    const editingPurchase = editPurchaseId ? DB.getPurchase(editPurchaseId) : null;

    let items = editingPurchase
      ? editingPurchase.items.map((it) => {
          const f = DB.getFabric(it.fabric_id);
          return {
            fabric_id: it.fabric_id,
            code: f ? f.code : "-",
            name: f ? f.name : "(สินค้านี้ถูกลบแล้ว)",
            category: f ? f.category : "",
            unit: f ? f.unit : "หลา",
            qty: it.qty,
            unit_cost: it.unit_cost,
            discount: it.discount || 0,
          };
        })
      : [];
    let currentPo = editingPurchase || null;

    const poNoInput = textInput(editingPurchase ? editingPurchase.po_no : "");
    poNoInput.setAttribute("placeholder", "ปล่อยว่างได้ ระบบจะออกเลขที่ให้อัตโนมัติ");
    poNoInput.addEventListener("input", () => {
      if (items.length > 0) syncPurchase();
    });
    const dateInput = dateInputEl({ value: editingPurchase ? editingPurchase.date : DB.todayStr() });
    dateInput.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
    const dueDateInput = dateInputEl({ value: editingPurchase ? editingPurchase.due_date || "" : "" });
    dueDateInput.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
    const supplierOptions = suppliers.map((s) => ({ value: String(s.id), label: `${s.code} - ${s.name}` }));
    const initialSupplierValue = editingPurchase
      ? String(editingPurchase.supplier_id)
      : supplierOptions[0]
      ? supplierOptions[0].value
      : "";
    const supplierSelect = searchSelectInput(
      supplierOptions,
      initialSupplierValue,
      "พิมพ์รหัส/ชื่อซัพพลายเออร์เพื่อค้นหา..."
    );
    supplierSelect._supplierId = Number(initialSupplierValue) || 0;
    supplierSelect.inputEl.addEventListener("change", () => {
      const v = supplierSelect.getMatchedValue();
      if (!v) {
        global.alert("ไม่พบซัพพลายเออร์ตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
        const cur = supplierOptions.find((o) => o.value === String(supplierSelect._supplierId));
        supplierSelect.setLabel(cur ? cur.label : "");
        return;
      }
      supplierSelect._supplierId = Number(v);
      if (items.length > 0) syncPurchase();
    });
    supplierSelect.getSupplierId = () => supplierSelect._supplierId;
    const paymentSelect = selectInput(
      [
        { value: "เงินเชื่อ", label: "เครดิต" },
        { value: "เงินสด", label: "เงินสด" },
        { value: "โอนเงิน", label: "โอนเงิน" },
      ],
      editingPurchase ? editingPurchase.payment_method : "เงินเชื่อ"
    );
    paymentSelect.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
        const fabricOptions = [{ value: "", label: "-- เลือกผ้า --" }].concat(
      fabrics.map((f) => ({ value: String(f.id), label: `${f.code} - ${f.name}` }))
    );
    // บันทึกรายการอัตโนมัติเมื่อออกจากช่องส่วนลด (ไม่ว่าจะกรอกหรือข้าม) แทนการหน่วงเวลา
    // เพื่อไม่ให้บันทึกไปก่อนที่จะกรอกส่วนลดเสร็จ ไม่ว่าจะพิมพ์ช้าหรือเร็วแค่ไหน
    function addItemFromRowNow(opts) {
      tryAddItemFromRow(opts || { alertOnInvalid: false });
    }
    const fabricSelect = searchSelectInput(fabricOptions, "", "พิมพ์รหัส/ชื่อผ้าเพื่อค้นหา...");
    fabricSelect.getFabricId = () => {
      const v = fabricSelect.getMatchedValue();
      return v ? Number(v) : 0;
    };
    // แสดงจำนวนคงเหลือในสต็อกปัจจุบันของผ้าที่กำลังจะรับเข้า ให้เห็นทันทีตอนเลือกผ้า
    const stockHint = el("span", { class: "stock-hint", text: "" });
    function updateStockHint() {
      const fid = fabricSelect.getFabricId();
      const fab = fid ? fabrics.find((f) => f.id === fid) : null;
      stockHint.textContent = fab ? `คงเหลือในสต็อก: ${round3(fab.stock_qty)} ${fab.unit}` : "";
    }
    fabricSelect.inputEl.addEventListener("change", () => {
      const v = fabricSelect.getMatchedValue();
      if (v === null) {
        global.alert("ไม่พบผ้าตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
        fabricSelect.setLabel("");
        updateStockHint();
        return;
      }
      updateStockHint();
      addItemFromRowNow({ alertOnInvalid: false });
    });
    const qtyInput = numberInput("");
    qtyInput.setAttribute("placeholder", "จำนวน");
    const unitSelect = selectInput(
      [
        { value: "หลา", label: "หลา" },
        { value: "เมตร", label: "เมตร" },
      ],
      "หลา"
    );
    const costInput = numberInput("");
    costInput.setAttribute("placeholder", "ราคาทุน/หน่วย");
    const itemDiscInput = numberInput("");
    itemDiscInput.setAttribute("placeholder", "ส่วนลด");
    const itemDiscUnitSelect = selectInput(
      [
        { value: "บาท", label: "บาท" },
        { value: "%", label: "%" },
      ],
      "บาท"
    );
    const itemDiscRow = el("div", { class: "discount-input-row" }, itemDiscInput, itemDiscUnitSelect);
    // บันทึกเมื่อโฟกัสออกจาก "กลุ่ม" ช่องส่วนลดทั้งหมด (ตัวเลข + หน่วย) เท่านั้น ไม่ใช่ทีละช่อง
    // เพื่อรองรับทั้งกรณีเลือกหน่วยก่อนแล้วค่อยพิมพ์ตัวเลข และพิมพ์ตัวเลขก่อนแล้วค่อยเลือกหน่วย
    // (ใช้ focusout เพราะ bubble ได้ ต่างจาก blur ที่ไม่ bubble, เช็ค relatedTarget ว่ายังอยู่ในกลุ่มเดิมหรือไม่)
    itemDiscRow.addEventListener("focusout", (e) => {
      if (e.relatedTarget && itemDiscRow.contains(e.relatedTarget)) return;
      addItemFromRowNow({ alertOnInvalid: false });
    });
    const itemsContainer = el("div", { class: "table-container" });
    const vatChk = el("input", { type: "checkbox", checked: editingPurchase ? editingPurchase.vat_amount > 0 : false });
    vatChk.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
    const autoSaveStatus = el("div", { class: "totals-line", text: "" });

    // บันทึกอัตโนมัติทุกครั้งที่มีการเพิ่ม/ลบ/แก้ไขรายการ ไม่ต้องกดปุ่มบันทึกเอง
    // และรับสินค้าเข้าสต็อก/ตั้งยอดหนี้ซัพพลายเออร์ให้ทันที ไม่ต้องกดรับสินค้าเองอีกขั้นตอน
    function syncPurchase() {
      if (items.length === 0) {
        if (currentPo) {
          DB.deletePurchase(currentPo.id);
          currentPo = null;
        }
        autoSaveStatus.textContent = "";
        renderPurchaseTable();
        return;
      }
      // เลขที่เอกสารรับเข้าปล่อยว่างได้ ถ้าไม่กรอกระบบจะออกเลขที่ให้อัตโนมัติแล้วเติมกลับเข้าช่องให้เห็น
      let poNo = poNoInput.value.trim();
      if (!poNo) {
        poNo = currentPo ? currentPo.po_no : DB.genPoNo();
      }
      const subtotal = items.reduce((s, it) => s + it.qty * it.unit_cost, 0);
      const discount = items.reduce((s, it) => s + (it.discount || 0), 0);
      const vatBase = Math.max(0, subtotal - discount);
      const vat = vatChk.checked ? Math.round(vatBase * VAT_RATE * 100) / 100 : 0;
      // แปลงจำนวน/ราคาทุนที่กรอก (หน่วยที่เลือกรับ) ให้เป็นหน่วยฐานของสินค้าก่อนบันทึก เพื่อให้สต็อกถูกต้อง
      const convertedItems = items.map((it) => {
        const fab = fabrics.find((f) => f.id === it.fabric_id);
        const factor = fab ? unitFactor(it.unit, fab.unit) : 1;
        return {
          fabric_id: it.fabric_id,
          qty: it.qty * factor,
          unit_cost: factor ? it.unit_cost / factor : it.unit_cost,
          discount: it.discount || 0,
        };
      });
      if (!currentPo) {
        currentPo = DB.createPurchase(
          convertedItems,
          supplierSelect.getSupplierId(),
          discount,
          vat,
          paymentSelect.value,
          "",
          dateInput.value || DB.todayStr(),
          poNo,
          dueDateInput.value || ""
        );
      } else {
        currentPo = DB.updatePurchase(
          currentPo.id,
          convertedItems,
          supplierSelect.getSupplierId(),
          discount,
          vat,
          paymentSelect.value,
          "",
          dateInput.value || DB.todayStr(),
          poNo,
          dueDateInput.value || ""
        );
      }
      if (poNoInput.value.trim() !== currentPo.po_no) poNoInput.value = currentPo.po_no;
      autoSaveStatus.textContent = `บันทึกอัตโนมัติแล้ว (${currentPo.po_no}) ยอดรวม ${money(currentPo.total)} บาท`;
      renderPurchaseTable();
    }

    function refreshItemsTable() {
      clear(itemsContainer);
      const table = buildDataTable(
        ["รหัสสินค้า", "ชื่อผ้า", "ชนิดผ้า", "จำนวน", "หน่วย", "ราคาทุน/หน่วย", "ส่วนลด", "รวม"],
        items.map((it) => [
          it.code,
          it.name,
          it.category || "-",
          it.qty,
          it.unit,
          money(it.unit_cost),
          money(it.discount || 0),
          money(it.qty * it.unit_cost - (it.discount || 0)),
        ]),
        {
          actions: (idx) => [
            {
              label: "ลบ",
              onClick: () => {
                if (items.length === 1 && currentPo && currentPo.status === "รับสินค้าแล้ว") {
                  if (
                    !global.confirm(
                      `ใบสั่งซื้อ ${currentPo.po_no} รับสินค้าเข้าสต็อกไปแล้ว การลบรายการสุดท้ายจะลบใบสั่งซื้อนี้ทิ้งทั้งใบ และตัดสต็อก/ปรับยอดหนี้ซัพพลายเออร์คืนให้อัตโนมัติ ต้องการดำเนินการต่อหรือไม่?`
                    )
                  ) {
                    return;
                  }
                }
                items.splice(idx, 1);
                refreshItemsTable();
                syncPurchase();
              },
            },
          ],
        }
      );
      itemsContainer.appendChild(table);
    }
    refreshItemsTable();

    // เพิ่มรายการสินค้าเข้าตะกร้าจากแถวกรอก ถ้า alertOnInvalid=false จะไม่โชว์แจ้งเตือนเวลาข้อมูลยังกรอกไม่ครบ
    // (ใช้เรียกอัตโนมัติทุกครั้งที่กรอกครบทั้งเลือกผ้า/จำนวน/ราคาทุน โดยไม่ต้องกดปุ่ม "เพิ่มรายการ" เอง)
    function tryAddItemFromRow(opts) {
      opts = opts || {};
      const matched = fabricSelect.getMatchedValue();
      if (!matched) {
        if (opts.alertOnInvalid) global.alert("กรุณาเลือกสินค้าและกรอกจำนวนให้ถูกต้อง");
        return false;
      }
      const fid = Number(matched) || 0;
      const fab = fabrics.find((f) => f.id === fid);
      const qty = Number(qtyInput.value);
      const cost = Number(costInput.value);
      if (!fab || !qty || qty <= 0) {
        if (opts.alertOnInvalid) global.alert("กรุณาเลือกสินค้าและกรอกจำนวนให้ถูกต้อง");
        return false;
      }
      if (costInput.value === "" || cost < 0) {
        if (opts.alertOnInvalid) global.alert("กรุณากรอกราคาทุน");
        return false;
      }
      const discRaw = Number(itemDiscInput.value) || 0;
      const lineSubtotal = qty * cost;
      const discount = itemDiscUnitSelect.value === "%" ? round2((lineSubtotal * discRaw) / 100) : discRaw;
      items.push({
        fabric_id: fid,
        code: fab.code,
        name: fab.name,
        category: fab.category,
        unit: unitSelect.value || "หลา",
        qty,
        unit_cost: cost,
        discount,
      });
      fabricSelect.setLabel("");
      qtyInput.value = "";
      costInput.value = "";
      itemDiscInput.value = "";
      itemDiscUnitSelect.value = "บาท";
      updateStockHint();
      refreshItemsTable();
      syncPurchase();
      return true;
    }

    const addItemBtn = el(
      "button",
      {
        class: "btn btn-sm btn-primary",
        onClick: () => tryAddItemFromRow({ alertOnInvalid: true }),
      },
      "เพิ่มรายการ"
    );

    const addRow = el(
      "div",
      { class: "toolbar" },
      fabricSelect,
      stockHint,
      qtyInput,
      unitSelect,
      costInput,
      itemDiscRow,
      addItemBtn
    );

    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          tryAddItemFromRow({ alertOnInvalid: false });
          syncPurchase();
          closeModal();
          renderPurchaseTable();
        },
      },
      "เสร็จสิ้น"
    );

    const body = el(
      "div",
      {},
      el(
        "div",
        { class: "form-grid" },
        formField("ร้านผู้จัดจำหน่าย", supplierSelect),
        formField("เลขที่เอกสารรับเข้า", poNoInput),
        formField("วันที่เอกสาร", dateInput),
        formField("วันที่ครบกำหนดชำระเงิน", dueDateInput),
        formField("ชำระโดย", paymentSelect)
      ),
      el("h4", { text: "รายการสินค้า" }),
      addRow,
      itemsContainer,
      el("label", { class: "chk-label" }, vatChk, ` คิดภาษีมูลค่าเพิ่ม ${Math.round(VAT_RATE * 100)}%`),
      autoSaveStatus,
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("purchaseForm", {
      poNoInput, dateInput, dueDateInput, supplierSelect, paymentSelect,
      fabricSelect, qtyInput, unitSelect, costInput, itemDiscInput, itemDiscUnitSelect, addItemBtn, saveBtn,
      getItems: () => items,

  }

  function openPurchasePayModal(pid) {
    const p = DB.getPurchase(pid);
    const remain = p.total - p.paid;
    const amountInput = numberInput(remain);
    const methodSelect = selectInput(
      [
        { value: "เงินสด", label: "เงินสด" },
        { value: "โอนเงิน", label: "โอนเงิน" },
      ],
      "เงินสด"
    );
    const accountSplit = buildAccountSplitRows(remain);
    const accountSplitRow = formField("จ่ายจากบัญชี (แบ่งหลายบัญชีได้)", el("div", {}, accountSplit.container, accountSplit.addBtn));
    function updateAccountRowVisibility() {
      accountSplitRow.style.display = methodSelect.value === "โอนเงิน" ? "" : "none";
      if (methodSelect.value === "โอนเงิน") accountSplit.reset(Number(amountInput.value) || remain);
    }
    methodSelect.addEventListener("change", updateAccountRowVisibility);
    updateAccountRowVisibility();
    amountInput.addEventListener("input", () => {
      // ถ้าเป็นโอนเงินและยังไม่ได้แบ่งหลายบัญชี ก็อปยอดมาใส่ให้เลยไม่ต้องพิมพ์ซ้ำ
      if (methodSelect.value === "โอนเงิน") accountSplit.syncAmountIfSingle(amountInput.value);
    });
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const amt = Number(amountInput.value);
          if (!amt || amt <= 0 || amt > remain) {
            global.alert("กรุณาระบุจำนวนเงินให้ถูกต้อง");
            return;
          }
          const method = methodSelect.value;
          let accountSplits = [];
          if (method === "โอนเงิน") {
            accountSplits = accountSplit.getSplits();
            if (accountSplits.length === 0) {
              global.alert("กรุณาเลือกบัญชีที่จ่ายเงิน");
              return;
            }
            const splitTotal = accountSplit.getTotal();
            if (splitTotal !== amt) {
              global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดที่จ่าย (${money(amt)}) กรุณาตรวจสอบ`);
              return;
            }
          }
          DB.payPurchase(pid, amt, method, accountSplits);
          if (p.payment_method === "เงินเชื่อ") {
            DB.paySupplierCredit(p.supplier_id, amt, "เงินสด", `ชำระตาม PO ${p.po_no}`);
          }
          closeModal();
          renderPurchaseTable();
        },
      },
      "บันทึกจ่ายเงิน"
    );
    const body = el(
      "div",
      {},
      el("p", { text: `ค้างชำระ ${money(remain)} บาท` }),
      formField("จำนวนที่จ่าย", amountInput),
      formField("จ่ายโดย", methodSelect),
      accountSplitRow,
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("purchasePay", { amountInput, methodSelect, accountSplit, saveBtn });
    openModal("บันทึกจ่ายเงิน", body);
  }

  function renderBackorderTable() {
    const container = refs.backorderTableContainer;
    if (!container) return;
    clear(container);
    let rows = DB.getBackorders();
    if (backorderStatusFilter === "เสร็จแล้ว") rows = rows.filter((b) => b.done);
    else if (backorderStatusFilter === "สินค้าหมด") rows = rows.filter((b) => !b.done && b.status === "สินค้าหมด");
    const withCustomer = rows.map((b) => ({ b, c: b.customer_id ? DB.getCustomer(b.customer_id) : null }));
    const q = backorderSearch.trim().toLowerCase();
    let filtered = withCustomer;
    if (q) {
      filtered = withCustomer.filter(({ b, c }) => {
        const name = c ? c.name : b.customer_name || "";
        const code = c ? c.code : "";
        const phone = c ? c.phone : b.customer_phone || "";
        return (
          name.toLowerCase().includes(q) ||
          code.toLowerCase().includes(q) ||
          (phone || "").includes(q) ||
          (b.fabric_name || "").toLowerCase().includes(q)
        );
      });
    }
    rows = filtered.map((x) => x.b);
    const table = buildDataTable(
      ["วันที่", "ลูกค้า", "เบอร์โทร", "ผ้าที่ต้องการ", "จำนวน", "สถานะ", "หมายเหตุ"],
      filtered.map(({ b, c }) => [
        fmtDate(b.date),
        c ? `${c.code} - ${c.name}` : b.customer_name || "-",
        c ? c.phone || "-" : b.customer_phone || "-",
        b.fabric_name || "-",
        `${b.qty || 0} ${b.unit || ""}`,
        b.done ? "เสร็จแล้ว" : b.status,
        b.note || "",
      ]),
      {
        cellStyle: (row, ci, colName) => {
          if (colName === "สถานะ" && (row[ci] === "สินค้าหมด" || row[ci] === "รอย้อม")) return { color: "var(--danger)", fontWeight: "600" };
          if (colName === "สถานะ" && row[ci] === "เสร็จแล้ว") return { color: "var(--text-muted)" };
          return null;
        },
        actions: (idx) => {
          const b = rows[idx];
          const actions = [{ label: "แก้ไข", onClick: () => openBackorderModal(b.id) }];
          if (b.done) {
            actions.push({ label: "ยกเลิกเสร็จแล้ว", onClick: () => { DB.markBackorderUndone(b.id); renderBackorderTable(); updateBackordersBadge(); } });
          } else {
            actions.push({ label: "เสร็จแล้ว", onClick: () => { DB.markBackorderDone(b.id); renderBackorderTable(); updateBackordersBadge(); } });
          }
          actions.push({ label: "ลบ", onClick: () => {
            if (global.confirm(`ต้องการลบรายการของ "${b.customer_name || "-"}" หรือไม่?`)) {
              DB.deleteBackorder(b.id); renderBackorderTable(); updateBackordersBadge();
            }
          }});
          return actions;
        },
      }
    );
    container.appendChild(table);
  }

  // ดึงคำขอสั่งผ้าจากลิงก์สาธารณะ (order.html) เข้ามาเป็นรายการลูกค้าสั่งผ้า
  async function pullOnlineOrderRequests() {
    const btn = refs.pullOrderRequestsBtn;
    if (btn) {
      btn.disabled = true;
      btn.textContent = "กำลังดึงคำขอ...";
    }
    try {
      // ใช้ access token ของผู้ใช้ที่ล็อกอินอยู่แทน anon key ตรงๆ เพราะตาราง order_requests จำกัดสิทธิ์ SELECT/UPDATE ไว้เฉพาะผู้ที่ล็อกอินแล้วเท่านั้น
      let authToken = global.__SUPABASE_ANON_KEY__;
      if (global.__supabaseClient__) {
        try {
          const { data: sessionData } = await global.__supabaseClient__.auth.getSession();
          if (sessionData && sessionData.session && sessionData.session.access_token) {
            authToken = sessionData.session.access_token;
          }
        } catch (e) {}
      }
      const url = global.__SUPABASE_URL__ + "/rest/v1/order_requests?status=eq.new&select=*&order=created_at.asc";
      const res = await fetch(url, {
        headers: {
          apikey: global.__SUPABASE_ANON_KEY__,
          Authorization: "Bearer " + authToken,
        },
      });
      if (!res.ok) throw new Error("โหลดคำขอไม่สำเร็จ");
      const requests = await res.json();
      if (!requests || requests.length === 0) {
        global.alert("ไม่มีคำขอใหม่จากลูกค้า");
        return;
      }
      const customers = DB.getCustomers();
      for (const r of requests) {
        let customerId = null;
        if (r.customer_code) {
          const code = String(r.customer_code).trim().toLowerCase();
          const match = customers.find((c) => (c.code || "").trim().toLowerCase() === code);
          if (match) customerId = match.id;
        }
        const items = Array.isArray(r.items) && r.items.length
          ? r.items.map((it) => ({ fabric_text: it.fabric_text || "", qty: it.qty || 0, unit: it.unit || "" }))
          : [];
        DB.addCustomerOrder({
          customer_id: customerId,
          customer_name: r.customer_name || "",
          customer_phone: r.customer_phone || "",
          shipping_method: r.shipping_method || "",
          shipping_address: r.shipping_address || "",
          items,
          status: "รอดำเนินการ",
          note: [r.note, "(คำขอจากลิงก์ออนไลน์)"].filter(Boolean).join(" "),
        });
        fetch(global.__SUPABASE_URL__ + "/rest/v1/order_requests?id=eq." + r.id, {
          method: "PATCH",
          headers: {
            apikey: global.__SUPABASE_ANON_KEY__,
            Authorization: "Bearer " + authToken,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ status: "pulled" }),
        }).catch(() => {});
      }
      renderCustomerOrderTable();
      updateCustomerOrdersBadge();
      global.alert(`ดึงคำขอใหม่จากลูกค้าเรียบร้อย ${requests.length} คำขอ`);
    } catch (e) {
      global.alert("เกิดข้อผิดพลาดในการดึงคำขอ กรุณาลองใหม่อีกครั้ง");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = "ดึงคำขอใหม่จากลูกค้า";
      }
    }
  }

  function formatCustomerOrderItems(items) {
    if (!items || items.length === 0) return "-";
    return items
      .map((it, i) => `${i + 1}. ${it.fabric_text || "-"}${it.qty ? ` (${it.qty}${it.unit ? " " + it.unit : ""})` : ""}`)
      .join("  |  ");
  }

  function renderCustomerOrderTable() {
    const container = refs.customerOrderTableContainer;
    if (!container) return;
    clear(container);
    let rows = DB.getCustomerOrders();
    if (!customerOrderShowDone) rows = rows.filter((o) => !o.done);
    const withCustomer = rows.map((o) => ({ o, c: o.customer_id ? DB.getCustomer(o.customer_id) : null }));
    const q = customerOrderSearch.trim().toLowerCase();
    let filtered = withCustomer;
    if (q) {
      filtered = withCustomer.filter(({ o, c }) => {
        const name = c ? c.name : o.customer_name || "";
        const code = c ? c.code : "";
        const phone = c ? c.phone : o.customer_phone || "";
        const itemsText = (o.items || []).map((it) => it.fabric_text || "").join(" ");
        return (
          name.toLowerCase().includes(q) ||
          code.toLowerCase().includes(q) ||
          (phone || "").includes(q) ||
          itemsText.toLowerCase().includes(q)
        );
      });
    }
    rows = filtered.map((x) => x.o);
    const table = buildDataTable(
      ["วันที่", "ลูกค้า", "เบอร์โทร", "รายการผ้า", "วิธีจัดส่ง", "ที่อยู่จัดส่ง", "สถานะ", "หมายเหตุ"],
      filtered.map(({ o, c }) => [
        fmtDate(o.date),
        c ? `${c.code} - ${c.name}` : o.customer_name || "-",
        c ? c.phone || "-" : o.customer_phone || "-",
        formatCustomerOrderItems(o.items),
        o.shipping_method || "-",
        o.shipping_address || "-",
        o.done ? "เสร็จแล้ว" : o.status,
        o.note || "",
      ]),
      {
        cellStyle: (row, ci, colName) => {
          if (colName === "สถานะ" && row[ci] === "เสร็จแล้ว") return { color: "var(--text-muted)" };
          return null;
        },
        actions: (idx) => {
          const o = rows[idx];
          const actions = [{ label: "แก้ไข", onClick: () => openCustomerOrderModal(o.id) }];
          if (o.done) {
            actions.push({
              label: "ยกเลิกเสร็จแล้ว",
              onClick: () => {
                DB.markCustomerOrderUndone(o.id);
                renderCustomerOrderTable();
                updateCustomerOrdersBadge();
              },
            });
          } else {
            actions.push({
              label: "เสร็จแล้ว",
              onClick: () => {
                DB.markCustomerOrderDone(o.id);
                renderCustomerOrderTable();
                updateCustomerOrdersBadge();
              },
            });
          }
          actions.push({
            label: "ลบ",
            onClick: () => {
              if (global.confirm(`ต้องการลบรายการของ "${o.customer_name || "-"}" หรือไม่?`)) {
                DB.deleteCustomerOrder(o.id);
                renderCustomerOrderTable();
                updateCustomerOrdersBadge();
              }
            },
          });
          return actions;
        },
      }
    );
    container.appendChild(table);
  }

  function quotationTotal(q) {
    const subtotal = (q.items || []).reduce((s, it) => s + (Number(it.qty) || 0) * (Number(it.unit_price) || 0), 0);
    const vat = q.is_vat ? Math.round(subtotal * VAT_RATE * 100) / 100 : 0;
    const shippingFee = Number(q.shipping_fee) || 0;
    return { subtotal, vat, shippingFee, total: subtotal + vat + shippingFee };
  }

  function renderQuotationTable() {
    const container = refs.quotationTableContainer;
    if (!container) return;
    clear(container);
    const rows = DB.getQuotations(quotationSearch);
    const table = buildDataTable(
      ["เลขที่", "วันที่", "ลูกค้า", "ยอดรวม", "สถานะ"],
      rows.map((q) => {
        const { total } = quotationTotal(q);
        return [q.quote_no, fmtDate(q.date), q.customer_name || "-", money(total) + " บาท", q.status];
      }),
      {
        cellStyle: (row, ci, colName) => (colName === "สถานะ" && row[ci] === "ตอบรับแล้ว" ? { color: "var(--success, #2e7d32)", fontWeight: "600" } : null),
        actions: (idx) => {
          const q = rows[idx];
          const acts = [
            { label: "ดู/พิมพ์", onClick: () => openQuotationDocModal(q) },
            { label: "แก้ไข", onClick: () => openQuotationModal(q) },
          ];
          if (q.status !== "ตอบรับแล้ว") {
            acts.push({
              label: "ทำเครื่องหมายตอบรับแล้ว",
              onClick: () => {
                DB.setQuotationStatus(q.id, "ตอบรับแล้ว");
                renderQuotationTable();
              },
            });
          } else {
            acts.push({
              label: "ทำเครื่องหมายรอตอบรับ",
              onClick: () => {
                DB.setQuotationStatus(q.id, "รอตอบรับ");
                renderQuotationTable();
              },
            });
          }
          if (!q.converted_sale_id) {
            acts.push({ label: "แปลงเป็นบิลขาย", onClick: () => convertQuotationToSale(q) });
          }
          acts.push({
            label: "ลบ",
            onClick: () => {
              if (!global.confirm(`ยืนยันลบใบเสนอราคา ${q.quote_no}?`)) return;

              renderQuotationTable();

          return acts;
        },
      }
    );

  function convertQuotationToSale(q) {

    cart = (q.items || []).map((it) => {
      const f = it.fabric_id ? DB.getFabric(it.fabric_id) : null;
      return {
        fabric_id: it.fabric_id || null,
        is_misc: !it.fabric_id,
        name: it.name || "",
        code: it.code || "",

        unit_price: it.unit_price || 0,

        class: "btn btn-primary",

          errorMsg.textContent = "";
          const customerId = customerSelect.getCustomerId();
          const customer = customerId ? DB.getCustomer(customerId) : null;
          const cleanItems = modalItems
            .filter((it) => (it.name || "").trim() && Number(it.qty) > 0)
            .map((it) => ({
              fabric_id: it.fabric_id || null,
              code: it.code || "",
              name: (it.name || "").trim(),
              color: (it.color || "").trim(),
              qty: Number(it.qty) || 0,
              unit: it.unit || "หลา",
              unit_price: Number(it.unit_price) || 0,
            }));
          if (cleanItems.length === 0) {
            errorMsg.textContent = "กรุณาเพิ่มรายการอย่างน้อย 1 รายการ (ระบุชื่อและจำนวน)";
            return;
          }
          const data = {
            customer_id: customerId || null,
            customer_name: customer ? customer.name : "ลูกค้าทั่วไป",
            customer_address: customer ? customer.address || "" : "",
            customer_phone: customer ? customer.phone || "" : "",
            valid_until: validUntilInput.value || "",
            is_vat: isVatChk.checked,
            shipping_fee: Number(shippingFeeInput.value) || 0,
            note: noteInput.value.trim(),
            items: cleanItems,
          };
          if (existing) {
            DB.updateQuotation(existing.id, data);
          } else {
            DB.addQuotation(data);
          }
          closeModal();
          renderQuotationTable();
        },
      },
      "บันทึก"
    );

    const form = el(
      "div",
      { class: "form-panel" },
      formField("ลูกค้า", customerSelect),
      formField("รายการสินค้า", el("div", {}, itemsContainer, addItemBtn)),
      el("label", { class: "chk-label", style: { display: "block", margin: "10px 0" } }, isVatChk, ` คิดภาษีมูลค่าเพิ่ม ${Math.round(VAT_RATE * 100)}%`),
      formField("ค่าจัดส่ง (บาท)", shippingFeeInput),
      formField("ใช้ได้ถึงวันที่ (ถ้ามี)", validUntilInput),
      formField("หมายเหตุ/เงื่อนไข", noteInput),
      errorMsg,
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("quotationForm", { customerSelect, validUntilInput, isVatChk, shippingFeeInput, noteInput, saveBtn });
    openModal(existing ? "แก้ไขใบเสนอราคา" : "สร้างใบเสนอราคา", form, { wide: true });
  }

  function buildQuotationDoc(q, shop, cust, payAccountLabel) {
    const custName = q.customer_name || "ลูกค้าทั่วไป";
    const { subtotal, vat, shippingFee, total } = quotationTotal(q);
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const validUntilDisplay = q.valid_until ? fmtDate(q.valid_until) : "";
    const noteTrimmed = q.note ? String(q.note).trim() : "";

    const lines = [];
    lines.push("ใบเสนอราคา");
    lines.push(`เลขที่: ${q.quote_no}`);
    lines.push(`วันที่: ${fmtDate(q.date)}`);
    lines.push(`ลูกค้า: ${custName}`);
    if (q.customer_address) lines.push(`ที่อยู่: ${q.customer_address}`);
    if (validUntilDisplay) lines.push(`ใช้ได้ถึง: ${validUntilDisplay}`);
    lines.push("-".repeat(40));
    (q.items || []).forEach((it) => {
      const sub = (Number(it.qty) || 0) * (Number(it.unit_price) || 0);
      const qtyUnit = `${it.qty}${it.unit ? " " + it.unit : ""}`;
      const label = it.code || it.name || "";
      lines.push(
        `${label.slice(0, 20).padEnd(20)}${qtyUnit.padStart(10)} x ${money(it.unit_price).padStart(9)} = ${money(sub).padStart(11)}`
      );
      if (it.color) lines.push(`    (${it.color})`);
    });
    lines.push("-".repeat(40));
    if (q.is_vat) {
      lines.push(`${"ยอดก่อน VAT".padEnd(24)}${money(subtotal).padStart(14)}`);
      lines.push(`${("VAT " + Math.round(VAT_RATE * 100) + "%").padEnd(24)}${money(vat).padStart(14)}`);
    }
    if (shippingFee) lines.push(`${"ค่าจัดส่ง".padEnd(24)}${money(shippingFee).padStart(14)}`);
    lines.push(`${"ราคารวม".padEnd(24)}${money(total).padStart(14)}`);
    const linesNoSign = lines.slice();
    lines.push("");
    lines.push("ข้าพเจ้าตกลงสั่งซื้อสินค้าตามรายการ และเงื่อนไขทั้งหมด");
    lines.push("");
    lines.push("ลงชื่อ..................................... ผู้รับเสนอราคา");
    lines.push("ลงชื่อ..................................... ผู้อนุมัติ");
    if (noteTrimmed) {
      lines.push("");
      lines.push("-".repeat(40));
      lines.push(`หมายเหตุ: ${noteTrimmed}`);
      linesNoSign.push("");
      linesNoSign.push("-".repeat(40));
      linesNoSign.push(`หมายเหตุ: ${noteTrimmed}`);
    }
    if (payAccountLabel) {
      lines.push("");
      lines.push(`บัญชีสำหรับโอนเงิน: ${payAccountLabel}`);
      linesNoSign.push("");
      linesNoSign.push(`บัญชีสำหรับโอนเงิน: ${payAccountLabel}`);
    }
    const text = lines.join("\n");
    const textForCopy = linesNoSign.join("\n");

    const itemRows = (q.items || [])
      .map((it, i) => {
        const sub = (Number(it.qty) || 0) * (Number(it.unit_price) || 0);
        const qtyUnit = `${it.qty}${it.unit ? " " + it.unit : ""}`;
        const label = [it.code, it.name].filter(Boolean).join(" - ") || it.name || "-";
        const colorHtml = it.color ? `<div style="font-size:10.5px;color:#666;margin-top:2px;">${esc(it.color)}</div>` : "";
        const rowBorder = i === (q.items || []).length - 1 ? "" : "border-bottom:1px dotted #999;";
        return `<tr><td style="padding:7px 4px;${rowBorder}">${esc(label)}${colorHtml}</td><td style="padding:7px 4px;text-align:right;${rowBorder}">${esc(
          qtyUnit
        )}</td><td style="padding:7px 4px;text-align:right;${rowBorder}">${money(it.unit_price)}</td><td style="padding:7px 4px;text-align:right;${rowBorder}">${money(sub)}</td></tr>`;
      })
      .join("");

    let vatRowsHtml = "";
    if (q.is_vat) {
      vatRowsHtml = `<tr><td style="padding:2px 0;color:#444;">ยอดก่อน VAT</td><td style="padding:2px 0;text-align:right;">${money(
        subtotal
      )}</td></tr><tr><td style="padding:2px 0;color:#444;">VAT ${Math.round(VAT_RATE * 100)}%</td><td style="padding:2px 0;text-align:right;">${money(
        vat
      )}</td></tr>`;
    }
    if (shippingFee) {
      vatRowsHtml += `<tr><td style="padding:2px 0;color:#444;">ค่าจัดส่ง</td><td style="padding:2px 0;text-align:right;">${money(shippingFee)}</td></tr>`;
    }
    const custAddressRow = q.customer_address
      ? `<tr><td style="padding:3px 0;color:#444;">ที่อยู่</td><td style="padding:3px 0;text-align:right;">${esc(q.customer_address)}</td></tr>`
      : "";
    const validUntilRow = validUntilDisplay
      ? `<tr><td style="padding:3px 0;color:#444;">ใช้ได้ถึง</td><td style="padding:3px 0;text-align:right;">${esc(validUntilDisplay)}</td></tr>`
      : "";
    const noteHtml = noteTrimmed
      ? `<div style="font-size:12px;color:#111;margin-top:16px;padding-top:8px;border-top:1px dashed #999;">หมายเหตุ: ${esc(noteTrimmed)}</div>`
      : "";
    const payAccountHtml = payAccountLabel
      ? `<div style="font-size:12px;color:#111;margin-top:14px;padding-top:8px;border-top:1px dashed #999;">บัญชีสำหรับโอนเงิน: ${esc(payAccountLabel)}</div>`
      : "";
    const html = `
      <div style="max-width:380px;margin:0;font-family:Tahoma,'Segoe UI',sans-serif;color:#111;">
        <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px;">
          <div style="font-size:17px;font-weight:bold;letter-spacing:0.5px;">ใบเสนอราคา</div>
          <div style="font-size:11px;color:#888;margin-top:3px;">เลขที่ ${esc(q.quote_no)}</div>
        </div>
        <table style="width:100%;font-size:12px;margin-bottom:12px;border-collapse:collapse;">
          <tr><td style="padding:3px 0;color:#444;">วันที่</td><td style="padding:3px 0;text-align:right;">${esc(fmtDate(q.date))}</td></tr>
          <tr><td style="padding:3px 0;color:#444;">ลูกค้า</td><td style="padding:3px 0;text-align:right;font-weight:bold;font-size:14px;">${esc(custName)}</td></tr>
          ${custAddressRow}
          ${validUntilRow}
        </table>
        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;">
          <thead>
            <tr style="border-top:1.5px solid #000;border-bottom:1.5px solid #000;">
              <th style="text-align:left;padding:6px 4px;">รายการ</th>
              <th style="text-align:right;padding:6px 4px;">จำนวน</th>
              <th style="text-align:right;padding:6px 4px;">ราคา</th>
              <th style="text-align:right;padding:6px 4px;">รวม</th>
            </tr>
          </thead>
          <tbody>${itemRows}</tbody>
        </table>
        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:6px;">${vatRowsHtml}</table>
        <div style="border:1.5px solid #000;border-radius:4px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px;">
          <span style="font-weight:bold;font-size:14px;">ราคารวม</span>
          <span style="font-weight:bold;font-size:16px;">${money(total)} บาท</span>
        </div>
        <div style="font-size:12px;color:#444;text-align:center;margin-bottom:18px;">ข้าพเจ้าตกลงสั่งซื้อสินค้าตามรายการ และเงื่อนไขทั้งหมด</div>
        <div style="display:flex;justify-content:space-between;margin-top:28px;font-size:11px;text-align:center;color:#000;">
          <div style="width:45%;border-top:1px solid #000;padding-top:4px;">ผู้รับเสนอราคา</div>
          <div style="width:45%;border-top:1px solid #000;padding-top:4px;">ผู้อนุมัติ</div>
        </div>
        ${noteHtml}
        ${payAccountHtml}
      </div>`;

    return { docTitle: "ใบเสนอราคา", text, textForCopy, html };
  }

  function openQuotationDocModal(q) {
    const shop = DB.getShopInfo();
    const cust = q.customer_id ? DB.getCustomer(q.customer_id) : null;
    const accountSelect = buildBankAccountSelect(getCustomerPreferredAccountId(cust));
    let current = buildQuotationDoc(q, shop, cust, payAccountLabelFromSelect(accountSelect));
    const previewBox = el("div", { class: "receipt-preview" });
    previewBox.innerHTML = current.html;
    function refresh() {
      current = buildQuotationDoc(q, shop, cust, payAccountLabelFromSelect(accountSelect));
      previewBox.innerHTML = current.html;
    }
    accountSelect.addEventListener("change", () => {
      rememberCustomerAccount(cust, accountSelect.value);
      refresh();
    });
    const downloadBtn = el(
      "button",
      { class: "btn", onClick: () => downloadTextFile(`${q.quote_no.replace("/", "-")}.txt`, current.text) },
      "บันทึกเป็นไฟล์ .txt"
    );
    const printBtn = el("button", { class: "btn", onClick: () => printReceiptHtml(current.html) }, "พิมพ์ใบเสนอราคา");
    const copyBtn = el(
      "button",
      {
        class: "btn",
        onClick: () => {
          copyTextToClipboard(current.textForCopy)
            .then(() => {
              const original = "คัดลอกข้อความใบเสนอราคา";
              copyBtn.textContent = "คัดลอกแล้ว ✓";
              setTimeout(() => {
                copyBtn.textContent = original;
              }, 1500);
            })
            .catch(() => {
              alert("คัดลอกไม่สำเร็จ กรุณาลองใหม่");
            });
        },
      },
      "คัดลอกข้อความใบเสนอราคา"
    );
    const closeBtn = el("button", { class: "btn btn-primary", onClick: closeModal }, "ปิด");
    const body = el("div", {}, formField("บัญชีสำหรับโอนเงิน (ถ้ามี)", accountSelect), previewBox, el("div", { class: "modal-actions" }, downloadBtn, copyBtn, printBtn, closeBtn));
    openModal("ใบเสนอราคา", body, { wide: true });
  }

  // คืนสีประจำธนาคาร (อิงจากสีแบรนด์ที่คุ้นตา) ให้กับชื่อธนาคารที่พิมพ์เอง ถ้าไม่ตรงกับธนาคารที่รู้จักจะคืน null (ใช้สีปกติ)
  function bankBrandColor(bankName) {
    const s = String(bankName || "").toLowerCase();
    if (s.includes("กสิกร") || s.includes("kbank") || s.includes("kasikorn")) return "#138f2d";
    if (s.includes("ไทยพาณิชย์") || s.includes("scb")) return "#4e2a84";
    if (s.includes("กรุงไทย") || s.includes("ktb")) return "#1ba5e1";
    if (s.includes("กรุงเทพ") || s.includes("bbl") || s.includes("bangkok bank")) return "#1e4598";
    if (s.includes("กรุงศรี") || s.includes("bay") || s.includes("krungsri")) return "#ffb800";
    if (s.includes("ทหารไทยธนชาต") || s.includes("ทหารไทย") || s.includes("ธนชาต") || s.includes("ttb")) return "#1279be";
    if (s.includes("ออมสิน") || s.includes("gsb")) return "#eb198d";
    if (s.includes("อาคารสงเคราะห์") || s.includes("ghb")) return "#f7941d";
    if (s.includes("ธ.ก.ส") || s.includes("ธกส") || s.includes("baac")) return "#4c8c2b";
    if (s.includes("ยูโอบี") || s.includes("uob")) return "#0b3979";
    if (s.includes("ซีไอเอ็มบี") || s.includes("cimb")) return "#7e2e38";
    if (s.includes("เกียรตินาคิน") || s.includes("kkp")) return "#00a19a";
    if (s.includes("ไอซีบีซี") || s.includes("icbc")) return "#c8161d";
    if (s.includes("แลนด์ แอนด์ เฮ้าส์") || s.includes("lh bank") || s.includes("lhbank")) return "#6d6e71";
    return null;
  }

  function refreshBankAccountsTable() {
    if (!refs.acctBankContainer) return;
    clear(refs.acctBankContainer);
    const accounts = DB.getBankAccounts();
    const totalBalance = accounts.reduce((sum, a) => sum + (a.balance || 0), 0);
    refs.acctBankContainer.appendChild(
      el("p", { text: `ยอดรวมทั้งหมด: ${money(totalBalance)} บาท`, style: { fontWeight: "600", textAlign: "right", margin: "0 0 8px" } })
    );
    refs.acctBankContainer.appendChild(
      buildDataTable(
        ["ธนาคาร", "ชื่อบัญชี", "เลขบัญชี", "ยอดคงเหลือ"],
        accounts.map((a) => [a.bank_name, a.account_name, a.account_no || "-", money(a.balance || 0)]),
        {
          cellStyle: (row, ci, colName) => {
            if (colName !== "ธนาคาร") return null;
            const c = bankBrandColor(row[ci]);
            return c ? { color: c, fontWeight: "600" } : null;
          },
          actions: (idx) => {
            const a = accounts[idx];
            const acts = [
              {
                label: "รายการเคลื่อนไหว",
                onClick: () => openAccountMovementsModal(a.id),
              },
              {
                label: "ปรับยอด",
                onClick: () => openAdjustBalanceModal(a),
              },
            ];
            if (!a.is_cash) {
              acts.push({ label: "แก้ไข", onClick: () => openBankAccountModal(a) });
              acts.push({
                label: "ลบ",
                onClick: () => {
                  if (!global.confirm(`ยืนยันลบบัญชี ${a.bank_name} - ${a.account_name}?`)) return;
                  if (!DB.deleteBankAccount(a.id)) {
                    global.alert("ไม่สามารถลบบัญชีนี้ได้");
                    return;
                  }
                  refreshBankAccountsTable();
                },
              });
            }
            return acts;
          },
        }
      )
    );
  }

  function openBankAccountModal(existing) {
    const bankNameInput = textInput(existing ? existing.bank_name : "");
    const accountNameInput = textInput(existing ? existing.account_name : "");
    const accountNoInput = textInput(existing ? existing.account_no : "");
    const initialBalanceInput = existing ? null : numberInput(0);
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const bankName = bankNameInput.value.trim();
          const accountName = accountNameInput.value.trim();
          if (!bankName || !accountName) {
            global.alert("กรุณาระบุชื่อธนาคารและชื่อบัญชี");
            return;
          }
          const data = { bank_name: bankName, account_name: accountName, account_no: accountNoInput.value.trim() };
          if (existing) {
            DB.updateBankAccount(existing.id, data);
          } else {
            const newAcct = DB.createBankAccount(data);
            const initBal = Number(initialBalanceInput.value) || 0;
            if (initBal !== 0) DB.adjustBankAccountBalance(newAcct.id, initBal, "ยอดเริ่มต้นตอนเปิดบัญชี");
          }
          closeModal();
          refreshBankAccountsTable();
        },
      },
      "บันทึก"
    );
    const body = el(
      "div",
      {},
      formField("ธนาคาร", bankNameInput),
      formField("ชื่อบัญชี", accountNameInput),
      formField("เลขที่บัญชี", accountNoInput),
      existing ? el("div", {}) : formField("ยอดเริ่มต้น", initialBalanceInput),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("bankAccountForm", { bankNameInput, accountNameInput, accountNoInput, saveBtn });
    openModal(existing ? "แก้ไขบัญชีธนาคาร" : "เพิ่มบัญชีธนาคาร", body);
  }

  function openAdjustBalanceModal(account) {
    const balanceInput = numberInput(account.balance || 0);
    const noteInput = textInput("");
    noteInput.setAttribute("placeholder", "เช่น แก้ไขยอดผิดพลาด, นับเงินสดใหม่ ฯลฯ");
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const newBalance = Number(balanceInput.value);
          if (isNaN(newBalance)) {
            global.alert("กรุณาระบุยอดให้ถูกต้อง");
            return;
          }
          const note = noteInput.value.trim() || "ปรับปรุงยอดบัญชี";
          DB.adjustBankAccountBalance(account.id, newBalance, note);
          closeModal();
          refreshBankAccountsTable();
        },
      },
      "บันทึก"
    );
    const body = el(
      "div",
      {},
      el(
        "p",
        {},
        el("span", {
          text: `${account.bank_name} - ${account.account_name}`,
          style: bankBrandColor(account.bank_name) ? { color: bankBrandColor(account.bank_name), fontWeight: "600" } : {},
        }),

  function openTransferAccountModal() {
    const fromSelect = buildBankAccountSelect("");
    const toSelect = buildBankAccountSelect("");
    const amountInput = numberInput(0);
    const noteInput = textInput("");
    const balanceHint = el("div", { style: { fontSize: "12px", color: "var(--text-muted)", marginTop: "-4px", marginBottom: "8px" } });
    function updateBalanceHint() {
      const fromId = Number(fromSelect.value) || null;
      const acct = fromId ? DB.getBankAccount(fromId) : null;
      balanceHint.textContent = acct ? `ยอดคงเหลือปัจจุบัน: ${money(acct.balance || 0)} บาท` : "";
    }
    fromSelect.addEventListener("change", updateBalanceHint);
    updateBalanceHint();
    const errorMsg = el("div", { style: { color: "var(--danger, #c0392b)", minHeight: "18px", fontSize: "13px" } });
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          errorMsg.textContent = "";
          const fromId = Number(fromSelect.value) || null;
          const toId = Number(toSelect.value) || null;
          const amount = Number(amountInput.value) || 0;
          if (!fromId || !toId) {
            errorMsg.textContent = "กรุณาเลือกบัญชีต้นทางและปลายทาง";
            return;
          }
          if (fromId === toId) {
            errorMsg.textContent = "บัญชีต้นทางและปลายทางต้องไม่ใช่บัญชีเดียวกัน";
            return;
          }
          if (amount <= 0) {
            errorMsg.textContent = "กรุณาระบุจำนวนเงินให้มากกว่า 0";
            return;
          }
          DB.transferBetweenAccounts(fromId, toId, amount, noteInput.value.trim());
          closeModal();
          refreshBankAccountsTable();
        },
      },
      "โยกเงิน"
    );
    const body = el(
      "div",
      {},
      formField("จากบัญชี", fromSelect),
      balanceHint,
      formField("ไปยังบัญชี", toSelect),
      formField("จำนวนเงิน", amountInput),
      formField("หมายเหตุ (ถ้ามี)", noteInput),
      errorMsg,
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("transferAccountForm", { fromSelect, toSelect, amountInput, noteInput, saveBtn });
    openModal("โยกเงินระหว่างบัญชี", body);
  }

  function refreshAcctSummary() {
    const s = DB.salesSummary(acctStart, acctEnd);
    const cogs = DB.cogsSummary(acctStart, acctEnd);
    const exp = DB.expensesSummary(acctStart, acctEnd);
    const shipping = DB.shippingSummary(acctStart, acctEnd);
    const income = s.total_sales - s.total_vat - shipping;
    const netProfit = income - cogs - exp;
    clear(refs.acctSummaryBox);
    refs.acctSummaryBox.appendChild(
      el(
        "div",
        {},
        el("div", { class: "totals-line", text: `รายรับจากการขาย (ไม่รวม VAT และค่าจัดส่ง): ${money(income)} บาท (${s.n_sales} บิล)` }),
        el("div", { class: "totals-line", text: `ค่าจัดส่งที่เก็บจากลูกค้า (ไม่นับเป็นกำไร): ${money(shipping)} บาท` }),
        el("div", { class: "totals-line", text: `ต้นทุนขาย (โดยประมาณจากราคาทุนปัจจุบัน): ${money(cogs)} บาท` }),
        el("div", { class: "totals-line", text: `รายจ่ายอื่นๆ: ${money(exp)} บาท` }),
        el("div", { class: "totals-line totals-main", text: `กำไรสุทธิโดยประมาณ: ${money(netProfit)} บาท` })
      )
    );

    clear(refs.acctExpenseContainer);
    const expenses = DB.getExpenses(acctStart, acctEnd);
    refs.acctExpenseContainer.appendChild(
      buildDataTable(
        ["วันที่", "หมวดหมู่", "รายละเอียด", "จำนวนเงิน", "จ่ายจากบัญชี"],
        expenses.map((e) => {
          const acct = e.account_id ? DB.getBankAccount(e.account_id) : null;
          return [fmtDate(e.date), e.category, e.description, money(e.amount), acct ? `${acct.bank_name} - ${acct.account_name}` : "-"];
        }),
        {
          cellStyle: (row, ci, colName) => {
            if (colName !== "จ่ายจากบัญชี") return null;
            const c = bankBrandColor(row[ci]);
            return c ? { color: c, fontWeight: "600" } : null;
          },
          actions: (idx) => [
            {
              label: "แก้ไข",
              onClick: () => openExpenseModal(expenses[idx]),
            },
            {
              label: "ลบ",
              onClick: () => {
                if (global.confirm("ต้องการลบรายการนี้หรือไม่?")) {
                  DB.deleteExpense(expenses[idx].id);
                  refreshAcctSummary();
                  refreshBankAccountsTable();
                }
              },
            },
          ],
        }
      )
    );

    clear(refs.acctArContainer);
    refs.acctArContainer.appendChild(buildDataTable(["รหัสลูกค้า", "ชื่อลูกค้า", "ค้างชำระ"], DB.arAging().map((c) => [c.code, c.name, money(c.total_due)])));
    clear(refs.acctApContainer);
    refs.acctApContainer.appendChild(buildDataTable(["รหัสผู้จัดจำหน่าย", "ชื่อซัพพลายเออร์", "ค้างจ่าย"], DB.apAging().map((s) => [s.code, s.name, money(s.credit_balance)])));
  }

  function openExpenseModal(existing) {
    const catOptions = DB.getExpenseCategories();
    const existingCatName = existing ? existing.category || "" : "";
    const catOptionList = [{ value: "", label: "-- ไม่ระบุหมวดหมู่ --" }].concat(
      catOptions.map((c) => ({ value: c.name, label: c.name }))
    );
    if (existingCatName && !catOptions.find((c) => c.name === existingCatName)) {
      catOptionList.push({ value: existingCatName, label: existingCatName + " (เดิม)" });
    }
    const catSelect = selectInput(catOptionList, existingCatName);
    const manageCatBtn = el(
      "button",
      { class: "btn btn-sm", type: "button", onClick: () => openExpenseCategoryModal(() => openExpenseModal(existing)) },
      "จัดการหมวดหมู่"
    );
    const descInput = textInput(existing ? existing.description : "");
    const amountInput = numberInput(existing ? existing.amount : "");
    const accounts = DB.getBankAccounts();
    const cashAcct = DB.getCashAccount();
    const existingAccountId = existing ? existing.account_id : null;
    const accountSelect = selectInput(
      accounts.map((a) => ({
        value: String(a.id),
        label: `${a.bank_name} - ${a.account_name}`,
        color: a.is_cash ? null : bankBrandColor(a.bank_name),
      })),
      existingAccountId ? String(existingAccountId) : (cashAcct ? String(cashAcct.id) : "")
    );
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const amt = Number(amountInput.value);
          if (!amt || amt <= 0) {
            global.alert("กรุณาระบุจำนวนเงินให้ถูกต้อง");
            return;
          }
          const accountId = accountSelect.value ? Number(accountSelect.value) : null;
          if (existing) {
            DB.updateExpense(existing.id, {
              category: catSelect.value,
              description: descInput.value.trim(),
              amount: amt,
              account_id: accountId,
              date: existing.date,
            });
          } else {
            DB.addExpense(catSelect.value, descInput.value.trim(), amt, null, accountId);
          }
          closeModal();
          refreshAcctSummary();
          refreshBankAccountsTable();
        },
      },
      "บันทึก"
    );
    const body = el(
      "div",
      {},
      formField("หมวดหมู่", el("div", { style: { display: "flex", gap: "6px", alignItems: "center" } }, catSelect, manageCatBtn)),
      formField("รายละเอียด", descInput),
      formField("จำนวนเงิน", amountInput),
      formField("จ่ายจากบัญชี", accountSelect),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("expenseForm", { catSelect, descInput, amountInput, accountSelect, saveBtn });
    openModal(existing ? "แก้ไขรายจ่าย" : "เพิ่มรายจ่าย", body);
  }

  function openExpenseCategoryModal(onClose) {
    function render() {
      const cats = DB.getExpenseCategories();
      const rows = cats.map((c) => {
        const nameInput = textInput(c.name);
        const saveRowBtn = el(
          "button",
          {
            class: "btn btn-sm",
            onClick: () => {
              const v = nameInput.value.trim();
              if (!v) {
                global.alert("กรุณาระบุชื่อหมวดหมู่");
                return;
              }
              DB.updateExpenseCategory(c.id, v);
              render();
            },
          },
          "บันทึก"
        );
        const delRowBtn = el(
          "button",
          {
            class: "btn btn-sm",
            onClick: () => {
              if (!global.confirm(`ลบหมวดหมู่ "${c.name}"? (รายจ่ายเดิมที่ใช้หมวดหมู่นี้จะไม่ถูกลบ)`)) return;
              DB.deleteExpenseCategory(c.id);
              render();
            },
          },
          "ลบ"
        );
        return el(
          "div",
          { style: { display: "flex", gap: "6px", marginBottom: "6px", alignItems: "center" } },
          nameInput,
          saveRowBtn,
          delRowBtn
        );
      });

      const newNameInput = textInput("");
      const addBtn = el(
        "button",
        {
          class: "btn btn-sm",
          onClick: () => {
            const v = newNameInput.value.trim();
            if (!v) {
              global.alert("กรุณาระบุชื่อหมวดหมู่");
              return;
            }
            DB.addExpenseCategory(v);
            newNameInput.value = "";
            render();
          },
        },
        "+ เพิ่ม"
      );
      const closeBtn = el(
        "button",
        { class: "btn btn-primary", onClick: () => (onClose ? onClose() : closeModal()) },
        "ปิด"
      );

      const body = el(
        "div",
        {},
        cats.length ? el("div", {}, ...rows) : el("p", { text: "ยังไม่มีหมวดหมู่ กรุณาเพิ่มหมวดหมู่ด้านล่าง" }),
        el("div", { style: { display: "flex", gap: "6px", marginTop: "10px", alignItems: "center" } }, newNameInput, addBtn),
        el("div", { class: "modal-actions" }, closeBtn)
      );
      exposeTestRefs("expenseCategoryForm", { newNameInput, addBtn, closeBtn });
      openModal("จัดการหมวดหมู่รายจ่าย", body);
    }
    render();
  }

  function renderReports() {
    const sec = sections.reports;
    clear(sec);

    const startInput = dateInputEl({ value: reportStart, onChange: (e) => { reportStart = e.target.value; } });

    const toolbar = el(
      "div",
      { class: "toolbar" },

    );

      ["sales", "รายงานยอดขาย"],

  function refreshReports() {
    Object.keys(refs.reportSubTabButtons).forEach((k) => refs.reportSubTabButtons[k].classList.toggle("active", k === reportSubTab));
    const container = refs.reportContentContainer;
    clear(container);
    if (reportSubTab === "sales") {
      const sales = DB.getSales(reportStart, reportEnd);
      const rows = sales.map((s) => {
        const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
        return [s.sale_no, fmtDate(s.date), c ? c.name : "ลูกค้าทั่วไป", money(s.subtotal - s.discount), money(s.vat_amount), money(s.total), s.status];
      });
      container.appendChild(
        buildDataTable(["เลขที่บิล", "วันที่", "ลูกค้า", "ก่อนภาษี", "VAT", "ยอดรวม", "สถานะ"], rows, {
          cellStyle: (row, ci, colName) =>
            colName === "สถานะ" && (row[ci] === "ค้างชำระ" || row[ci] === "เงินสดแต่ค้างชำระ") ? { color: "var(--danger)", fontWeight: "600" } : null,
        })
      );
    } else if (reportSubTab === "best") {
      const best = DB.bestSellers(reportStart, reportEnd, 30);
      container.appendChild(buildDataTable(["รหัส", "ชื่อผ้า", "จำนวนที่ขาย", "ยอดขายรวม"], best.map((b) => [b.code, b.name, b.qty_sold, money(b.total_sold)])));
    } else {
      const low = DB.lowStockList();
      container.appendChild(buildDataTable(["รหัส", "ชื่อผ้า", "คงเหลือ", "จุดสั่งซื้อ", "หน่วย"], low.map((f) => [f.code, f.name, f.stock_qty, f.reorder_point, f.unit])));
    }
  }

  function exportSalesCsv() {
    const sales = DB.getSales(reportStart, reportEnd);
    const rows = [["เลขที่บิล", "วันที่", "ลูกค้า", "ก่อนภาษี", "VAT", "ยอดรวม", "ชำระแล้ว", "สถานะ"]];
    sales.forEach((s) => {
      const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
      rows.push([s.sale_no, fmtDate(s.date), c ? c.name : "ลูกค้าทั่วไป", s.subtotal - s.discount, s.vat_amount, s.total, s.paid, s.status]);
    });
    downloadCsv("sales_report.csv", rows);
  }
  function exportBestCsv() {
    const best = DB.bestSellers(reportStart, reportEnd, 1000);
    const rows = [["รหัส", "ชื่อผ้า", "จำนวนที่ขาย", "ยอดขายรวม"]];

  }

  function openSettingsModal() {
    const info = DB.getShopInfo();

    const addressInput = textInput(info.address);
    const phoneInput = textInput(info.phone);
    const taxInput = textInput(info.tax_id);

      {

            name: nameInput.value.trim(),
            address: addressInput.value.trim(),
            phone: phoneInput.value.trim(),
            tax_id: taxInput.value.trim(),
          });
          refs.shopTitleH1.textContent = nameInput.value.trim() || "ร้านผ้าศิริเจริญ";
          closeModal();
        },
      },
      "บันทึก"
    );
    const newPasswordInput = textInput("");
    newPasswordInput.type = "password";
    newPasswordInput.placeholder = "รหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร)";
    const confirmPasswordInput = textInput("");
    confirmPasswordInput.type = "password";
    confirmPasswordInput.placeholder = "ยืนยันรหัสผ่านใหม่";
    const passwordErrorMsg = el("div", { style: { color: "var(--danger, #c0392b)", minHeight: "18px", fontSize: "13px", marginTop: "4px" } });
    const passwordSuccessMsg = el("div", { style: { color: "var(--success, #2e7d32)", minHeight: "18px", fontSize: "13px", marginTop: "4px" } });
    const changePasswordBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: async () => {
          passwordErrorMsg.textContent = "";
          passwordSuccessMsg.textContent = "";
          const newPassword = newPasswordInput.value;
          const confirmPassword = confirmPasswordInput.value;
          if (!newPassword || !confirmPassword) {
            passwordErrorMsg.textContent = "กรุณากรอกรหัสผ่านใหม่และยืนยันรหัสผ่าน";
            return;
          }
          if (newPassword.length < 6) {
            passwordErrorMsg.textContent = "รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร";
            return;
          }
          if (newPassword !== confirmPassword) {
            passwordErrorMsg.textContent = "รหัสผ่านใหม่และการยืนยันไม่ตรงกัน";
            return;
          }
          changePasswordBtn.disabled = true;
          changePasswordBtn.textContent = "กำลังเปลี่ยนรหัสผ่าน...";
          try {
            const { error } = await global.__supabaseClient__.auth.updateUser({ password: newPassword });
            if (error) {
              passwordErrorMsg.textContent = "เปลี่ยนรหัสผ่านไม่สำเร็จ: " + (error.message || "กรุณาลองใหม่");
              changePasswordBtn.disabled = false;
              changePasswordBtn.textContent = "เปลี่ยนรหัสผ่าน";
              return;
            }
            newPasswordInput.value = "";
            confirmPasswordInput.value = "";
            passwordSuccessMsg.textContent = "เปลี่ยนรหัสผ่านสำเร็จแล้ว";
            changePasswordBtn.disabled = false;
            changePasswordBtn.textContent = "เปลี่ยนรหัสผ่าน";
          } catch (e) {
            passwordErrorMsg.textContent = "เชื่อมต่อไม่สำเร็จ: " + (e && e.message ? e.message : "กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่");
            changePasswordBtn.disabled = false;
            changePasswordBtn.textContent = "เปลี่ยนรหัสผ่าน";
          }
        },
      },
      "เปลี่ยนรหัสผ่าน"
    );
    const passwordSection = global.__supabaseClient__
      ? el(
          "div",
          {},
          el("hr"),
          el("h3", { style: { margin: "12px 0 8px" } }, "เปลี่ยนรหัสผ่านเข้าสู่ระบบ"),
          el(
            "div",
            { class: "form-grid" },
            formField("รหัสผ่านใหม่", newPasswordInput),
            formField("ยืนยันรหัสผ่านใหม่", confirmPasswordInput)
          ),
          passwordErrorMsg,
          passwordSuccessMsg,
          el("div", { class: "modal-actions" }, changePasswordBtn)
        )
      : null;
    const body = el(
      "div",
      {},
      el(
        "div",
        { class: "form-grid" },
        formField("ชื่อร้าน", nameInput),
        formField("ที่อยู่ร้าน", addressInput),
        formField("เบอร์โทรร้าน", phoneInput),
        VAT_ENABLED ? formField("เลขประจำตัวผู้เสียภาษี", taxInput) : null
      ),
      el("div", { class: "modal-actions" }, saveBtn),
      passwordSection
    );
    exposeTestRefs("settingsForm", {
      nameInput,
      addressInput,
      phoneInput,
      taxInput,
      saveBtn,
      newPasswordInput,
      confirmPasswordInput,
      changePasswordBtn,
    });
    openModal("ตั้งค่าร้าน", body);
  }
