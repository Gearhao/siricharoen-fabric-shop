  function updateEditBannerUI() {
    if (!refs.posEditBanner) return;
    if (editingSaleId) {
      const sale = DB.getSale(editingSaleId);
      refs.posEditBanner.style.display = "flex";
      refs.posEditBannerLabel.textContent = sale ? `กำลังแก้ไขบิลเลขที่ ${sale.sale_no}` : "กำลังแก้ไขบิล";
      if (refs.posCheckoutBtn) refs.posCheckoutBtn.textContent = "บันทึกการแก้ไขบิล";
    } else {
      refs.posEditBanner.style.display = "none";
      if (refs.posCheckoutBtn) refs.posCheckoutBtn.textContent = "ชำระเงิน / บันทึกบิล";
    }
  }

  function openSaleDetailModal(saleId) {
    const s = DB.getSale(saleId);
    if (!s) return;
    const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
    const itemRows = s.items.map((it) => {
      if (it.is_misc) {
        return ["-", `${it.name || ""} (ฝากซื้อ)`, it.qty, it.unit || "", money(it.unit_price), money(it.qty * it.unit_price)];
      }
      const f = DB.getFabric(it.fabric_id);
      return [
        f ? f.code : "-",
        f ? f.name : "(สินค้านี้ถูกลบแล้ว)",
        it.qty,
        it.unit || (f ? f.unit : ""),
        money(it.unit_price),
        money(it.qty * it.unit_price),
      ];
    });
    const itemsTable = buildDataTable(["รหัสผ้า", "ชื่อผ้า", "จำนวน", "หน่วย", "ราคา/หน่วย", "รวม"], itemRows);
    const infoLines = [
      `เลขที่บิล: ${s.sale_no}`,
      `วันที่: ${fmtDate(s.date)}`,
      `ลูกค้า: ${c ? c.name : "ลูกค้าทั่วไป"}`,
      `ชำระโดย: ${s.payment_method}`,
      `สถานะ: ${s.status}`,
    ];
    if (s.due_date) infoLines.push(`วันที่ครบกำหนดชำระเงิน: ${fmtDate(s.due_date)}`);
    if (s.shipping_method) infoLines.push(`วิธีจัดส่ง: ${s.shipping_method}`);
    if (s.note) infoLines.push(`หมายเหตุ: ${s.note}`);
    const infoBlock = el("div", { style: { marginBottom: "10px" } }, ...infoLines.map((t) => el("div", { text: t })));
    const totalsBlock = el(
      "div",
      { class: "totals-line", style: { marginTop: "10px" } },
      el("div", { text: `ยอดรวมก่อนหักส่วนลด: ${money(s.subtotal)} บาท` }),
      s.discount ? el("div", { text: `ส่วนลด: ${money(s.discount)} บาท` }) : null,
      s.shipping_fee ? el("div", { text: `ค่าจัดส่ง: ${money(s.shipping_fee)} บาท` }) : null,
      s.vat_amount ? el("div", { text: `ภาษีมูลค่าเพิ่ม: ${money(s.vat_amount)} บาท` }) : null,
      el("div", { text: `ยอดสุทธิ: ${money(s.total)} บาท`, style: { fontWeight: "600" } }),
      el("div", { text: `ชำระแล้ว: ${money(s.paid)} บาท` }),
      s.total - s.paid > 0
        ? el("div", {
            text: `ค้างชำระ: ${money(s.total - s.paid)} บาท`,
            style: { color: "var(--danger)", fontWeight: "600" },
          })
        : null
    );
    const body = el("div", {}, infoBlock, itemsTable, totalsBlock);
    openModal(`รายละเอียดบิล - ${s.sale_no}`, body, { wide: true });
  }

  function renderPosSalesHistory() {
    const container = refs.posHistoryTableContainer;
    if (!container) return;
    clear(container);
    let sales = DB.getSales();
    if (!posHistoryShowAll) {
      const fromDate = posHistoryDate || DB.todayStr();
      const toDate = posHistoryDateTo || DB.todayStr();
      sales = sales.filter((s) => {
        const d = s.date.slice(0, 10);
        return d >= fromDate && d <= toDate;
      });
    }
    if (posHistoryUnpaidOnly || posHistoryUnpaidOnlyCash) {
      sales = sales.filter(
        (s) =>
          (posHistoryUnpaidOnly && s.status === "ค้างชำระ") ||
          (posHistoryUnpaidOnlyCash && s.status === "เงินสดแต่ค้างชำระ")
      );
    }
    const historyQ = posHistorySearch.trim().toLowerCase();
    if (historyQ) {
      sales = sales.filter((s) => {
        const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
        const custName = c ? c.name : "ลูกค้าทั่วไป";
        return (s.sale_no || "").toLowerCase().includes(historyQ) || custName.toLowerCase().includes(historyQ);
      });
    }
    if (refs.posHistorySummary) {
      const totalAmount = sales.reduce((sum, s) => sum + s.total, 0);
      const totalShipping = sales.reduce((sum, s) => sum + (s.shipping_fee || 0), 0);
      refs.posHistorySummary.textContent =
        `รวม ${sales.length} บิล ยอดขายรวม ${money(totalAmount)} บาท` +
        (totalShipping ? ` (ค่าส่งรวม ${money(totalShipping)} บาท)` : "");
    }

    const thead = el(
      "thead",
      {},
      el(
        "tr",
        {},
        el("th", { text: "เลขที่บิล" }),
        el("th", { text: "วันที่" }),
        el("th", { text: "ลูกค้า" }),
        el("th", { text: "ยอดรวม" }),
        el("th", { text: "สถานะ" }),
        el("th", { text: "วิธีจัดส่ง" }),
        el("th", { text: "จัดการ" })
      )
    );
    const tbody = el("tbody", {});

    if (sales.length === 0) {
      tbody.appendChild(el("tr", {}, el("td", { colspan: 7, class: "empty", text: "ไม่มีข้อมูล" })));
    }

    sales.forEach((s) => {
      const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
      const actionsCell = el(
        "td",
        { class: "actions-cell" },
        el("button", { class: "btn btn-sm", onClick: () => editSalePOS(s.id) }, "แก้ไข"),
        s.status !== "ชำระแล้ว"
          ? el(
              "button",
              {
                class: "btn btn-sm",
                onClick: () => openMarkSalePaidModal(s.id),
              },
              "ชำระแล้ว"
            )
          : null,
        el("button", { class: "btn btn-sm", onClick: () => reprintSalePOS(s.id) }, "พิมพ์ใบเสร็จ"),
        el("button", { class: "btn btn-sm", onClick: () => deleteSalePOS(s.id) }, "ลบ")
      );
      const isUnpaidStatus = s.status === "ค้างชำระ" || s.status === "เงินสดแต่ค้างชำระ";
      const paidLabel =
        s.status === "ชำระแล้ว" && s.paid_method
          ? s.paid_method === "โอนเงิน" && (s.bank_name || s.bank_account_name)
            ? `${s.status} (${s.paid_method}: ${[s.bank_name, s.bank_account_name].filter(Boolean).join(" ")})`
            : `${s.status} (${s.paid_method})`
          : isUnpaidStatus && s.due_date
          ? `${s.status} (ครบกำหนด ${fmtDate(s.due_date)})`
          : s.status;
      const statusCell = el("td", {
        text: paidLabel,
        style: isUnpaidStatus ? { color: "var(--danger)", fontWeight: "600" } : {},
      });
      const totalCell = s.shipping_fee
        ? el(
            "td",
            {},
            el("div", { text: `ก่อนค่าส่ง ${money(s.total - s.shipping_fee)}` }),
            el("div", { text: `รวมค่าส่ง ${money(s.total)}` })
          )
        : el("td", { text: money(s.total) });
      const saleNoCell = el(
        "td",
        {},
        el("button", { class: "btn btn-sm", onClick: () => openSaleDetailModal(s.id) }, s.sale_no)
      );
      const tr = el(
        "tr",
        {},
        saleNoCell,
        el("td", { text: fmtDate(s.date) }),
        el("td", { text: c ? c.name : "ลูกค้าทั่วไป" }),
        totalCell,
        statusCell,
        el("td", { text: s.shipping_method || "-" }),
        actionsCell
      );
      tbody.appendChild(tr);
    });

    const table = el("table", { class: "data-table" }, thead, tbody);
    container.appendChild(table);
  }

  function deleteSalePOS(saleId) {
    const sale = DB.getSale(saleId);
    if (!sale) return;
    if (!global.confirm(`ยืนยันลบบิลเลขที่ ${sale.sale_no} ยอดรวม ${money(sale.total)} บาท? สต็อกและยอดค้างชำระ (ถ้ามี) จะถูกคืนกลับให้อัตโนมัติ`)) return;
    if (editingSaleId === saleId) {
      cancelEditSalePOS();
    }
    DB.deleteSale(saleId);
    renderPosSalesHistory();
    global.alert(`ลบบิลเลขที่ ${sale.sale_no} เรียบร้อยแล้ว`);
  }

  function openMarkSalePaidModal(saleId, refreshFn) {
    const refresh = refreshFn || renderPosSalesHistory;
    const sale = DB.getSale(saleId);
    if (!sale) return;
    const remain = sale.total - sale.paid;
    const methodSelect = selectInput(
      [
        { value: "เงินสด", label: "เงินสด" },
        { value: "โอนเงิน", label: "โอนเงิน" },
      ],
      "เงินสด"
    );
    const accountSplit = buildAccountSplitRows(remain);
    const accountSplitRow = formField("บัญชีที่รับโอน (แบ่งหลายบัญชีได้)", el("div", {}, accountSplit.container, accountSplit.addBtn));
    function updateBankRowsVisibility() {
      const isTransfer = methodSelect.value === "โอนเงิน";
      accountSplitRow.style.display = isTransfer ? "" : "none";
    }
    methodSelect.addEventListener("change", updateBankRowsVisibility);
    updateBankRowsVisibility();

    const form = el(
      "div",
      { class: "form-panel" },
      el("p", { text: `บิลเลขที่ ${sale.sale_no} ยอดค้างชำระ ${money(remain)} บาท` }),
      formField("ชำระโดย", methodSelect),
      accountSplitRow
    );
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const method = methodSelect.value;
          let accountSplits = [];
          if (method === "โอนเงิน") {
            accountSplits = accountSplit.getSplits();
            if (accountSplits.length === 0) {
              global.alert("กรุณาเลือกบัญชีที่รับโอน");
              return;
            }
            const splitTotal = accountSplit.getTotal();
            if (splitTotal !== remain) {
              global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดค้างชำระ (${money(remain)}) กรุณาตรวจสอบ`);
              return;
            }
          }
          DB.markSalePaid(saleId, method, accountSplits);
          closeModal();
          refresh();
        },
      },
      "บันทึกการชำระเงิน"
    );
    exposeTestRefs("markSalePaid", { methodSelect, accountSplit, saveBtn });
    openModal("บันทึกการชำระเงิน", el("div", {}, form, el("div", { class: "modal-actions" }, saveBtn)));
  }

  function editSalePOS(saleId) {
    const sale = DB.getSale(saleId);
    if (!sale) return;
    editingSaleId = saleId;
    cart = sale.items.map((it) => {
      if (it.is_misc) {
        return {
          fabric_id: "",
          code: "",
          name: it.name || "",
          unit: it.unit || "ชิ้น",
          baseUnit: "",
          qty: it.qty,
          unit_price: it.unit_price,
          cost_price: it.cost_price || 0,
          stock_qty: null,
          is_misc: true,
        };
      }
      const f = DB.getFabric(it.fabric_id);
      return {
        fabric_id: it.fabric_id,
        code: f ? f.code : "",
        name: f ? f.name : "(สินค้านี้ถูกลบแล้ว)",
        unit: it.unit || (f ? f.unit : "หลา"),
        baseUnit: f ? f.unit : "",
        qty: it.qty,
        unit_price: it.unit_price,
        cost_price: 0,
        stock_qty: f ? f.stock_qty : null,
        is_misc: false,
      };
    });
    if (cart.length === 0) addPosRow();
    else renderPosItemsTable();
    refs.posCustomerSelect.setCustomerId(sale.customer_id || 0);
    refs.posDiscountInput.value = sale.discount || 0;
    if (refs.posDiscountUnitSelect) refs.posDiscountUnitSelect.value = "บาท";
    refs.posShippingFeeInput.value = sale.shipping_fee || 0;
    refs.posShippingMethodInput.value = sale.shipping_method || "";
    refs.posDueDateInput.value = sale.due_date || "";
    refs.posPaymentSelect.value = sale.payment_method;
    refs.posPaidInput.value = sale.paid;
    refs.posAccountSplit.setSplits(sale.account_splits || []);
    refs.posAccountSplitRow.style.display = sale.payment_method === "โอนเงิน" ? "" : "none";
    refs.posNoteInput.value = sale.note || "";
    updatePosTotals();
    updateEditBannerUI();
    sections.pos.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function cancelEditSalePOS() {
    editingSaleId = null;
    cart = [];
    addPosRow();
    refs.posDiscountInput.value = 0;
    if (refs.posDiscountUnitSelect) refs.posDiscountUnitSelect.value = "บาท";
    refs.posPaidInput.value = 0;
    refs.posShippingFeeInput.value = 0;
    refs.posShippingMethodInput.value = "";
    refs.posDueDateInput.value = "";
    refs.posPaymentSelect.value = "เงินสดแต่ยังไม่จ่าย";
    refs.posAccountSplit.reset(0);
    refs.posAccountSplitRow.style.display = "none";
    refs.posNoteInput.value = "";
    const newCustomerSelect = buildCustomerSelectOptions();
    const oldSelect = refs.posCustomerSelect;
    if (oldSelect.parentNode) oldSelect.parentNode.replaceChild(newCustomerSelect, oldSelect);
    refs.posCustomerSelect = newCustomerSelect;
    updatePosTotals();
    updateEditBannerUI();
  }

  function reprintSalePOS(saleId) {
    const sale = DB.getSale(saleId);
    if (!sale) return;
    const cartItems = sale.items.map((it) => {
      if (it.is_misc) {
        return { code: "", name: `${it.name || ""} (ฝากซื้อ)`, qty: it.qty, unit_price: it.unit_price, unit: it.unit };
      }
      const f = DB.getFabric(it.fabric_id);
      return { code: f ? f.code : "", name: f ? f.name : "(สินค้านี้ถูกลบแล้ว)", qty: it.qty, unit_price: it.unit_price, unit: it.unit };
    });
    showReceiptModal(sale, sale.customer_id, cartItems);
  }

  function buildCustomerSelectOptions() {
    const customers = DB.getCustomers();
    const options = [{ value: "0", label: "ลูกค้าทั่วไป (เงินสด)" }].concat(
      customers.map((c) => ({ value: String(c.id), label: `${c.code} - ${c.name} (ค้างชำระ ${money(c.credit_balance)})` }))
    );
    const wrap = searchSelectInput(options, "0", "พิมพ์ชื่อ/รหัสลูกค้าเพื่อค้นหา...");
    wrap._customerId = 0;
    function applyMatch(v) {
      if (v === null) {
        global.alert("ไม่พบลูกค้าตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
        const cur = options.find((o) => o.value === String(wrap._customerId));
        wrap.setLabel(cur ? cur.label : "ลูกค้าทั่วไป (เงินสด)");
        return;
      }
      const id = Number(v) || 0;
      wrap._customerId = id;
      const opt = options.find((o) => o.value === String(id));
      wrap.setLabel(opt ? opt.label : "ลูกค้าทั่วไป (เงินสด)");
    }
    wrap.inputEl.addEventListener("change", () => applyMatch(wrap.getMatchedValue()));
    wrap.getCustomerId = () => wrap._customerId;
    wrap.setCustomerId = (id) => applyMatch(String(id || 0));
    return wrap;
  }

  function fabricSelectOptions(selectedId) {
    const fabrics = DB.getFabrics("");
    const opts = [{ value: "", label: "-- เลือกผ้า --" }].concat(
      fabrics.map((f) => ({ value: String(f.id), label: `${f.code} - ${f.name}` }))
    );
    return { opts, fabrics };
  }

  // 1 เมตร = 1.0936133 หลา / 1 หลา = 0.9144 เมตร
  const YARD_PER_METER = 1.0936133;
  const METER_PER_YARD = 0.9144;
  // ผลลัพธ์ = จำนวน "baseUnit" ต่อ 1 "unit" (ใช้แปลงจำนวน/ราคาระหว่างหน่วยขายกับหน่วยที่เก็บสต็อกจริง)
  function unitFactor(unit, baseUnit) {
    if (!unit || !baseUnit || unit === baseUnit) return 1;
    if (unit === "หลา" && baseUnit === "เมตร") return METER_PER_YARD;
    if (unit === "เมตร" && baseUnit === "หลา") return YARD_PER_METER;
    return 1;
  }

    cart.push({ fabric_id: "", code: "", name: "", unit: "หลา", baseUnit: "", qty: 1, unit_price: 0, cost_price: 0, stock_qty: null, is_misc: false });

  function addMiscPosRow() {

    renderPosItemsTable();
    updatePosTotals();
  }

  function posRowSetFabric(idx, fidStr) {
    const fid = Number(fidStr) || 0;
    const f = fid ? DB.getFabric(fid) : null;
    if (f) {
      const saleUnit = cart[idx].unit || "หลา";
      cart[idx].fabric_id = f.id;
      cart[idx].code = f.code;
      cart[idx].name = f.name;
      cart[idx].unit = saleUnit;
      cart[idx].baseUnit = f.unit;
      cart[idx].stock_qty = f.stock_qty;
      if (!cart[idx].unit_price) cart[idx].unit_price = round2(f.sell_price * unitFactor(saleUnit, f.unit));
    } else {
      cart[idx] = { fabric_id: "", code: "", name: "", unit: cart[idx].unit || "หลา", baseUnit: "", qty: cart[idx].qty, unit_price: 0, stock_qty: null };
    }
    renderPosItemsTable();
    updatePosTotals();
  }

  function posRowSetUnit(idx, unitVal) {
    const row = cart[idx];
    const f = row.fabric_id ? DB.getFabric(row.fabric_id) : null;
    if (f) {
      // แปลงราคา/หน่วยให้สอดคล้องกับหน่วยที่เลือกใหม่ (มูลค่ารวมของรายการยังเท่าเดิม)
      const oldFactor = unitFactor(row.unit, f.unit);
      const newFactor = unitFactor(unitVal, f.unit);
      const pricePerBase = row.unit_price && oldFactor ? row.unit_price / oldFactor : f.sell_price;
      row.unit_price = round2(pricePerBase * newFactor);
    }
    row.unit = unitVal;
    renderPosItemsTable();
    updatePosTotals();
  }

  function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
  }
  function parseRollsFromNote(note) {
    if (!note) return null;
    const m = note.match(/นับสต็อกแยกไม้ \(\d+ ไม้: (.+?) รวม/);
    if (!m) return null;
    const parts = m[1].split(",").map((s) => s.trim());
    if (parts.length === 0) return null;
    const rolls = parts.map((p) => {
      const numMatch = p.match(/[\d.]+/);
      return numMatch ? parseFloat(numMatch[0]) : null;
    });
    if (rolls.some((r) => r === null || isNaN(r))) return null;
    return rolls;
  }

    const cell = refs["posRowAmount_" + idx];

  function calcPosTotals() {
    const subtotal = cart.reduce((s, it) => s + it.qty * it.unit_price, 0);
    const discountRaw = Number(refs.posDiscountInput.value) || 0;
    const discount = refs.posDiscountUnitSelect && refs.posDiscountUnitSelect.value === "%" ? round2((subtotal * discountRaw) / 100) : discountRaw;
    const base = Math.max(0, subtotal - discount);
    const vat = VAT_ENABLED ? Math.round(base * VAT_RATE * 100) / 100 : 0;
    const shippingFee = Number(refs.posShippingFeeInput.value) || 0;
    const total = base + vat + shippingFee;
    return { subtotal, discount, vat, shippingFee, total };
  }

  function updatePosTotals() {
    const { subtotal, discount, vat, shippingFee, total } = calcPosTotals();
    refs.posSubtotalLbl.textContent = `ยอดรวมก่อนภาษี: ${money(subtotal - discount)} บาท`;
    if (VAT_ENABLED && refs.posVatLbl) {
      refs.posVatLbl.textContent = `ภาษีมูลค่าเพิ่ม ${Math.round(VAT_RATE * 100)}%: ${money(vat)} บาท`;
    }
    if (refs.posShippingLbl) {
      refs.posShippingLbl.textContent = `ค่าจัดส่ง: ${money(shippingFee)} บาท`;
    }
    refs.posTotalLbl.textContent = `ยอดสุทธิ: ${money(total)} บาท`;
    const paid = Number(refs.posPaidInput.value) || 0;
    const change = refs.posPaymentSelect.value !== "เงินเชื่อ" ? Math.max(0, paid - total) : 0;
    refs.posChangeLbl.textContent = `เงินทอน: ${money(change)} บาท`;
  }

  function checkout() {
    const validItems = cart.filter((it) => it.qty > 0 && (it.is_misc ? (it.name || "").trim() : it.fabric_id));
    if (validItems.length === 0) {
      global.alert("กรุณาเลือกสินค้าและระบุจำนวนอย่างน้อย 1 รายการ");
      return;
    }
    const { subtotal, discount, vat, shippingFee, total } = calcPosTotals();
    const custId = refs.posCustomerSelect.getCustomerId();
    const paymentMethod = refs.posPaymentSelect.value;
    const paid = Number(refs.posPaidInput.value) || 0;
    const shippingMethod = refs.posShippingMethodInput.value.trim();

    if (paymentMethod === "เงินเชื่อ") {
      if (!custId) {
        global.alert("การขายแบบเงินเชื่อต้องเลือกลูกค้า");
        return;
      }
      const customer = DB.getCustomer(custId);
      const newBalance = customer.credit_balance + (total - paid);
      if (customer.credit_limit > 0 && newBalance > customer.credit_limit) {
        const ok = global.confirm(
          `ลูกค้ารายนี้มีวงเงินเครดิต ${money(customer.credit_limit)} บาท ยอดหลังขายจะเป็น ${money(
            newBalance
          )} บาท เกินวงเงินที่กำหนด ต้องการดำเนินการต่อหรือไม่?`
        );
        if (!ok) return;
      }
    } else if (paymentMethod !== "เงินสด" && paymentMethod !== "เงินสดแต่ยังไม่จ่าย" && paid < total) {
      global.alert("จำนวนเงินที่รับน้อยกว่ายอดที่ต้องชำระ");
      return;
    }

    let accountSplits = null;
    if (paymentMethod === "โอนเงิน") {
      accountSplits = refs.posAccountSplit.getSplits();
      if (accountSplits.length === 0) {
        global.alert("กรุณาเลือกบัญชีที่รับโอน");
        return;
      }
      const splitTotal = refs.posAccountSplit.getTotal();
      if (splitTotal !== paid) {
        global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดที่รับ (${money(paid)}) กรุณาตรวจสอบ`);
        return;
      }
    }

    const items = validItems.map((it) => {
      if (it.is_misc) {
        return {
          fabric_id: null,
          is_misc: true,
          name: it.name.trim(),
          code: "",
          cost_price: it.cost_price || 0,
          qty: it.qty,
          unit_price: it.unit_price,
          unit: it.unit || "ชิ้น",
          stock_qty: 0,
        };
      }
      const f = DB.getFabric(it.fabric_id);
      const factor = f ? unitFactor(it.unit, f.unit) : 1;
      return {
        fabric_id: it.fabric_id,
        qty: it.qty,
        unit_price: it.unit_price,
        unit: it.unit,
        stock_qty: it.qty * factor,
      };
    });
    const sale = editingSaleId
      ? DB.updateSale(editingSaleId, items, custId || null, discount, vat, paymentMethod, paid, refs.posNoteInput.value.trim(), undefined, accountSplits, shippingFee, shippingMethod, refs.posDueDateInput.value)
      : DB.createSale(items, custId || null, discount, vat, paymentMethod, paid, refs.posNoteInput.value.trim(), undefined, accountSplits, shippingFee, shippingMethod, refs.posDueDateInput.value);

    showReceiptModal(sale, custId, validItems.slice());

    editingSaleId = null;
    cart = [];
    addPosRow();
    refs.posDiscountInput.value = 0;
    if (refs.posDiscountUnitSelect) refs.posDiscountUnitSelect.value = "บาท";
    refs.posPaidInput.value = 0;
    refs.posShippingFeeInput.value = 0;
    refs.posShippingMethodInput.value = "";
    refs.posDueDateInput.value = "";
    refs.posPaymentSelect.value = "เงินสดแต่ยังไม่จ่าย";
    refs.posAccountSplit.reset(0);
    refs.posNoteInput.value = "";
    refs.posAccountSplitRow.style.display = "none";

    const newCustomerSelect = buildCustomerSelectOptions();
    const oldSelect = refs.posCustomerSelect;
    if (oldSelect.parentNode) {
      oldSelect.parentNode.replaceChild(newCustomerSelect, oldSelect);
    }
    refs.posCustomerSelect = newCustomerSelect;

    updatePosTotals();
    updateEditBannerUI();
    renderPosSalesHistory();
  }

        if (effectiveTo < posHistoryDateVat) {
          posHistoryDateToVat = posHistoryDateVat;
          historyDateToInput.value = posHistoryDateVat;
        }
        posHistoryShowAllVat = false;
        showAllChk.checked = false;
        renderPosSalesHistoryVat();
      },
    });
    refs.posVatHistoryDateInput = historyDateInput;
    const historyDateToInput = dateInputEl({
      value: posHistoryDateToVat || DB.todayStr(),
      onChange: (e) => {
        posHistoryDateToVat = e.target.value;
        const effectiveFrom = posHistoryDateVat || DB.todayStr();
        if (posHistoryDateToVat < effectiveFrom) {
          posHistoryDateVat = posHistoryDateToVat;
          historyDateInput.value = posHistoryDateToVat;
        }
        posHistoryShowAllVat = false;
        showAllChk.checked = false;
        renderPosSalesHistoryVat();
      },
    });
    refs.posVatHistoryDateToInput = historyDateToInput;
    const todayBtn = el(
      "button",
      {
        class: "btn btn-sm",
        onClick: () => {
          posHistoryDateVat = "";
          posHistoryDateToVat = "";
          posHistoryShowAllVat = false;
          historyDateInput.value = DB.todayStr();
          historyDateToInput.value = DB.todayStr();
          showAllChk.checked = false;
          renderPosSalesHistoryVat();
        },
      },
      "วันนี้"
    );
    const showAllChk = el("input", {
      type: "checkbox",
      checked: posHistoryShowAllVat,
      onChange: (e) => {
        posHistoryShowAllVat = e.target.checked;
        renderPosSalesHistoryVat();
      },
    });
    refs.posVatHistoryShowAllChk = showAllChk;
    const historyToolbar = el(
      "div",
      { class: "toolbar" },
      historyDateInput,
      el("span", { text: "ถึง" }),
      historyDateToInput,
      todayBtn,
      el("label", { class: "chk-label" }, showAllChk, " แสดงทั้งหมดทุกวัน"),
      historySearchInput,
      el("label", { class: "chk-label" }, unpaidChk, " ค้างชำระ"),
      el("label", { class: "chk-label" }, unpaidCashChk, " เงินสดแต่ค้างชำระ")
    );
    const historySummary = el("div", { class: "totals-line" });
    refs.posVatHistorySummary = historySummary;
    sec.appendChild(
      panel("ประวัติการขาย (แก้ไขบิลย้อนหลังได้)", el("div", {}, historyToolbar, historySummary, historyTableContainer))
    );

    if (cartVat.length === 0) addPosRowVat();
    else renderPosItemsTableVat();
    updatePosTotalsVat();
    renderPosSalesHistoryVat();
    updateEditBannerUIVat();
  }

  function updateEditBannerUIVat() {
    if (!refs.posVatEditBanner) return;
    if (editingSaleIdVat) {
      const sale = DB.getSale(editingSaleIdVat);
      refs.posVatEditBanner.style.display = "flex";
      refs.posVatEditBannerLabel.textContent = sale ? `กำลังแก้ไขบิลเลขที่ ${sale.sale_no}` : "กำลังแก้ไขบิล";
      if (refs.posVatCheckoutBtn) refs.posVatCheckoutBtn.textContent = "บันทึกการแก้ไขบิล";
    } else {
      refs.posVatEditBanner.style.display = "none";
      if (refs.posVatCheckoutBtn) refs.posVatCheckoutBtn.textContent = "ชำระเงิน / บันทึกบิล";
    }
  }

  function renderPosSalesHistoryVat() {
    const container = refs.posVatHistoryTableContainer;
    if (!container) return;
    clear(container);
    let sales = DB.getSales().filter((s) => s.is_vat);
    if (!posHistoryShowAllVat) {
      const fromDate = posHistoryDateVat || DB.todayStr();
      const toDate = posHistoryDateToVat || DB.todayStr();
      sales = sales.filter((s) => {
        const d = s.date.slice(0, 10);
        return d >= fromDate && d <= toDate;
      });
    }
    if (posHistoryUnpaidOnlyVat || posHistoryUnpaidOnlyCashVat) {
      sales = sales.filter(
        (s) =>
          (posHistoryUnpaidOnlyVat && s.status === "ค้างชำระ") ||
          (posHistoryUnpaidOnlyCashVat && s.status === "เงินสดแต่ค้างชำระ")
      );
           }
    const historyQ = posHistorySearchVat.trim().toLowerCase();
    if (historyQ) {
      sales = sales.filter((s) => {
        const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
        const custName = c ? c.name : "ลูกค้าทั่วไป";
        return (s.sale_no || "").toLowerCase().includes(historyQ) || custName.toLowerCase().includes(historyQ);
      });
    }
    if (refs.posVatHistorySummary) {
      const totalAmount = sales.reduce((sum, s) => sum + s.total, 0);
      const totalShipping = sales.reduce((sum, s) => sum + (s.shipping_fee || 0), 0);
      refs.posVatHistorySummary.textContent =
        `รวม ${sales.length} บิล ยอดขายรวม ${money(totalAmount)} บาท` +
        (totalShipping ? ` (ค่าส่งรวม ${money(totalShipping)} บาท)` : "");
    }

    const thead = el(
      "thead",
      {},
      el(
        "tr",
        {},
        el("th", { text: "เลขที่บิล" }),
        el("th", { text: "วันที่" }),
        el("th", { text: "ลูกค้า" }),
        el("th", { text: "ยอดรวม" }),
        el("th", { text: "สถานะ" }),
        el("th", { text: "วิธีจัดส่ง" }),
        el("th", { text: "จัดการ" })
      )
    );
    const tbody = el("tbody", {});

    if (sales.length === 0) {
      tbody.appendChild(el("tr", {}, el("td", { colspan: 7, class: "empty", text: "ไม่มีข้อมูล" })));
    }

    sales.forEach((s) => {
      const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
      const actionsCell = el(
        "td",
        { class: "actions-cell" },
        el("button", { class: "btn btn-sm", onClick: () => editSalePOSVat(s.id) }, "แก้ไข"),
        s.status !== "ชำระแล้ว"
          ? el(
              "button",
              {
                class: "btn btn-sm",
                onClick: () => openMarkSalePaidModal(s.id, renderPosSalesHistoryVat),
              },
              "ชำระแล้ว"
            )
          : null,
        el("button", { class: "btn btn-sm", onClick: () => reprintSalePOS(s.id) }, "พิมพ์ใบเสร็จ"),
        el("button", { class: "btn btn-sm", onClick: () => deleteSalePOSVat(s.id) }, "ลบ")
      );
      const isUnpaidStatus = s.status === "ค้างชำระ" || s.status === "เงินสดแต่ค้างชำระ";
      const paidLabel =
        s.status === "ชำระแล้ว" && s.paid_method
          ? s.paid_method === "โอนเงิน" && (s.bank_name || s.bank_account_name)
            ? `${s.status} (${s.paid_method}: ${[s.bank_name, s.bank_account_name].filter(Boolean).join(" ")})`
            : `${s.status} (${s.paid_method})`
          : isUnpaidStatus && s.due_date
          ? `${s.status} (ครบกำหนด ${fmtDate(s.due_date)})`
          : s.status;
      const statusCell = el("td", {
        text: paidLabel,
        style: isUnpaidStatus ? { color: "var(--danger)", fontWeight: "600" } : {},
      });
      const totalCell = s.shipping_fee
        ? el(
            "td",
            {},
            el("div", { text: `ก่อนค่าส่ง ${money(s.total - s.shipping_fee)}` }),
            el("div", { text: `รวมค่าส่ง ${money(s.total)}` })
          )
        : el("td", { text: money(s.total) });
      const saleNoCell = el(
        "td",
        {},
        el("button", { class: "btn btn-sm", onClick: () => openSaleDetailModal(s.id) }, s.sale_no)
      );
      const tr = el(
        "tr",
        {},
        saleNoCell,
        el("td", { text: fmtDate(s.date) }),
        el("td", { text: c ? c.name : "ลูกค้าทั่วไป" }),
        totalCell,
        statusCell,
        el("td", { text: s.shipping_method || "-" }),
        actionsCell
      );
      tbody.appendChild(tr);
    });

    const table = el("table", { class: "data-table" }, thead, tbody);
    container.appendChild(table);
  }

  function deleteSalePOSVat(saleId) {
    const sale = DB.getSale(saleId);
    if (!sale) return;
    if (!global.confirm(`ยืนยันลบบิลเลขที่ ${sale.sale_no} ยอดรวม ${money(sale.total)} บาท? สต็อกและยอดค้างชำระ (ถ้ามี) จะถูกคืนกลับให้อัตโนมัติ`)) return;
    if (editingSaleIdVat === saleId) {
      cancelEditSalePOSVat();
    }
    DB.deleteSale(saleId);
    renderPosSalesHistoryVat();
    global.alert(`ลบบิลเลขที่ ${sale.sale_no} เรียบร้อยแล้ว`);
  }

  function editSalePOSVat(saleId) {
    const sale = DB.getSale(saleId);
    if (!sale) return;
    editingSaleIdVat = saleId;
    cartVat = sale.items.map((it) => {
      if (it.is_misc) {
        return {
          fabric_id: "",
          code: "",
          name: it.name || "",
          unit: it.unit || "ชิ้น",
          baseUnit: "",
          qty: it.qty,
          unit_price: it.unit_price,
          cost_price: it.cost_price || 0,
          stock_qty: null,
          is_misc: true,
        };
      }
      const f = DB.getFabric(it.fabric_id);
      return {
        fabric_id: it.fabric_id,
        code: f ? f.code : "",
        name: f ? f.name : "(สินค้านี้ถูกลบแล้ว)",
        unit: it.unit || (f ? f.unit : "หลา"),
        baseUnit: f ? f.unit : "",
        qty: it.qty,
        unit_price: it.unit_price,
        cost_price: 0,
        stock_qty: f ? f.stock_qty : null,
        is_misc: false,
      };
    });
    if (cartVat.length === 0) addPosRowVat();
    else renderPosItemsTableVat();
    refs.posVatCustomerSelect.setCustomerId(sale.customer_id || 0);
    refs.posVatDiscountInput.value = sale.discount || 0;
    if (refs.posVatDiscountUnitSelect) refs.posVatDiscountUnitSelect.value = "บาท";
    refs.posVatShippingFeeInput.value = sale.shipping_fee || 0;
    refs.posVatShippingMethodInput.value = sale.shipping_method || "";
    refs.posVatDueDateInput.value = sale.due_date || "";
    refs.posVatPaymentSelect.value = sale.payment_method;
    refs.posVatPaidInput.value = sale.paid;
    refs.posVatAccountSplit.setSplits(sale.account_splits || []);
    refs.posVatAccountSplitRow.style.display = sale.payment_method === "โอนเงิน" ? "" : "none";
    refs.posVatNoteInput.value = sale.note || "";
    updatePosTotalsVat();
    updateEditBannerUIVat();
    sections.posVat.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function cancelEditSalePOSVat() {
    editingSaleIdVat = null;
    cartVat = [];
    addPosRowVat();
    refs.posVatDiscountInput.value = 0;
    if (refs.posVatDiscountUnitSelect) refs.posVatDiscountUnitSelect.value = "บาท";
    refs.posVatPaidInput.value = 0;
    refs.posVatShippingFeeInput.value = 0;
    refs.posVatShippingMethodInput.value = "";
    refs.posVatDueDateInput.value = "";
    refs.posVatPaymentSelect.value = "เงินสดแต่ยังไม่จ่าย";
    refs.posVatAccountSplit.reset(0);
    refs.posVatAccountSplitRow.style.display = "none";
    refs.posVatNoteInput.value = "";
    const newCustomerSelect = buildCustomerSelectOptions();
    const oldSelect = refs.posVatCustomerSelect;
    if (oldSelect.parentNode) oldSelect.parentNode.replaceChild(newCustomerSelect, oldSelect);
    refs.posVatCustomerSelect = newCustomerSelect;
    updatePosTotalsVat();
    updateEditBannerUIVat();
  }

  function addPosRowVat() {
    cartVat.push({ fabric_id: "", code: "", name: "", unit: "หลา", baseUnit: "", qty: 1, unit_price: 0, cost_price: 0, stock_qty: null, is_misc: false });
    renderPosItemsTableVat();
    updatePosTotalsVat();
  }

  function addMiscPosRowVat() {
    cartVat.push({ fabric_id: "", code: "", name: "", unit: "ชิ้น", baseUnit: "", qty: 1, unit_price: 0, cost_price: 0, stock_qty: null, is_misc: true });
    renderPosItemsTableVat();
    updatePosTotalsVat();
  }

  function posRowSetFabricVat(idx, fidStr) {
    const fid = Number(fidStr) || 0;
    const f = fid ? DB.getFabric(fid) : null;
    if (f) {
      const saleUnit = cartVat[idx].unit || "หลา";
      cartVat[idx].fabric_id = f.id;
      cartVat[idx].code = f.code;
      cartVat[idx].name = f.name;
      cartVat[idx].unit = saleUnit;
      cartVat[idx].baseUnit = f.unit;
      cartVat[idx].stock_qty = f.stock_qty;
      if (!cartVat[idx].unit_price) cartVat[idx].unit_price = round2(f.sell_price * unitFactor(saleUnit, f.unit));
    } else {
      cartVat[idx] = { fabric_id: "", code: "", name: "", unit: cartVat[idx].unit || "หลา", baseUnit: "", qty: cartVat[idx].qty, unit_price: 0, stock_qty: null };
    }
    renderPosItemsTableVat();
    updatePosTotalsVat();
  }

  function posRowSetUnitVat(idx, unitVal) {
    const row = cartVat[idx];
    const f = row.fabric_id ? DB.getFabric(row.fabric_id) : null;
    if (f) {
      const oldFactor = unitFactor(row.unit, f.unit);
      const newFactor = unitFactor(unitVal, f.unit);
      const pricePerBase = row.unit_price && oldFactor ? row.unit_price / oldFactor : f.sell_price;
      row.unit_price = round2(pricePerBase * newFactor);
    }
    row.unit = unitVal;
    renderPosItemsTableVat();
    updatePosTotalsVat();
  }

  function renderPosItemsTableVat() {
    const container = refs.posVatItemsTableContainer;
    clear(container);
    const { opts: fabricOptions } = fabricSelectOptions();
    const unitOptions = [
      { value: "หลา", label: "หลา" },
      { value: "เมตร", label: "เมตร" },
    ];

    const thead = el(
      "thead",
      {},
      el(
        "tr",
        {},
        el("th", { text: "#" }),
        el("th", { text: "สินค้า (รหัส - ชื่อ)" }),
        el("th", { text: "จำนวน" }),
        el("th", { text: "หน่วย" }),
        el("th", { text: "ราคา/หน่วย" }),
        el("th", { text: "ทุน/หน่วย" }),
        el("th", { text: "รวม" }),
        el("th", { text: "คงเหลือ" }),
        el("th", { text: "" })
      )
    );
    const tbody = el("tbody", {});

    if (cartVat.length === 0) {
      tbody.appendChild(el("tr", {}, el("td", { colspan: 9, class: "empty", text: 'ยังไม่มีรายการ กด "+ เพิ่มรายการ"' })));
    }

    cartVat.forEach((row, idx) => {
      let productCell, unitCell;
      if (row.is_misc) {
        const nameInput = textInput(row.name);
        nameInput.setAttribute("placeholder", "ชื่อสินค้าฝากซื้อ เช่น กระดุม, ไม้แขวนเสื้อ");
        nameInput.addEventListener("input", (e) => {
          cartVat[idx].name = e.target.value;
        });
        productCell = el("td", {}, nameInput);

        const unitInputMisc = textInput(row.unit || "ชิ้น");
        unitInputMisc.addEventListener("input", (e) => {
          cartVat[idx].unit = e.target.value;
        });
        unitCell = el("td", {}, unitInputMisc);
      } else {
        const fabricSelect = searchSelectInput(fabricOptions, row.fabric_id ? String(row.fabric_id) : "", "พิมพ์รหัส/ชื่อผ้า");
        fabricSelect.inputEl.addEventListener("change", () => {
          const v = fabricSelect.getMatchedValue();
          if (v === null) {
            global.alert("ไม่พบผ้าตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
            const cur = fabricOptions.find((o) => o.value === (row.fabric_id ? String(row.fabric_id) : ""));
            fabricSelect.setLabel(cur ? cur.label : "");
            return;
          }
          posRowSetFabricVat(idx, v);
        });
        productCell = el("td", {}, fabricSelect);

        const unitSelect = selectInput(unitOptions, row.unit || "หลา");
        unitSelect.addEventListener("change", (e) => posRowSetUnitVat(idx, e.target.value));
        unitCell = el("td", {}, unitSelect);
      }

      const qtyInput = numberInput(row.qty);
      qtyInput.addEventListener("input", (e) => {
        cartVat[idx].qty = Number(e.target.value) || 0;
        updatePosRowAmountVat(idx);
        updatePosTotalsVat();
      });

      const priceInput = numberInput(row.unit_price);
      priceInput.addEventListener("input", (e) => {
        cartVat[idx].unit_price = Number(e.target.value) || 0;
        updatePosRowAmountVat(idx);
        updatePosTotalsVat();
      });

      let costCell;
      if (row.is_misc) {
        const costInput = numberInput(row.cost_price || 0);
        costInput.addEventListener("input", (e) => {
          cartVat[idx].cost_price = Number(e.target.value) || 0;
        });
        costCell = el("td", {}, costInput);
      } else {
        costCell = el("td", { text: "-" });
      }

      let stockText = "-";
      if (row.stock_qty !== null && row.stock_qty !== undefined && row.baseUnit) {
        stockText = `${row.stock_qty} ${row.baseUnit}`;
        if (row.unit && row.unit !== row.baseUnit) {
          const factor = unitFactor(row.unit, row.baseUnit);
          const equiv = factor ? row.stock_qty / factor : row.stock_qty;
          stockText += ` (≈ ${round2(equiv)} ${row.unit})`;
        }
      }
      const amountCell = el("td", { text: money(row.qty * row.unit_price) });
      refs["posVatRowAmount_" + idx] = amountCell;

      const removeBtn = el(
        "button",
        {
          class: "btn btn-sm",
          onClick: () => {
            cartVat.splice(idx, 1);
            renderPosItemsTableVat();
            updatePosTotalsVat();
          },
        },
        "ลบ"
      );

      const tr = el(
        "tr",
        {},
        el("td", { text: String(idx + 1) }),
        productCell,
        el("td", {}, qtyInput),
        unitCell,
        el("td", {}, priceInput),
        costCell,
        amountCell,
        el("td", { text: stockText }),
        el("td", {}, removeBtn)
      );
      tbody.appendChild(tr);
    });

    const table = el("table", { class: "data-table pos-item-table" }, thead, tbody);
    container.appendChild(table);
  }

  function updatePosRowAmountVat(idx) {
    const cell = refs["posVatRowAmount_" + idx];
    if (cell) cell.textContent = money(cartVat[idx].qty * cartVat[idx].unit_price);
  }

  function calcPosTotalsVat() {
    const subtotal = cartVat.reduce((s, it) => s + it.qty * it.unit_price, 0);
    const discountRaw = Number(refs.posVatDiscountInput.value) || 0;
    const discount = refs.posVatDiscountUnitSelect && refs.posVatDiscountUnitSelect.value === "%" ? round2((subtotal * discountRaw) / 100) : discountRaw;
    const base = Math.max(0, subtotal - discount);
    const vat = Math.round(base * VAT_RATE * 100) / 100;
    const shippingFee = Number(refs.posVatShippingFeeInput.value) || 0;
    const total = base + vat + shippingFee;
    return { subtotal, discount, vat, shippingFee, total };
  }

  function updatePosTotalsVat() {
    const { subtotal, discount, vat, shippingFee, total } = calcPosTotalsVat();
    refs.posVatSubtotalLbl.textContent = `ยอดรวมก่อนภาษี: ${money(subtotal - discount)} บาท`;
    if (refs.posVatVatLbl) {
      refs.posVatVatLbl.textContent = `ภาษีมูลค่าเพิ่ม ${Math.round(VAT_RATE * 100)}%: ${money(vat)} บาท`;
    }
    if (refs.posVatShippingLbl) {
      refs.posVatShippingLbl.textContent = `ค่าจัดส่ง: ${money(shippingFee)} บาท`;
    }
    refs.posVatTotalLbl.textContent = `ยอดสุทธิ: ${money(total)} บาท`;
    const paid = Number(refs.posVatPaidInput.value) || 0;
    const change = refs.posVatPaymentSelect.value !== "เงินเชื่อ" ? Math.max(0, paid - total) : 0;
    refs.posVatChangeLbl.textContent = `เงินทอน: ${money(change)} บาท`;
  }

  function checkoutVat() {
    const validItems = cartVat.filter((it) => it.qty > 0 && (it.is_misc ? (it.name || "").trim() : it.fabric_id));
    if (validItems.length === 0) {
      global.alert("กรุณาเลือกสินค้าและระบุจำนวนอย่างน้อย 1 รายการ");
      return;
    }
    const { subtotal, discount, vat, shippingFee, total } = calcPosTotalsVat();
    const custId = refs.posVatCustomerSelect.getCustomerId();
    const paymentMethod = refs.posVatPaymentSelect.value;
    const paid = Number(refs.posVatPaidInput.value) || 0;
    const shippingMethod = refs.posVatShippingMethodInput.value.trim();

    if (paymentMethod === "เงินเชื่อ") {
      if (!custId) {
        global.alert("การขายแบบเงินเชื่อต้องเลือกลูกค้า");
        return;
      }
      const customer = DB.getCustomer(custId);
      const newBalance = customer.credit_balance + (total - paid);
      if (customer.credit_limit > 0 && newBalance > customer.credit_limit) {
        const ok = global.confirm(
          `ลูกค้ารายนี้มีวงเงินเครดิต ${money(customer.credit_limit)} บาท ยอดหลังขายจะเป็น ${money(
            newBalance
          )} บาท เกินวงเงินที่กำหนด ต้องการดำเนินการต่อหรือไม่?`
        );
        if (!ok) return;
      }
    } else if (paymentMethod !== "เงินสด" && paymentMethod !== "เงินสดแต่ยังไม่จ่าย" && paid < total) {
      global.alert("จำนวนเงินที่รับน้อยกว่ายอดที่ต้องชำระ");
      return;
    }

    let accountSplits = null;
    if (paymentMethod === "โอนเงิน") {
      accountSplits = refs.posVatAccountSplit.getSplits();
      if (accountSplits.length === 0) {
        global.alert("กรุณาเลือกบัญชีที่รับโอน");
        return;
      }
      const splitTotal = refs.posVatAccountSplit.getTotal();
      if (splitTotal !== paid) {
        global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดที่รับ (${money(paid)}) กรุณาตรวจสอบ`);
        return;
      }
    }

    const items = validItems.map((it) => {
      if (it.is_misc) {
        return {
          fabric_id: null,
          is_misc: true,
          name: it.name.trim(),
          code: "",
          cost_price: it.cost_price || 0,
          qty: it.qty,
          unit_price: it.unit_price,
          unit: it.unit || "ชิ้น",
          stock_qty: 0,
        };
      }
      const f = DB.getFabric(it.fabric_id);
      const factor = f ? unitFactor(it.unit, f.unit) : 1;
      return {
        fabric_id: it.fabric_id,
        qty: it.qty,
        unit_price: it.unit_price,
        unit: it.unit,
        stock_qty: it.qty * factor,
      };
    });
    const sale = editingSaleIdVat
      ? DB.updateSale(editingSaleIdVat, items, custId || null, discount, vat, paymentMethod, paid, refs.posVatNoteInput.value.trim(), undefined, accountSplits, shippingFee, shippingMethod, refs.posVatDueDateInput.value, true)
      : DB.createSale(items, custId || null, discount, vat, paymentMethod, paid, refs.posVatNoteInput.value.trim(), undefined, accountSplits, shippingFee, shippingMethod, refs.posVatDueDateInput.value, true);

    showReceiptModal(sale, custId, validItems.slice());

    editingSaleIdVat = null;
    cartVat = [];
    addPosRowVat();
    refs.posVatDiscountInput.value = 0;
    if (refs.posVatDiscountUnitSelect) refs.posVatDiscountUnitSelect.value = "บาท";
    refs.posVatPaidInput.value = 0;
    refs.posVatShippingFeeInput.value = 0;
    refs.posVatShippingMethodInput.value = "";
    refs.posVatDueDateInput.value = "";
    refs.posVatPaymentSelect.value = "เงินสดแต่ยังไม่จ่าย";
    refs.posVatAccountSplit.reset(0);
    refs.posVatNoteInput.value = "";
    refs.posVatAccountSplitRow.style.display = "none";

    const newCustomerSelect = buildCustomerSelectOptions();
    const oldSelect = refs.posVatCustomerSelect;
    if (oldSelect.parentNode) {
      oldSelect.parentNode.replaceChild(newCustomerSelect, oldSelect);
    }
    refs.posVatCustomerSelect = newCustomerSelect;

    updatePosTotalsVat();
    updateEditBannerUIVat();
    renderPosSalesHistoryVat();
  }

  function buildReceiptDoc(sale, cust, shop, cartItems, docType) {
    const showVat = VAT_ENABLED || !!(sale && sale.is_vat);
    // docType: "delivery" (ใบส่งสินค้า) | "cash" (บิลเงินสด) | "normal" (ใบเสร็จปกติ)
    const isDeliveryDoc = docType === "delivery";
    const docTitle = isDeliveryDoc
      ? "ใบส่งสินค้า"
      : docType === "cash"
      ? "บิลเงินสด"
      : showVat
      ? "ใบกำกับภาษีอย่างย่อ / ใบเสร็จรับเงิน"
      : "ใบเสร็จรับเงิน";
    const custName = cust ? cust.name : "ลูกค้าทั่วไป";
    // สำหรับใบส่งสินค้าที่เป็นบิล VAT: แยกค่าจัดส่งออกจากยอดสุทธิ ไม่รวมเข้าไปในยอดสุทธิ
    const excludeShippingFromTotal = isDeliveryDoc && showVat;
    const displayTotal = excludeShippingFromTotal ? sale.total - (sale.shipping_fee || 0) : sale.total;

    // -------- plain text version (สำหรับดาวน์โหลดไฟล์ .txt) --------

    if (showVat && !isDeliveryDoc && shop.tax_id) lines.push(`เลขผู้เสียภาษี: ${shop.tax_id}`);

      lines.push(
        `${label.slice(0, 20).padEnd(20)}${qtyUnit.padStart(10)} x ${money(it.unit_price).padStart(9)} = ${money(sub).padStart(11)}`

    lines.push("-".repeat(40));

    lines.push("-".repeat(40));
    lines.push("ขอบคุณที่ใช้บริการ");

    lines.push("");
    lines.push("ลงชื่อ..................................... ผู้ส่งสินค้า");
    lines.push("");
    lines.push("ลงชื่อ..................................... ผู้รับสินค้า");

    // -------- HTML table version (สำหรับแสดงตัวอย่าง/พิมพ์) --------

  function getLatestRollBreakdown(fabricId) {
    const moves = DB.getStockMovements(fabricId); // เรียงใหม่สุดก่อน
    let baseIdx = -1;
    let baseRolls = null;
    for (let i = 0; i < moves.length; i++) {
      const rolls = moves[i].rolls && moves[i].rolls.length ? moves[i].rolls : parseRollsFromNote(moves[i].note);
      if (rolls && rolls.length) {
        baseIdx = i;
        baseRolls = rolls;
        break;
      }
    }
    if (baseRolls === null) return null;
    // รายการรับสินค้าเข้าที่เกิดขึ้นหลังจากนับสต็อกครั้งล่าสุด ให้นับเป็นไม้ใหม่ต่อท้าย
    // (รวมยอดสุทธิต่อใบรับสินค้า เผื่อกรณีมีการแก้ไข/ย้อนรายการรับสินค้านั้นภายหลัง)
    const afterBase = moves.slice(0, baseIdx).filter((m) => m.ref_type === "purchase");
    const netByRef = {};
    const order = [];
    afterBase.forEach((m) => {
      if (!(m.ref_id in netByRef)) order.push(m.ref_id);
      netByRef[m.ref_id] = (netByRef[m.ref_id] || 0) + m.qty;
    });
    order.reverse();
    const extraRolls = order.map((ref) => netByRef[ref]).filter((q) => q > 0.001);
    return baseRolls.concat(extraRolls);
  }

  function getRollBreakdownText(fabricId) {
    const rolls = getLatestRollBreakdown(fabricId);
    if (!rolls) return "";
    return rolls.map((r) => round2(r)).join(", ");
  }

  function openRollCountModal(fid, movementId) {
    const f = DB.getFabric(fid);
    const editingMovement = movementId ? DB.getStockMovements(fid).find((m) => m.id === movementId) : null;
    const legacyRolls = editingMovement && !(editingMovement.rolls && editingMovement.rolls.length) ? parseRollsFromNote(editingMovement.note) : null;
    const existingRolls = !editingMovement ? getLatestRollBreakdown(fid) : null;
    let rolls =
      editingMovement && editingMovement.rolls && editingMovement.rolls.length
        ? editingMovement.rolls.map((qty) => ({ qty }))
        : legacyRolls
        ? legacyRolls.map((qty) => ({ qty }))
        : existingRolls && existingRolls.length
        ? existingRolls.map((qty) => ({ qty }))
        : [{ qty: 0 }];
    const originalTotal = round2(rolls.reduce((s, r) => s + r.qty, 0));
    const rollsContainer = el("div", {});
    const totalLbl = el("div", { class: "totals-line totals-main", text: `รวม: 0 ${f.unit} (0 ไม้)` });

    function updateTotal() {
      const valid = rolls.filter((r) => r.qty > 0);
      const total = valid.reduce((s, r) => s + r.qty, 0);
      totalLbl.textContent = `รวม: ${money(total)} ${f.unit} (${valid.length} ไม้)`;
    }

    function renderRolls() {
      clear(rollsContainer);
      rolls.forEach((r, idx) => {
        const rollInput = numberInput(r.qty);
        rollInput.addEventListener("input", (e) => {
          rolls[idx].qty = Number(e.target.value) || 0;
          updateTotal();
        });
        const removeBtn = el(
          "button",
          {
            class: "btn btn-sm",
            onClick: () => {
              rolls.splice(idx, 1);
              if (rolls.length === 0) rolls.push({ qty: 0 });
              renderRolls();
              updateTotal();
            },
          },
          "ลบ"
        );
        rollsContainer.appendChild(
          formField(`ไม้ที่ ${idx + 1}`, el("div", { class: "discount-input-row" }, rollInput, removeBtn))
        );
      });
    }

    const addRollBtn = el(
      "button",
      {
        class: "btn btn-sm",
        onClick: () => {
          rolls.push({ qty: 0 });
          renderRolls();
          updateTotal();
        },
      },
      "+ เพิ่มไม้"
    );

    renderRolls();
    updateTotal();

    const noteInput = textInput(editingMovement ? (editingMovement.note || "").split(" - ").slice(1).join(" - ") : "");
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const valid = rolls.filter((r) => r.qty > 0);
          if (valid.length === 0) {
            global.alert("กรุณาระบุจำนวนอย่างน้อย 1 ไม้");
            return;
          }
          const total = round2(valid.reduce((s, r) => s + r.qty, 0));
          const rollsText = valid.map((r) => r.qty).join(", ");
          let note = `นับสต็อกแยกไม้ (${valid.length} ไม้: ${rollsText} ${f.unit} รวม ${money(total)} ${f.unit})`;
          if (noteInput.value.trim()) note += " - " + noteInput.value.trim();
          if (editingMovement) {
            note += " (แก้ไขแล้ว)";
            DB.updateRollCount(
              movementId,
              originalTotal,
              valid.map((r) => r.qty),
              note
            );
          } else {
            DB.recordRollCount(
              fid,
              valid.map((r) => r.qty),
              note
            );
          }
          closeModal();
          renderStockTable();
        },
      },
      editingMovement ? "บันทึกการแก้ไข" : "บันทึกยอดนับ"
    );

    const body = el(
      "div",
      {},
      el("p", {
        text: editingMovement
          ? `${f.name} ยอดในระบบปัจจุบัน: ${f.stock_qty} ${f.unit} (แก้ไขยอดที่เคยนับไว้ครั้งนี้)`
          : `${f.name} ยอดในระบบปัจจุบัน: ${f.stock_qty} ${f.unit}`,
      }),
      rollsContainer,
      addRollBtn,
      totalLbl,
      formField("หมายเหตุเพิ่มเติม", noteInput),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("rollCount", { rollsContainer, addRollBtn, noteInput, saveBtn, getRolls: () => rolls });
    openModal(editingMovement ? `แก้ไขยอดนับ - ${f.name}` : `นับสต็อกแยกไม้ - ${f.name}`, body, { wide: true });
  }

  // คำนวณรหัสผ้าจริงจาก base_code + รหัสซัพพลายเออร์ "ปัจจุบัน" (ไม่พึ่ง prefix ที่ hardcode ไว้)
  function computeBulkFabricCode(row, supplierByName) {
    const sup = row.supplier_name ? supplierByName.get(row.supplier_name.trim().toLowerCase()) : null;
    if (row.exact_code) {
      return { code: row.code || "", supplierId: sup ? sup.id : null };
    }
    const prefix = sup && sup.code ? sup.code.slice(-3) : "";
    const base = row.base_code || row.code || "";
    const code = prefix ? `${prefix}-${base}` : base;
    return { code, supplierId: sup ? sup.id : null };
  }

  function importBulkFabrics(opts) {
    opts = opts || {};
    if (!BULK_IMPORT_FABRICS.length) return { added: 0, skipped: 0 };
    if (!opts.silent) {
      if (
        !global.confirm(
          `นำเข้ารายการสินค้าที่เตรียมไว้ ${BULK_IMPORT_FABRICS.length} รายการ? รหัสผ้าจะถูกเติม prefix ตามรหัสซัพพลายเออร์ปัจจุบันโดยอัตโนมัติ และระบบจะข้ามรหัสที่ซ้ำกับที่มีอยู่แล้วให้อัตโนมัติ`
        )
      )
        return { added: 0, skipped: 0 };
    }
    const suppliers = DB.getSuppliers();
    const supplierByName = new Map(suppliers.map((s) => [s.name.trim().toLowerCase(), s]));
    const existingKeys = new Set(
      DB.getFabrics(null, { onlyActive: false }).map((f) => (f.code || "").trim().toLowerCase())
    );
    let added = 0;
    let skipped = 0;
    BULK_IMPORT_FABRICS.forEach((row) => {
      const { code, supplierId } = computeBulkFabricCode(row, supplierByName);
      const key = code.trim().toLowerCase();
      if (!key || existingKeys.has(key)) {
        skipped++;
        return;
      }
      DB.addFabric({
        code: code,
        name: row.name,
        category: row.category,
        color: row.color || "",
        unit: row.unit || "หลา",
        sell_price: row.sell_price,
        cost_price: row.cost_price,
        reorder_point: row.reorder_point,
        supplier_id: supplierId,
        note: row.note || "",
      });
      existingKeys.add(key);
      added++;
    });
    if (added > 0 && refs.stockTableContainer) renderStockTable();
    if (!opts.silent) {
      global.alert(`นำเข้าสินค้าสำเร็จ ${added} ราย (ข้ามซ้ำ ${skipped} ราย)`);
    }
    return { added, skipped };
  }

  function applySupplierPrefixToFabrics() {
    const fabrics = DB.getFabrics(null, { onlyActive: false });
    if (fabrics.length === 0) {
      global.alert("ยังไม่มีสินค้าในคลัง");
      return;
    }
    if (
      !global.confirm(
        `ต้องการเติมรหัสซัพพลายเออร์ (3 ตัวท้ายของรหัสซัพพลายเออร์) ไว้หน้ารหัสผ้าทุกรายการที่มีซัพพลายเออร์หรือไม่? (รายการที่ขึ้นต้นด้วย prefix นี้อยู่แล้วจะไม่ถูกเติมซ้ำ — ถ้ารหัสมี prefix เก่าซ้อนอยู่ ให้ใช้ปุ่ม "ลบผ้าตามรหัสขึ้นต้น" ลบรายการที่ผิดออกก่อนแล้วนำเข้าใหม่)`
      )
    )
      return;
    let updated = 0;
    let skippedNoSupplier = 0;
    let skippedAlready = 0;
    fabrics.forEach((f) => {
      if (!f.supplier_id) {
        skippedNoSupplier++;
        return;
      }
      const sup = DB.getSupplier(f.supplier_id);
      if (!sup || !sup.code) {
        skippedNoSupplier++;
        return;
      }
      const prefix = sup.code.slice(-3);
      if (f.code.startsWith(prefix + "-")) {
        skippedAlready++;
        return;
      }
      DB.updateFabric(f.id, { code: prefix + "-" + f.code });
      updated++;
    });
    if (refs.stockTableContainer) renderStockTable();
    global.alert(
      `เติมรหัสซัพพลายเออร์เรียบร้อย ${updated} รายการ (ข้าม ${skippedAlready} รายการที่มีรหัสอยู่แล้ว, ข้าม ${skippedNoSupplier} รายการที่ไม่มีซัพพลายเออร์)`
    );
  }

  // ลบ (ปิดการใช้งาน) รายการผ้าทั้งหมดที่รหัสขึ้นต้นด้วยข้อความที่ระบุ เช่น "002-062-Fla"

  function renumberAllSupplierCodes() {
    const suppliers = [...store.suppliers].sort((a, b) => {
      const c = (a.code || "").localeCompare(b.code || "", undefined, { numeric: true });
      return c !== 0 ? c : a.id - b.id;
    });
    if (suppliers.length === 0) {
      global.alert("ยังไม่มีซัพพลายเออร์");
      return;
    }
    if (
      !global.confirm(
        `ต้องการออกรหัสซัพพลายเออร์ใหม่ทั้งหมด ${suppliers.length} ราย เรียงตามรหัส/ลำดับที่มีอยู่ให้เป็นชุดเดียวกันไม่ซ้ำกันหรือไม่?\nรหัสเดิมทั้งหมดจะถูกแทนที่ด้วยรหัสใหม่ (SU00001, SU00002, ...) และรหัสผ้าที่มี prefix ซัพพลายเออร์อยู่แล้วจะถูกปรับ prefix ให้ตรงกันโดยอัตโนมัติ การกระทำนี้ย้อนกลับไม่ได้`
      )
    )
      return;
    const allFabrics = DB.getFabrics(null, { onlyActive: false });
    let fabricsFixed = 0;
    suppliers.forEach((s, idx) => {
      const oldCode = s.code || "";
      const newCode = "SU" + String(idx + 1).padStart(5, "0");
      const oldPrefix = oldCode.slice(-3);
      const newPrefix = newCode.slice(-3);
      DB.updateSupplier(s.id, { code: newCode });
      if (oldPrefix === newPrefix || !oldPrefix) return;
      allFabrics
        .filter((f) => f.supplier_id === s.id && f.code.startsWith(oldPrefix + "-"))
        .forEach((f) => {
          DB.updateFabric(f.id, { code: newPrefix + f.code.slice(oldPrefix.length) });
          fabricsFixed++;
        });
    });
    renderSupplierTable();
    global.alert(
      `ออกรหัสซัพพลายเออร์ใหม่เรียบร้อย ${suppliers.length} ราย (SU00001 ถึง SU${String(suppliers.length).padStart(5, "0")}) ไม่มีรหัสซ้ำแล้ว` +
        (fabricsFixed ? ` และปรับ prefix รหัสผ้าให้ตรงกัน ${fabricsFixed} รายการ` : "")
    );
  }

  function renderPurchaseTable() {
    const container = refs.purchaseTableContainer;
    clear(container);
    let purchases = DB.getPurchases();
    if (!purchaseShowAll) {
      const fromDate = purchaseDate || DB.todayStr();
      const toDate = purchaseDateTo || DB.todayStr();
      purchases = purchases.filter((p) => {
        const d = p.date.slice(0, 10);
        return d >= fromDate && d <= toDate;
      });
    }
    const pq = purchaseSearch.trim().toLowerCase();
    if (pq) {
      purchases = purchases.filter((p) => {
        const s = DB.getSupplier(p.supplier_id);
        const supName = s ? s.name : "";
        return (p.po_no || "").toLowerCase().includes(pq) || supName.toLowerCase().includes(pq);
      });
    }
    if (refs.purchaseSummary) {
      const totalAmount = purchases.reduce((sum, p) => sum + p.total, 0);
      refs.purchaseSummary.textContent = `รวม ${purchases.length} ใบ ยอดรวม ${money(totalAmount)} บาท`;
    }
    const rows = purchases.map((p) => {
      const s = DB.getSupplier(p.supplier_id);
      return [p.po_no, fmtDate(p.date), s ? s.name : "", money(p.discount || 0), money(p.total), p.status, p.payment_status];
    });
    const table = buildDataTable(
      ["เลขที่เอกสารรับเข้า", "วันที่", "ผู้จัดจำหน่าย", "ส่วนลด", "ยอดรวม", "สถานะรับของ", "สถานะชำระเงิน"],
      rows,
      {
        cellStyle: (row, ci, colName) =>
          colName === "สถานะชำระเงิน" && row[ci] === "ค้างชำระ" ? { color: "var(--danger)", fontWeight: "600" } : null,
        actions: (idx) => {
          const p = purchases[idx];
          const actions = [{ label: "ดูรายการ", onClick: () => openPurchaseItemsModal(p.id) }];
          if (p.status !== "รับสินค้าแล้ว") {
            actions.push({
              label: "รับสินค้า",
              onClick: () => {
                if (global.confirm("ยืนยันรับสินค้าเข้าสต็อกตามใบสั่งซื้อนี้?")) {
                  DB.receivePurchase(p.id);
                  renderPurchaseTable();
                }
              },
            });
          }
          if (p.paid < p.total) {
            actions.push({ label: "บันทึกจ่ายเงิน", onClick: () => openPurchasePayModal(p.id) });
          }
          if (p.payment_status === "ชำระแล้ว") {
            actions.push({
              label: "ยกเลิกการชำระ",
              onClick: () => {
                if (global.confirm(`ต้องการยกเลิกการชำระเงินของใบสั่งซื้อ ${p.po_no} กลับเป็นสถานะค้างชำระหรือไม่?`)) {
                  DB.unpayPurchase(p.id);
                  renderPurchaseTable();
                }
              },
            });
          }
          actions.push({ label: "แก้ไข", onClick: () => openPurchaseModal(p.id) });
          actions.push({
            label: "ลบ",
            onClick: () => {
              const msg =
                p.status === "รับสินค้าแล้ว"
                  ? `ใบสั่งซื้อ ${p.po_no} รับสินค้าเข้าสต็อกไปแล้ว การลบจะตัดสต็อกที่รับเข้าออกและปรับยอดหนี้ซัพพลายเออร์คืนให้อัตโนมัติ ต้องการลบหรือไม่?`
                  : `ต้องการลบใบสั่งซื้อ ${p.po_no} หรือไม่?`;
              if (global.confirm(msg)) {
                DB.deletePurchase(p.id);
                renderPurchaseTable();
              }
            },
          });
          return actions;
        },
      }
    );
    container.appendChild(table);
  }

  function openPurchaseModal(editPurchaseId) {
    const suppliers = DB.getSuppliers();
    const fabrics = DB.getFabrics();
    if (suppliers.length === 0) {
      global.alert("กรุณาเพิ่มซัพพลายเออร์ก่อน");
      return;
    }
    if (fabrics.length === 0) {
      global.alert("กรุณาเพิ่มรายการผ้าก่อน");
      return;
    }

    const editingPurchase = editPurchaseId ? DB.getPurchase(editPurchaseId) : null;

    let items = editingPurchase
      ? editingPurchase.items.map((it) => {
          const f = DB.getFabric(it.fabric_id);
          return {
            fabric_id: it.fabric_id,
            code: f ? f.code : "-",
            name: f ? f.name : "(สินค้านี้ถูกลบแล้ว)",
            category: f ? f.category : "",
            unit: f ? f.unit : "หลา",
            qty: it.qty,
            unit_cost: it.unit_cost,
            discount: it.discount || 0,
          };
        })
      : [];
    let currentPo = editingPurchase || null;

    const poNoInput = textInput(editingPurchase ? editingPurchase.po_no : "");
    poNoInput.setAttribute("placeholder", "ปล่อยว่างได้ ระบบจะออกเลขที่ให้อัตโนมัติ");
    poNoInput.addEventListener("input", () => {
      if (items.length > 0) syncPurchase();
    });
    const dateInput = dateInputEl({ value: editingPurchase ? editingPurchase.date : DB.todayStr() });
    dateInput.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
    const dueDateInput = dateInputEl({ value: editingPurchase ? editingPurchase.due_date || "" : "" });
    dueDateInput.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
    const supplierOptions = suppliers.map((s) => ({ value: String(s.id), label: `${s.code} - ${s.name}` }));
    const initialSupplierValue = editingPurchase
      ? String(editingPurchase.supplier_id)
      : supplierOptions[0]
      ? supplierOptions[0].value
      : "";
    const supplierSelect = searchSelectInput(
      supplierOptions,
      initialSupplierValue,
      "พิมพ์รหัส/ชื่อซัพพลายเออร์เพื่อค้นหา..."
    );
    supplierSelect._supplierId = Number(initialSupplierValue) || 0;
    supplierSelect.inputEl.addEventListener("change", () => {
      const v = supplierSelect.getMatchedValue();
      if (!v) {
        global.alert("ไม่พบซัพพลายเออร์ตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
        const cur = supplierOptions.find((o) => o.value === String(supplierSelect._supplierId));
        supplierSelect.setLabel(cur ? cur.label : "");
        return;
      }
      supplierSelect._supplierId = Number(v);
      if (items.length > 0) syncPurchase();
    });
    supplierSelect.getSupplierId = () => supplierSelect._supplierId;
    const paymentSelect = selectInput(
      [
        { value: "เงินเชื่อ", label: "เงินเชื่อ" },
        { value: "เงินสด", label: "เงินสด" },
        { value: "โอนเงิน", label: "โอนเงิน" },
      ],
      editingPurchase ? editingPurchase.payment_method : "เงินเชื่อ"
    );
    paymentSelect.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
        const fabricOptions = [{ value: "", label: "-- เลือกผ้า --" }].concat(
      fabrics.map((f) => ({ value: String(f.id), label: `${f.code} - ${f.name}` }))
    );
    // บันทึกรายการอัตโนมัติเมื่อออกจากช่องส่วนลด (ไม่ว่าจะกรอกหรือข้าม) แทนการหน่วงเวลา
    // เพื่อไม่ให้บันทึกไปก่อนที่จะกรอกส่วนลดเสร็จ ไม่ว่าจะพิมพ์ช้าหรือเร็วแค่ไหน
    function addItemFromRowNow(opts) {
      tryAddItemFromRow(opts || { alertOnInvalid: false });
    }
    const fabricSelect = searchSelectInput(fabricOptions, "", "พิมพ์รหัส/ชื่อผ้าเพื่อค้นหา...");
    fabricSelect.getFabricId = () => {
      const v = fabricSelect.getMatchedValue();
      return v ? Number(v) : 0;
    };
    fabricSelect.inputEl.addEventListener("change", () => {
      const v = fabricSelect.getMatchedValue();
      if (v === null) {
        global.alert("ไม่พบผ้าตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
        fabricSelect.setLabel("");
        return;
      }
      addItemFromRowNow({ alertOnInvalid: false });
    });
    const qtyInput = numberInput("");
    qtyInput.setAttribute("placeholder", "จำนวน");
    const unitSelect = selectInput(
      [
        { value: "หลา", label: "หลา" },
        { value: "เมตร", label: "เมตร" },
      ],
      "หลา"
    );
    const costInput = numberInput("");
    costInput.setAttribute("placeholder", "ราคาทุน/หน่วย");
    const itemDiscInput = numberInput("");
    itemDiscInput.setAttribute("placeholder", "ส่วนลด");
    const itemDiscUnitSelect = selectInput(
      [
        { value: "บาท", label: "บาท" },
        { value: "%", label: "%" },
      ],
      "บาท"
    );
    const itemDiscRow = el("div", { class: "discount-input-row" }, itemDiscInput, itemDiscUnitSelect);
    // บันทึกเมื่อโฟกัสออกจาก "กลุ่ม" ช่องส่วนลดทั้งหมด (ตัวเลข + หน่วย) เท่านั้น ไม่ใช่ทีละช่อง
    // เพื่อรองรับทั้งกรณีเลือกหน่วยก่อนแล้วค่อยพิมพ์ตัวเลข และพิมพ์ตัวเลขก่อนแล้วค่อยเลือกหน่วย
    // (ใช้ focusout เพราะ bubble ได้ ต่างจาก blur ที่ไม่ bubble, เช็ค relatedTarget ว่ายังอยู่ในกลุ่มเดิมหรือไม่)
    itemDiscRow.addEventListener("focusout", (e) => {
      if (e.relatedTarget && itemDiscRow.contains(e.relatedTarget)) return;
      addItemFromRowNow({ alertOnInvalid: false });
    });
    const itemsContainer = el("div", { class: "table-container" });
    const vatChk = el("input", { type: "checkbox", checked: editingPurchase ? editingPurchase.vat_amount > 0 : true });
    vatChk.addEventListener("change", () => {
      if (items.length > 0) syncPurchase();
    });
    const autoSaveStatus = el("div", { class: "totals-line", text: "" });

    // บันทึกอัตโนมัติทุกครั้งที่มีการเพิ่ม/ลบ/แก้ไขรายการ ไม่ต้องกดปุ่มบันทึกเอง
    // และรับสินค้าเข้าสต็อก/ตั้งยอดหนี้ซัพพลายเออร์ให้ทันที ไม่ต้องกดรับสินค้าเองอีกขั้นตอน
    function syncPurchase() {
      if (items.length === 0) {
        if (currentPo) {
          DB.deletePurchase(currentPo.id);
          currentPo = null;
        }
        autoSaveStatus.textContent = "";
        renderPurchaseTable();
        return;
      }
      // เลขที่เอกสารรับเข้าปล่อยว่างได้ ถ้าไม่กรอกระบบจะออกเลขที่ให้อัตโนมัติแล้วเติมกลับเข้าช่องให้เห็น
      let poNo = poNoInput.value.trim();
      if (!poNo) {
        poNo = currentPo ? currentPo.po_no : DB.genPoNo();
      }
      const subtotal = items.reduce((s, it) => s + it.qty * it.unit_cost, 0);
      const discount = items.reduce((s, it) => s + (it.discount || 0), 0);
      const vatBase = Math.max(0, subtotal - discount);
      const vat = VAT_ENABLED && vatChk.checked ? Math.round(vatBase * VAT_RATE * 100) / 100 : 0;
      // แปลงจำนวน/ราคาทุนที่กรอก (หน่วยที่เลือกรับ) ให้เป็นหน่วยฐานของสินค้าก่อนบันทึก เพื่อให้สต็อกถูกต้อง
      const convertedItems = items.map((it) => {
        const fab = fabrics.find((f) => f.id === it.fabric_id);
        const factor = fab ? unitFactor(it.unit, fab.unit) : 1;
        return {
          fabric_id: it.fabric_id,
          qty: it.qty * factor,
          unit_cost: factor ? it.unit_cost / factor : it.unit_cost,
          discount: it.discount || 0,
        };
      });
      if (!currentPo) {
        currentPo = DB.createPurchase(
          convertedItems,
          supplierSelect.getSupplierId(),
          discount,
          vat,
          paymentSelect.value,
          "",
          dateInput.value || DB.todayStr(),
          poNo,
          dueDateInput.value || ""
        );
      } else {
        currentPo = DB.updatePurchase(
          currentPo.id,
          convertedItems,
          supplierSelect.getSupplierId(),
          discount,
          vat,
          paymentSelect.value,
          "",
          dateInput.value || DB.todayStr(),
          poNo,
          dueDateInput.value || ""
        );
      }
      if (poNoInput.value.trim() !== currentPo.po_no) poNoInput.value = currentPo.po_no;
      autoSaveStatus.textContent = `บันทึกอัตโนมัติแล้ว (${currentPo.po_no}) ยอดรวม ${money(currentPo.total)} บาท`;
      renderPurchaseTable();
    }

    function refreshItemsTable() {
      clear(itemsContainer);
      const table = buildDataTable(
        ["รหัสสินค้า", "ชื่อผ้า", "ชนิดผ้า", "จำนวน", "หน่วย", "ราคาทุน/หน่วย", "ส่วนลด", "รวม"],
        items.map((it) => [
          it.code,
          it.name,
          it.category || "-",
          it.qty,
          it.unit,
          money(it.unit_cost),
          money(it.discount || 0),
          money(it.qty * it.unit_cost - (it.discount || 0)),
        ]),
        {
          actions: (idx) => [
            {
              label: "ลบ",
              onClick: () => {
                if (items.length === 1 && currentPo && currentPo.status === "รับสินค้าแล้ว") {
                  if (
                    !global.confirm(
                      `ใบสั่งซื้อ ${currentPo.po_no} รับสินค้าเข้าสต็อกไปแล้ว การลบรายการสุดท้ายจะลบใบสั่งซื้อนี้ทิ้งทั้งใบ และตัดสต็อก/ปรับยอดหนี้ซัพพลายเออร์คืนให้อัตโนมัติ ต้องการดำเนินการต่อหรือไม่?`
                    )
                  ) {
                    return;
                  }
                }
                items.splice(idx, 1);
                refreshItemsTable();
                syncPurchase();
              },
            },
          ],
        }
      );
      itemsContainer.appendChild(table);
    }
    refreshItemsTable();

    // เพิ่มรายการสินค้าเข้าตะกร้าจากแถวกรอก ถ้า alertOnInvalid=false จะไม่โชว์แจ้งเตือนเวลาข้อมูลยังกรอกไม่ครบ
    // (ใช้เรียกอัตโนมัติทุกครั้งที่กรอกครบทั้งเลือกผ้า/จำนวน/ราคาทุน โดยไม่ต้องกดปุ่ม "เพิ่มรายการ" เอง)
    function tryAddItemFromRow(opts) {
      opts = opts || {};
      const matched = fabricSelect.getMatchedValue();
      if (!matched) {
        if (opts.alertOnInvalid) global.alert("กรุณาเลือกสินค้าและกรอกจำนวนให้ถูกต้อง");
        return false;
      }
      const fid = Number(matched) || 0;
      const fab = fabrics.find((f) => f.id === fid);
      const qty = Number(qtyInput.value);
      const cost = Number(costInput.value);
      if (!fab || !qty || qty <= 0) {
        if (opts.alertOnInvalid) global.alert("กรุณาเลือกสินค้าและกรอกจำนวนให้ถูกต้อง");
        return false;
      }
      if (costInput.value === "" || cost < 0) {
        if (opts.alertOnInvalid) global.alert("กรุณากรอกราคาทุน");
        return false;
      }
      const discRaw = Number(itemDiscInput.value) || 0;
      const lineSubtotal = qty * cost;
      const discount = itemDiscUnitSelect.value === "%" ? round2((lineSubtotal * discRaw) / 100) : discRaw;
      items.push({
        fabric_id: fid,
        code: fab.code,
        name: fab.name,
        category: fab.category,
        unit: unitSelect.value || "หลา",
        qty,
        unit_cost: cost,
        discount,
      });
      fabricSelect.setLabel("");
      qtyInput.value = "";
      costInput.value = "";
      itemDiscInput.value = "";
      itemDiscUnitSelect.value = "บาท";
      refreshItemsTable();
      syncPurchase();
      return true;
    }

    const addItemBtn = el(
      "button",
      {
        class: "btn btn-sm btn-primary",
        onClick: () => tryAddItemFromRow({ alertOnInvalid: true }),
      },
      "เพิ่มรายการ"
    );

    const addRow = el("div", { class: "toolbar" }, fabricSelect, qtyInput, unitSelect, costInput, itemDiscRow, addItemBtn);

    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          tryAddItemFromRow({ alertOnInvalid: false });
          syncPurchase();
          closeModal();
          renderPurchaseTable();
        },
      },
      "เสร็จสิ้น"
    );

    const body = el(
      "div",
      {},
      el(
        "div",
        { class: "form-grid" },
        formField("ร้านผู้จัดจำหน่าย", supplierSelect),
        formField("เลขที่เอกสารรับเข้า", poNoInput),
        formField("วันที่เอกสาร", dateInput),
        formField("วันที่ครบกำหนดชำระเงิน", dueDateInput),
        formField("ชำระโดย", paymentSelect)
      ),
      el("h4", { text: "รายการสินค้า" }),
      addRow,
      itemsContainer,
      VAT_ENABLED ? el("label", { class: "chk-label" }, vatChk, ` คิดภาษีมูลค่าเพิ่ม ${Math.round(VAT_RATE * 100)}%`) : null,
      autoSaveStatus,
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("purchaseForm", {
      poNoInput, dateInput, dueDateInput, supplierSelect, paymentSelect,
      fabricSelect, qtyInput, unitSelect, costInput, itemDiscInput, itemDiscUnitSelect, addItemBtn, saveBtn,
      getItems: () => items,
      getCurrentPo: () => currentPo,
    });
    openModal(editingPurchase ? `แก้ไขใบสั่งซื้อ ${editingPurchase.po_no}` : "สร้างใบรับสินค้าเข้าใหม่", body, { wide: true });
  }

  function openPurchasePayModal(pid) {
    const p = DB.getPurchase(pid);
    const remain = p.total - p.paid;
    const amountInput = numberInput(remain);
    const methodSelect = selectInput(
      [
        { value: "เงินสด", label: "เงินสด" },
        { value: "โอนเงิน", label: "โอนเงิน" },
      ],
      "เงินสด"
    );
    const accountSplit = buildAccountSplitRows(remain);
    const accountSplitRow = formField("จ่ายจากบัญชี (แบ่งหลายบัญชีได้)", el("div", {}, accountSplit.container, accountSplit.addBtn));
    function updateAccountRowVisibility() {
      accountSplitRow.style.display = methodSelect.value === "โอนเงิน" ? "" : "none";
      if (methodSelect.value === "โอนเงิน") accountSplit.reset(Number(amountInput.value) || remain);
    }
    methodSelect.addEventListener("change", updateAccountRowVisibility);
    updateAccountRowVisibility();
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const amt = Number(amountInput.value);
          if (!amt || amt <= 0 || amt > remain) {
            global.alert("กรุณาระบุจำนวนเงินให้ถูกต้อง");
            return;
          }
          const method = methodSelect.value;
          let accountSplits = [];
          if (method === "โอนเงิน") {
            accountSplits = accountSplit.getSplits();
            if (accountSplits.length === 0) {
              global.alert("กรุณาเลือกบัญชีที่จ่ายเงิน");
              return;
            }
            const splitTotal = accountSplit.getTotal();
            if (splitTotal !== amt) {
              global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดที่จ่าย (${money(amt)}) กรุณาตรวจสอบ`);
              return;
            }
          }
          DB.payPurchase(pid, amt, method, accountSplits);
          if (p.payment_method === "เงินเชื่อ") {
            DB.paySupplierCredit(p.supplier_id, amt, "เงินสด", `ชำระตาม PO ${p.po_no}`);
          }
          closeModal();
          renderPurchaseTable();
        },
      },
      "บันทึกจ่ายเงิน"
    );
    const body = el(
      "div",
      {},
      el("p", { text: `ค้างชำระ ${money(remain)} บาท` }),
      formField("จำนวนที่จ่าย", amountInput),
      formField("จ่ายโดย", methodSelect),
      accountSplitRow,
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("purchasePay", { amountInput, methodSelect, accountSplit, saveBtn });
    openModal("บันทึกจ่ายเงิน", body);
  }

  // =================================================================== รายการรอสินค้า
  let backorderSearch = "";
  let backorderShowDone = true;

  function renderBackorders() {
    const sec = sections.backorders;
    clear(sec);
    const searchInput = el("input", { type: "text", placeholder: "ค้นหา (ชื่อลูกค้า/ชื่อผ้า)", value: backorderSearch,
      onInput: (e) => { backorderSearch = e.target.value; renderBackorderTable(); } });
    const showDoneChk = el("input", { type: "checkbox", checked: backorderShowDone,
      onChange: (e) => { backorderShowDone = e.target.checked; renderBackorderTable(); } });
    const toolbar = el(
      "div",
      { class: "toolbar" },
      searchInput,
      el("label", { class: "chk-label" }, showDoneChk, " แสดงที่เสร็จแล้วด้วย"),
      el("button", { class: "btn btn-primary", onClick: () => openBackorderModal() }, "+ เพิ่มรายการ")
    );
    const tableContainer = el("div", { class: "table-container" });
    refs.backorderTableContainer = tableContainer;
    sec.appendChild(el("div", { class: "section-inner" }, toolbar, tableContainer));
    renderBackorderTable();
  }

  function renderBackorderTable() {
    const container = refs.backorderTableContainer;
    if (!container) return;
    clear(container);
    let rows = DB.getBackorders();
    if (!backorderShowDone) rows = rows.filter((b) => !b.done);
    const withCustomer = rows.map((b) => ({ b, c: b.customer_id ? DB.getCustomer(b.customer_id) : null }));
    const q = backorderSearch.trim().toLowerCase();
    let filtered = withCustomer;
    if (q) {
      filtered = withCustomer.filter(({ b, c }) => {
        const name = c ? c.name : b.customer_name || "";
        const code = c ? c.code : "";
        const phone = c ? c.phone : b.customer_phone || "";
        return (
          name.toLowerCase().includes(q) ||
          code.toLowerCase().includes(q) ||
          (phone || "").includes(q) ||
          (b.fabric_name || "").toLowerCase().includes(q)
        );
      });
    }
    rows = filtered.map((x) => x.b);
    const table = buildDataTable(
      ["วันที่", "ลูกค้า", "เบอร์โทร", "ผ้าที่ต้องการ", "จำนวน", "สถานะ", "หมายเหตุ"],
      filtered.map(({ b, c }) => [
        fmtDate(b.date),
        c ? `${c.code} - ${c.name}` : b.customer_name || "-",
        c ? c.phone || "-" : b.customer_phone || "-",
        b.fabric_name || "-",
