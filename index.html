/* styles.css - โปรแกรมร้านผ้าศิริเจริญ เวอร์ชันเว็บ */
:root {
  --primary: #1f5c94;
  --primary-dark: #123a5e;
  --primary-light: #e5edf5;
  --accent: #0a1420;
  --bg: #eef1f5;
  --panel-bg: #ffffff;
  --border: #dbe4ee;
  --text: #22303f;
  --text-muted: #64748b;
  --danger: #c0392b;
  --success: #2e8b57;
  --radius: 10px;
  --sidebar-bg-top: #0f2338;
  --sidebar-bg-bottom: #060d16;
  --sidebar-bg-active: #16324f;
  --sidebar-text: #9db3c9;
  --sidebar-text-active: #ffffff;
  --sidebar-border: rgba(255,255,255,0.08);
}

/* เอาลูกศรขึ้น-ลงในช่องกรอกตัวเลขออกทั้งหมด เพราะเผลอเลื่อนเมาส์แล้วค่าเปลี่ยนไปโดยไม่ตั้งใจบ่อย (ยังพิมพ์ตัวเลขปกติได้) */
input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
input[type="number"] {
  -moz-appearance: textfield;
}

.vat-theme {
  --primary: #c0392b;
  --primary-dark: #922b21;
  --primary-light: #fdecea;
  --accent: #c0392b;
  --bg: #ffffff;
  --panel-bg: #ffffff;
  --border: #bbbbbb;
  --text: #000000;
  --text-muted: #555555;
  --danger: #c0392b;
  --success: #000000;
  background: #ffffff;
}
.tab-btn-vat.active { color: #c0392b !important; border-bottom-color: #c0392b !important; font-weight: 700; }
.tab-btn-vat:hover { color: #c0392b !important; background: #fdecea !important; }

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "Kanit", "Sarabun", "Tahoma", "Leelawadee UI", "Segoe UI", sans-serif;
  font-size: 15px;
}

.app {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}

.app-header {
  background: linear-gradient(135deg, var(--sidebar-bg-top), var(--sidebar-bg-bottom));
  color: #fff;
  padding: 14px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
}
.shop-title { display: flex; align-items: center; gap: 12px; }
.shop-title h1 { font-size: 20px; margin: 0; font-weight: 700; }
.badge {
  background: rgba(255,255,255,0.2);
  border: 1px solid rgba(255,255,255,0.4);
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
}
.header-actions { display: flex; gap: 8px; }

.tabs {
  display: flex;
  background: #fff;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  flex-wrap: wrap;
}
.tab-btn {
  background: transparent;
  border: none;
  padding: 12px 18px;
  cursor: pointer;
  font-size: 15px;
  color: var(--text-muted);
  border-bottom: 3px solid transparent;
  white-space: nowrap;
  font-family: inherit;
}
.tab-btn:hover { color: var(--primary-dark); background: var(--primary-light); }
.tab-btn.active { color: var(--primary-dark); border-bottom-color: var(--primary); font-weight: 700; }
.tab-badge {
  display: inline-block;
  margin-left: 6px;
  background: var(--danger);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  padding: 3px 6px;
  border-radius: 999px;
  vertical-align: middle;
}

.tab-content-wrap { flex: 1; min-width: 0; }
.tab-section { padding: 0; }
.section-inner { padding: 18px 22px; max-width: 1400px; margin: 0 auto; }

.toolbar {
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.toolbar input[type="text"],
.toolbar input[type="date"],
.toolbar input[type="number"],
.toolbar select {
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-family: inherit;
  font-size: 14px;
}
.chk-label { display: inline-flex; align-items: center; gap: 4px; color: var(--text-muted); font-size: 14px; }

.date-input-wrap { position: relative; display: inline-block; vertical-align: middle; }
.date-native-input { color: transparent; }
.date-native-input::-webkit-datetime-edit { color: transparent; }
.date-display-overlay {
  position: absolute;
  inset: 0;
  right: 24px;
  display: flex;
  align-items: center;
  padding-left: 10px;
  pointer-events: none;
  color: var(--text);
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
}
.form-row .date-input-wrap { flex: 1; min-width: 0; display: block; }
.form-row .date-native-input { width: 100%; }
.form-row .date-display-overlay { padding-left: 9px; }

.btn {
  background: #fff;
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 14px;
  font-family: inherit;
  transition: background 0.15s;
}
.btn:hover { background: var(--primary-light); }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-dark); }
.btn-danger { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn-success { background: var(--success); color: #fff; border-color: var(--success); }
.btn-success:hover { background: #24714a; }
.btn-info { background: #2a7f9e; color: #fff; border-color: #2a7f9e; }
.btn-info:hover { background: #1f6379; }
.btn-accent { background: #6c4fa1; color: #fff; border-color: #6c4fa1; }
.btn-accent:hover { background: #563d82; }
.btn-warning { background: #c9822b; color: #fff; border-color: #c9822b; }
.btn-warning:hover { background: #a86a1f; }
.btn-ghost { background: transparent; color: #fff; border-color: rgba(255,255,255,0.5); }
.btn-ghost:hover { background: rgba(255,255,255,0.15); }
.btn-sm { padding: 4px 8px; font-size: 12px; margin-right: 4px; }
.btn-block { width: 100%; padding: 12px; font-size: 16px; margin-top: 6px; }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.stat-card {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.stat-title { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
.stat-value { font-size: 22px; font-weight: 700; color: var(--primary-dark); }
.stat-sub { color: var(--text-muted); font-size: 12px; margin-top: 4px; }

.dash-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
@media (max-width: 900px) {
  .dash-grid { grid-template-columns: 1fr; }
}

.panel {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}
.panel h3 { margin-top: 0; font-size: 16px; color: var(--primary-dark); }
.panel h4 { font-size: 14px; color: var(--text-muted); margin: 12px 0 6px; }

.table-container { overflow-x: auto; }
.data-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  background: var(--panel-bg);
  font-size: 13.5px;
}
.data-table th {
  background: var(--primary-light);
  color: var(--primary-dark);
  text-align: left;
  padding: 9px 10px;
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
}
.data-table td {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  white-space: normal;
  word-break: break-word;
  max-width: 260px;
  vertical-align: top;
}
.data-table tbody tr:hover { background: #faf7fc; }
.data-table td.empty { text-align: center; color: var(--text-muted); padding: 20px; }
.data-table td.actions-cell {
  white-space: nowrap;
  max-width: none;
}
.discount-input-row {
  display: flex;
  gap: 6px;
  align-items: center;
}
.discount-input-row input[type="number"] {
  flex: 1;
  min-width: 0;
}
.discount-input-row select {
  flex: 0 0 auto;
  width: 70px;
}
.pos-grid {
  display: grid;
  grid-template-columns: 1.4fr 1fr;
  gap: 16px;
  padding: 18px 22px;
  max-width: 1500px;
  margin: 0 auto;
  align-items: start;
  min-width: 0;
}
@media (max-width: 1000px) {
  .pos-grid { grid-template-columns: 1fr; }
}
.pos-left, .pos-right {
  background: var(--panel-bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  min-width: 0; /* กันไม่ให้ตารางรายการสินค้าด้านในดันความกว้างของทั้งกล่อง/หน้าเว็บให้ล้นออกไปจนต้องเลื่อนทั้งหน้า */
}
.pos-right h3 { margin-top: 0; }

<noscript>โปรแกรมนี้ต้องเปิดใช้งาน JavaScript ในเบราว์เซอร์ กรุณาเปิดใช้งานแล้วโหลดหน้านี้ใหม่</noscript>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrious/4.0.2/qrious.min.js"></script>
<script>
// ===== การเชื่อมต่อคลาวด์ (Supabase) =====
// โปรเจกต์: siricharoen-fabric-shop (เฉพาะไฟล์ "ไม่มี VAT" นี้เท่านั้น)
window.__SUPABASE_URL__ = "https://hpygvqhajpvhseamdfdc.supabase.co";
window.__SUPABASE_ANON_KEY__ = "sb_publishable_jVV5H3D5A94bE7X6pIwtvw_hP6v_NHR";
</script>
<script>

/*
 core.js - ชั้นข้อมูล (data layer) สำหรับโปรแกรมร้านผ้าศิริเจริญ เวอร์ชันเว็บ
 เก็บข้อมูลทั้งหมดใน localStorage ของเบราว์เซอร์ (คีย์กำหนดผ่าน STORAGE_KEY) และซิงค์ขึ้นคลาวด์ (Supabase)
 ไม่พึ่งพา framework ใดๆ ทำงานได้แม้เปิดไฟล์ HTML โดยตรง (file://) ใน Chrome
*/

const __supabaseClient__ =
  typeof window !== "undefined" && window.supabase && window.__SUPABASE_URL__
    ? window.supabase.createClient(window.__SUPABASE_URL__, window.__SUPABASE_ANON_KEY__)
    : null;
if (typeof window !== "undefined") window.__supabaseClient__ = __supabaseClient__;

function createDB(storageKey) {
  const STORAGE_KEY = storageKey;
  const CLOUD_TABLE = "app_store";
  let cloudPushTimer = null;
  let cloudSyncListener = null;
  let cloudStatus = __supabaseClient__ ? "connecting" : "offline";
  // true ถ้ามีการบันทึกข้อมูลในเครื่องที่ยังไม่ถูกอัปโหลดขึ้นคลาวด์สำเร็จ
  // ใช้กันปัญหาข้อมูลหาย: ถ้าผู้ใช้บันทึกข้อมูล (เช่น ขายสินค้า) ทันทีตอนเพิ่งเปิดหน้า
  // ก่อนที่การดึงข้อมูลคลาวด์ครั้งแรกจะเสร็จ ห้ามให้ pullFromCloud เอาข้อมูลเก่าจากคลาวด์มาทับ
  let hasUnsavedLocalChange = false;
  let cloudBootstrapped = false; // true หลังจากลองดึงข้อมูลจากคลาวด์ครั้งแรกแล้ว (ไม่ว่าจะสำเร็จหรือไม่) ก่อนหน้านี้ห้ามอัปโหลดขึ้นคลาวด์เด็ดขาด

  function setCloudSyncListener(fn) {
    cloudSyncListener = fn;
  }

  function getCloudStatus() {
    return cloudStatus;
  }

  function scheduleCloudPush() {
    if (!__supabaseClient__) return;
    if (!cloudBootstrapped) return; // ห้ามอัปโหลดขึ้นคลาวด์ก่อนจะดึงข้อมูลคลาวด์มาเช็คก่อนอย่างน้อย 1 ครั้ง (กันข้อมูลว่าง/ข้อมูลตัวอย่างทับของจริง)
    if (cloudPushTimer) clearTimeout(cloudPushTimer);
    cloudPushTimer = setTimeout(pushToCloud, 800);
  }

  async function pushToCloud() {
    if (!__supabaseClient__) return;
    try {
      const { error } = await __supabaseClient__
        .from(CLOUD_TABLE)
        .upsert({ id: STORAGE_KEY, data: store, updated_at: new Date().toISOString() });
      if (error) {
        cloudStatus = "error";
        console.error("อัปโหลดข้อมูลขึ้นคลาวด์ผิดพลาด", error);
      } else {
        cloudStatus = "synced";
        hasUnsavedLocalChange = false;
      }
    } catch (e) {
      cloudStatus = "error";
      console.error("อัปโหลดข้อมูลขึ้นคลาวด์ผิดพลาด", e);
    }
  }

  // เช็คว่าข้อมูลที่จะดึงจากคลาวด์มาทับเครื่องนี้ดู "หายไปผิดปกติ" หรือไม่ เทียบกับข้อมูลที่เครื่องนี้มีอยู่แล้ว
  // ป้องกันกรณีคลาวด์มีข้อมูลว่าง/น้อยผิดปกติ (เช่น อัปโหลดข้อมูลตัวอย่างทับของจริงไปโดยไม่ตั้งใจ) ไม่ให้มาทับข้อมูลจริงในเครื่อง
  function looksLikeDataLoss(incoming) {
    const keysToCheck = ["customers", "suppliers", "fabrics", "sales", "purchases", "bankAccounts"];
    for (const key of keysToCheck) {
      const localLen = (store[key] || []).length;
      const inLen = (incoming[key] || []).length;
      if (localLen > 5 && inLen === 0) return true;
      if (localLen > 20 && inLen < localLen * 0.3) return true;
    }
    return false;
  }

  async function pullFromCloud() {
    if (!__supabaseClient__) {
      cloudBootstrapped = true;
      return;
    }
    try {
      const { data: row, error } = await __supabaseClient__
        .from(CLOUD_TABLE)
        .select("data, updated_at")
        .eq("id", STORAGE_KEY)
        .maybeSingle();
      if (error) {
        cloudStatus = "error";
        console.error("โหลดข้อมูลจากคลาวด์ผิดพลาด", error);
        return;
      }
      if (row && row.data) {
        if (looksLikeDataLoss(row.data)) {
          // ข้อมูลบนคลาวด์ดูน้อยผิดปกติเทียบกับเครื่องนี้ -> ไม่ทับ ถือว่าเครื่องนี้ถูกต้องกว่า แล้วอัปโหลดข้อมูลเครื่องนี้ขึ้นไปแทนเพื่อกู้คืนคลาวด์
          console.warn("ข้อมูลบนคลาวด์น้อยผิดปกติเทียบกับเครื่องนี้ ข้ามการดึงข้อมูลมาทับ และอัปโหลดข้อมูลเครื่องนี้ขึ้นไปแทน");
          await pushToCloud();
          // pushToCloud() จะตั้งสถานะเป็น "synced" ถ้าสำเร็จ แต่กรณีนี้อยากให้ผู้ใช้เห็นชัดๆ ว่ามีการตรวจพบความผิดปกติและกู้คืนให้แล้ว
          // จึงคงสถานะเป็น "conflict" ไว้ (เว้นแต่การอัปโหลดกู้คืนจะล้มเหลว ซึ่งสถานะ "error" สำคัญกว่าต้องแสดงแทน)
          if (cloudStatus !== "error") cloudStatus = "conflict";
        } else if (hasUnsavedLocalChange) {
          // มีการบันทึกข้อมูลในเครื่องนี้ (เช่น ขายสินค้า) ระหว่างที่กำลังดึงข้อมูลจากคลาวด์ครั้งแรกอยู่
          // ถือว่าข้อมูลในเครื่องใหม่กว่าข้อมูลที่เพิ่งดึงมา ไม่ทับข้อมูลเครื่อง แต่อัปโหลดข้อมูลเครื่องขึ้นคลาวด์แทนเพื่อกันข้อมูลหาย
          cloudStatus = "synced";
          console.warn("มีการบันทึกข้อมูลในเครื่องระหว่างดึงข้อมูลคลาวด์ ข้ามการทับข้อมูล และอัปโหลดข้อมูลเครื่องขึ้นไปแทน");
          await pushToCloud();
        } else {
          Object.keys(store).forEach((k) => delete store[k]);
          Object.assign(store, row.data);
          if (!store.shopInfo) store.shopInfo = emptyStore().shopInfo;
          if (!store.backorders) store.backorders = [];
          if (!store.bankAccounts) store.bankAccounts = [];
          if (!store.accountMovements) store.accountMovements = [];
          if (!store.customerOrders) store.customerOrders = [];
          if (!store.expenseCategories) store.expenseCategories = [];
          if (!store.quotations) store.quotations = [];
          if (!store.billingNotes) store.billingNotes = [];
          
          
          if (!store.nextId) store.nextId = {};
          if (!store.nextId.backorder) store.nextId.backorder = store.backorders.length + 1;
          if (!store.nextId.bankAccount) store.nextId.bankAccount = store.bankAccounts.length + 1;
          if (!store.nextId.customerOrder) store.nextId.customerOrder = store.customerOrders.length + 1;
          if (!store.nextId.expenseCategory) store.nextId.expenseCategory = store.expenseCategories.length + 1;
          if (!store.nextId.quotation) store.nextId.quotation = store.quotations.length + 1;
          if (!store.nextId.billingNote) store.nextId.billingNote = store.billingNotes.length + 1;
          
          
          migrateCodes(store);
          if (!store.rolls) store.rolls = [];
          if (!store.nextId.roll) store.nextId.roll = 1;
          migrateFabricsToRolls(store);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
          cloudStatus = "synced";
          if (cloudSyncListener) cloudSyncListener();
        }
      } else {
        // ยังไม่มีข้อมูลบนคลาวด์ (ครั้งแรก) -> อัปโหลดข้อมูลปัจจุบันขึ้นไปตั้งต้น
        cloudStatus = "synced";
        cloudBootstrapped = true;
        await pushToCloud();
      }
    } catch (e) {
      cloudStatus = "error";
      console.error("โหลดข้อมูลจากคลาวด์ผิดพลาด", e);
    } finally {
      cloudBootstrapped = true;
    }
  }

  function emptyStore() {
    return {
      nextId: { supplier: 1, customer: 1, fabric: 1, sale: 1, purchase: 1, expense: 1, backorder: 1, bankAccount: 1, customerOrder: 1, expenseCategory: 1, quotation: 1, return: 1, billingNote: 1, roll: 1 },
      shopInfo: { name: "ร้านผ้าศิริเจริญ", address: "", phone: "", tax_id: "" },
      suppliers: [],
      customers: [],
      fabrics: [],
      sales: [],
      purchases: [],
      customerPayments: [],
      supplierPayments: [],
      expenses: [],
      expenseCategories: [],
      stockMovements: [],
      backorders: [],
      bankAccounts: [],
      accountMovements: [],
      customerOrders: [],
      quotations: [],
      returns: [],
      billingNotes: [],
      rolls: [],
      rollsMigrated: false,
      
    };
  }

  let store = load();

  function load() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const data = JSON.parse(raw);
        if (!data.shopInfo) data.shopInfo = emptyStore().shopInfo;
        if (!data.backorders) data.backorders = [];
        if (!data.bankAccounts) data.bankAccounts = [];
        if (!data.accountMovements) data.accountMovements = [];
        if (!data.customerOrders) data.customerOrders = [];
        if (!data.expenseCategories) data.expenseCategories = [];
        if (!data.quotations) data.quotations = [];
        if (!data.billingNotes) data.billingNotes = [];
        
        
        if (!data.nextId) data.nextId = {};
        if (!data.nextId.backorder) data.nextId.backorder = data.backorders.length + 1;
        if (!data.nextId.bankAccount) data.nextId.bankAccount = data.bankAccounts.length + 1;
        if (!data.nextId.customerOrder) data.nextId.customerOrder = data.customerOrders.length + 1;
        if (!data.nextId.expenseCategory) data.nextId.expenseCategory = data.expenseCategories.length + 1;
        if (!data.nextId.quotation) data.nextId.quotation = data.quotations.length + 1;
        if (!data.nextId.billingNote) data.nextId.billingNote = data.billingNotes.length + 1;
        
        
        migrateCodes(data);
        if (!data.rolls) data.rolls = [];
        if (!data.nextId.roll) data.nextId.roll = 1;
        migrateFabricsToRolls(data);
        return data;
      }
    } catch (e) {
      console.error("โหลดข้อมูลผิดพลาด", e);
    }
    return emptyStore();
  }

  // เติมรหัสลูกค้า/รหัสผู้จัดจำหน่ายให้ข้อมูลเก่าที่ยังไม่มีรหัส (สร้างจากไฟล์เวอร์ชันก่อนหน้า)
  function migrateCodes(data) {
    let changed = false;
    (data.customers || []).forEach((c, idx) => {
      if (!c.code) {
        c.code = "CU" + pad(idx + 1, 5);
        changed = true;
      }
    });
    (data.suppliers || []).forEach((s, idx) => {
      if (!s.code) {
        s.code = "SU" + pad(idx + 1, 5);
        changed = true;
      }
    });
    if (changed) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }
  }

  function getShopInfo() {
    return store.shopInfo;
  }
  function updateShopInfo(data) {
    Object.assign(store.shopInfo, data);
    save();
  }

  function save() {
    hasUnsavedLocalChange = true;
    localStorage.setItem(STORAGE_KEY, JSON.stringify(store));
    scheduleCloudPush();
  }

  function genId(type) {
    const id = store.nextId[type]++;
    save();
    return id;
  }

  // -------------------------------------------------------- bank accounts
  // สร้าง "บัญชีเงินสด" อัตโนมัติถ้ายังไม่มี (มีได้บัญชีเดียว แยกจากบัญชีธนาคาร)
  function ensureCashAccount() {
    if (!store.bankAccounts) store.bankAccounts = [];
    let cash = store.bankAccounts.find((a) => a.is_cash);
    if (!cash) {
      cash = {
        id: genIdSimple("bankAccount"),
        bank_name: "เงินสด",
        account_name: "บัญชีเงินสด",
        account_no: "",
        is_cash: true,
        balance: 0,
      };
      store.bankAccounts.push(cash);
      save();
    }
    return cash;
  }
  // เหมือน genId แต่ไม่ save() ซ้ำ (ใช้ตอนสร้างภายในฟังก์ชันที่จะ save() เองอยู่แล้ว)
  function genIdSimple(type) {
    return store.nextId[type]++;
  }
  function getBankAccounts() {
    ensureCashAccount();
    return [...store.bankAccounts].sort((a, b) => (a.is_cash ? -1 : b.is_cash ? 1 : a.id - b.id));
  }
  function getBankAccount(id) {
    return store.bankAccounts.find((a) => a.id === id) || null;
  }
  function getCashAccount() {
    return ensureCashAccount();
  }
  function createBankAccount(data) {
    const acct = {
      id: genId("bankAccount"),
      bank_name: (data.bank_name || "").trim(),
      account_name: (data.account_name || "").trim(),
      account_no: (data.account_no || "").trim(),
      is_cash: false,
      balance: 0,
    };
    store.bankAccounts.push(acct);
    save();
    return acct;
  }
  function updateBankAccount(id, data) {
    const acct = getBankAccount(id);
    if (!acct || acct.is_cash) return null;
    acct.bank_name = (data.bank_name || "").trim();
    acct.account_name = (data.account_name || "").trim();
    acct.account_no = (data.account_no || "").trim();
    save();
    return acct;
  }
  function deleteBankAccount(id) {
    const acct = getBankAccount(id);
    if (!acct) return false;
    if (acct.is_cash) return false; // ห้ามลบบัญชีเงินสด
    const idx = store.bankAccounts.findIndex((a) => a.id === id);
    if (idx === -1) return false;
    store.bankAccounts.splice(idx, 1);
    save();
    return true;
  }
  // ปรับยอดบัญชีตรงๆ (ปรับปรุงยอดเริ่มต้น/แก้ไขผิดพลาด) พร้อมบันทึกรายการเคลื่อนไหว
  function adjustBankAccountBalance(id, newBalance, note) {
    const acct = getBankAccount(id);
    if (!acct) return null;
    const delta = newBalance - (acct.balance || 0);
    if (delta !== 0) recordAccountMovement(id, delta, "adjust", null, note || "ปรับปรุงยอดบัญชี");
    return acct;
  }
    // โยกเงินจากบัญชีหนึ่งไปอีกบัญชีหนึ่ง (เช่น เงินสด -> ธนาคาร หรือระหว่างบัญชีธนาคาร)
  function transferBetweenAccounts(fromId, toId, amount, note) {
    const from = getBankAccount(fromId);
    const to = getBankAccount(toId);
    const amt = Number(amount) || 0;
    if (!from || !to || fromId === toId || amt <= 0) return null;
    const fromLabel = from.is_cash ? "เงินสด" : `${from.bank_name} - ${from.account_name}`;
    const toLabel = to.is_cash ? "เงินสด" : `${to.bank_name} - ${to.account_name}`;
    const transferRef = "TR" + Date.now();
    const noteSuffix = note ? ` (${note})` : "";
    recordAccountMovement(fromId, -amt, "transfer_out", transferRef, `โยกเงินไป ${toLabel}${noteSuffix}`);
    recordAccountMovement(toId, amt, "transfer_in", transferRef, `รับโอนจาก ${fromLabel}${noteSuffix}`);
    return transferRef;
  }
  function recordAccountMovement(accountId, delta, refType, refId, note) {
    if (!accountId || !delta) return;
    const acct = getBankAccount(accountId);
    if (!acct) return;
    acct.balance = (acct.balance || 0) + delta;
    store.accountMovements.push({
      id: store.accountMovements.length + 1,
      account_id: accountId,
      date: nowStr(),
      amount: delta,
      ref_type: refType || "",
      ref_id: refId || null,
      note: note || "",
    });
    save();
  }
  function getAccountMovements(accountId, start, end) {
    let rows = store.accountMovements.filter((m) => m.account_id === accountId);
    if (start || end) rows = rows.filter((m) => inRange(m.date, start, end));
    return [...rows].sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : b.id - a.id));
  }
  // ปรับยอดบัญชีที่ผูกกับบิลขาย/ใบสั่งซื้อให้ตรงกับสถานะล่าสุดเสมอ โดยย้อนผลเดิมก่อนแล้วค่อยใส่ผลใหม่
  // (ใช้ได้ทั้งตอนสร้างใหม่ [oldAccountId ไม่มี], แก้ไข, และลบ [newAccountId/newAmount เป็น null/0])
  function normalizeSplits(splits) {
    return (splits || []).filter((s) => s && s.account_id && s.amount > 0).map((s) => ({ account_id: s.account_id, amount: s.amount }));
  }
  function syncSaleAccountBalance(sale, newSplits) {
    const oldSplits = sale.account_splits || [];
    oldSplits.forEach((s) => {
      recordAccountMovement(s.account_id, -s.amount, "sale", sale.id, `ย้อนกลับยอดขายบิล ${sale.sale_no}`);
    });
    const splits = normalizeSplits(newSplits);
    splits.forEach((s) => {
      recordAccountMovement(s.account_id, s.amount, "sale", sale.id, `รับชำระยอดขายบิล ${sale.sale_no}`);
    });
    sale.account_splits = splits;
  }
  function syncPurchaseAccountBalance(purchase, newSplits) {
    const oldSplits = purchase.account_splits || [];
    oldSplits.forEach((s) => {
      recordAccountMovement(s.account_id, s.amount, "purchase", purchase.id, `ย้อนกลับยอดจ่าย PO ${purchase.po_no}`);
    });
    const splits = normalizeSplits(newSplits);
    splits.forEach((s) => {
      recordAccountMovement(s.account_id, -s.amount, "purchase", purchase.id, `จ่ายเงินตาม PO ${purchase.po_no}`);
    });
    purchase.account_splits = splits;
  }
  function describeSplits(splits) {
    const list = normalizeSplits(splits);
    if (list.length === 0) return { bank_name: "", bank_account_name: "" };
    const parts = list.map((s) => {
      const acct = getBankAccount(s.account_id);
      if (!acct) return "";
      const label = acct.is_cash ? "เงินสด" : `${acct.bank_name} - ${acct.account_name}`;
      return `${label} (${s.amount})`;
    }).filter(Boolean);
    return { bank_name: parts.join(", "), bank_account_name: "" };
  }

  function pad(n, w) {
    return String(n).padStart(w, "0");
  }

  function todayStr() {
    const d = new Date();
    return `${d.getFullYear()}-${pad(d.getMonth() + 1, 2)}-${pad(d.getDate(), 2)}`;
  }

  function nowStr() {
    const d = new Date();
    return `${todayStr()} ${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}:${pad(d.getSeconds(), 2)}`;
  }

  function monthStartStr() {
    return todayStr().slice(0, 8) + "01";
  }

  function inRange(dateStr, start, end) {
    const d = dateStr.slice(0, 10);
    if (start && d < start) return false;
    if (end && d > end) return false;
    return true;
  }

  function getFabrics(search, opts) {

    if (search) {
      const q = search.toLowerCase();
      rows = rows.filter(
        (f) =>
          f.name.toLowerCase().includes(q) ||
          f.code.toLowerCase().includes(q) ||
          (f.color || "").toLowerCase().includes(q) ||

    if (opts.onlyLowStock) rows = rows.filter((f) => f.stock_qty <= f.reorder_point);

  function getFabric(id) {

  }
  function adjustStock(fabricId, delta, note) {
    const f = getFabric(fabricId);
    if (!f) return;
    f.stock_qty += delta;
    store.stockMovements.push({
      id: store.stockMovements.length + 1,
      fabric_id: fabricId,
      date: nowStr(),
      move_type: delta >= 0 ? "ปรับปรุง" : "ปรับปรุง(ลด)",
      qty: delta,
      ref_type: "adjust",
      ref_id: fabricId,
      note: note || "ปรับสต็อก",
    });
    save();
  }
    function migrateFabricsToRolls(data) {
    if (data.rollsMigrated) return;
    if (!data.rolls) data.rolls = [];
    const existingFabricIds = new Set(data.rolls.map((r) => r.fabric_id));
    (data.fabrics || []).forEach((f) => {
      if (f.active && !existingFabricIds.has(f.id)) {
        data.rolls.push({ id: data.nextId.roll++, fabric_id: f.id, roll_no: 1, qty: f.stock_qty || 0, active: true });
      }
    });
    data.rollsMigrated = true;
  }
  function nextRollNo(fabricId) {
    const rolls = store.rolls.filter((r) => r.fabric_id === fabricId);
    if (!rolls.length) return 1;
    return Math.max(...rolls.map((r) => r.roll_no)) + 1;
  }
  function addRoll(fabricId, qty, note) {
    const f = getFabric(fabricId);
    if (!f) return null;
    const roll = { id: genId("roll"), fabric_id: fabricId, roll_no: nextRollNo(fabricId), qty: Number(qty) || 0, active: true };
    store.rolls.push(roll);
    f.stock_qty += roll.qty;
    store.stockMovements.push({ id: store.stockMovements.length + 1, fabric_id: fabricId, date: nowStr(), move_type: `รับเข้า (ม้วนที่ ${roll.roll_no})`, qty: roll.qty, ref_type: "roll", ref_id: roll.id, note: note || "" });
    save();
    return roll;
  }
  function getRollsByFabric(fabricId) {
    return store.rolls.filter((r) => r.fabric_id === fabricId).sort((a, b) => a.roll_no - b.roll_no);
  }
  function getActiveRollsByFabric(fabricId) {
    return getRollsByFabric(fabricId).filter((r) => r.active && r.qty > 0);
  }
  function getRoll(id) {
    return store.rolls.find((r) => r.id === id) || null;
  }
  function adjustRollQty(rollId, delta, note) {
    const r = getRoll(rollId);
    if (!r) return;
    r.qty += delta;
    if (delta < 0 && r.qty <= 0) r.active = false;
    else if (delta > 0 && !r.active) r.active = true;
    const f = getFabric(r.fabric_id);
    if (f) f.stock_qty += delta;
    store.stockMovements.push({ id: store.stockMovements.length + 1, fabric_id: r.fabric_id, date: nowStr(), move_type: delta >= 0 ? `คืนม้วน (ม้วนที่ ${r.roll_no})` : `ตัดขาย (ม้วนที่ ${r.roll_no})`, qty: delta, ref_type: "roll", ref_id: r.id, note: note || "" });
    save();
  }

      .filter((m) => m.fabric_id === fabricId)
      .sort((a, b) => (a.date < b.date ? 1 : -1));
  }
  function deleteStockMovement(movementId) {
    const idx = store.stockMovements.findIndex((x) => x.id === movementId);
    if (idx === -1) return false;
    const m = store.stockMovements[idx];
    const f = getFabric(m.fabric_id);
    if (f) {
      f.stock_qty = Math.round((f.stock_qty - m.qty) * 100) / 100;
    }
    store.stockMovements.splice(idx, 1);
    save();
    return true;
  }

  // ---------------------------------------------------------------- sales
  function genSaleNo() {
    const d = todayStr().replace(/-/g, "");
    const n = store.sales.filter((s) => s.sale_no.startsWith("S" + d)).length;
    return "S" + d + pad(n + 1, 3);
  }
  function buildSaleItems(items) {
    return items.map((it) => ({
      fabric_id: it.fabric_id || null,
      is_misc: !!it.is_misc,
      name: it.name || "",
      code: it.code || "",
      cost_price: Number(it.cost_price) || 0,
      qty: it.qty,
      unit_price: it.unit_price,
      unit: it.unit || "",
      stock_qty: it.stock_qty !== undefined && it.stock_qty !== null ? it.stock_qty : it.qty,
      subtotal: it.qty * it.unit_price,
      roll_id: it.roll_id || null,
      note: it.note || "",
      }));
  }
  function applySaleEffects(sale) {
    for (const it of sale.items) {
      if (it.is_misc) continue;
      const f = getFabric(it.fabric_id);
      if (f) f.stock_qty -= it.stock_qty;
      if (it.roll_id) {
        const r = getRoll(it.roll_id);
        if (r) {
          r.qty -= it.stock_qty;
          if (r.qty <= 0) r.active = false;
        }
      }
      store.stockMovements.push({
        id: store.stockMovements.length + 1,
        fabric_id: it.fabric_id,
        date: nowStr(),
        move_type: "ขายออก",
        qty: -it.stock_qty,
        ref_type: "sale",
        ref_id: sale.id,
        note: sale.sale_no,
      });
    }
    if (sale.payment_method === "เงินเชื่อ" && sale.customer_id) {
      const owe = sale.total - sale.paid;
      if (owe > 0) {
        const c = getCustomer(sale.customer_id);
        if (c) c.credit_balance += owe;
      }
    }
  }
  function revertSaleEffects(sale) {
    for (const it of sale.items) {
      if (it.is_misc) continue;
      const f = getFabric(it.fabric_id);
      if (f) f.stock_qty += it.stock_qty;
      if (it.roll_id) {
        const r = getRoll(it.roll_id);
        if (r) {
          r.qty += it.stock_qty;
          if (r.qty > 0) r.active = true;
        }
      }
      store.stockMovements.push({
        id: store.stockMovements.length + 1,
        fabric_id: it.fabric_id,
        date: nowStr(),
        move_type: "คืนสต็อก (แก้ไข/ยกเลิกบิล)",
        qty: it.stock_qty,
        ref_type: "sale",
        ref_id: sale.id,
        note: sale.sale_no,
      });
    }
    if (sale.payment_method === "เงินเชื่อ" && sale.customer_id) {
      const owe = sale.total - sale.paid;
      if (owe > 0) {
        const c = getCustomer(sale.customer_id);
        if (c) c.credit_balance -= owe;
      }
    }
  }
  function createSale(items, customerId, discount, vatAmount, paymentMethod, paid, note, date, accountSplits, shippingFee, shippingMethod, dueDate, isVat) {
    const subtotal = items.reduce((sum, it) => sum + it.qty * it.unit_price, 0);
    const shipFee = shippingFee || 0;
    const total = subtotal - discount + vatAmount + shipFee;
    const changeAmt = paymentMethod !== "เงินเชื่อ" ? Math.max(0, paid - total) : 0;
    let status = "ชำระแล้ว";
    if (paymentMethod === "เงินเชื่อ" && paid < total) {
      status = paid === 0 ? "ค้างชำระ" : "ชำระบางส่วน";
    } else if (paymentMethod === "เงินสดแต่ยังไม่จ่าย") {
      status = "เงินสดแต่ค้างชำระ";
    }
    const paidMethod = status === "ชำระแล้ว" && (paymentMethod === "เงินสด" || paymentMethod === "โอนเงิน") ? paymentMethod : null;
    let effectiveSplits = [];
    if (paymentMethod === "เงินสด" && paid > 0) {
      effectiveSplits = [{ account_id: getCashAccount().id, amount: paid }];
    } else if (paymentMethod === "โอนเงิน" && paid > 0) {
      effectiveSplits = normalizeSplits(accountSplits);
    }
    const desc = describeSplits(effectiveSplits);
    const sale = {
      id: genId("sale"),
      sale_no: genSaleNo(),
      date: date || nowStr(),
      customer_id: customerId || null,
      items: buildSaleItems(items),
      subtotal,
      discount,
      vat_amount: vatAmount,
      shipping_fee: shipFee,
      shipping_method: shippingMethod || "",
      due_date: dueDate || "",
      total,
      paid,
      change_amt: changeAmt,
      payment_method: paymentMethod,
      paid_method: paidMethod,
      status,
      note: note || "",
      bank_name: paymentMethod === "โอนเงิน" ? desc.bank_name : "",
      bank_account_name: paymentMethod === "โอนเงิน" ? desc.bank_account_name : "",
      is_vat: !!isVat,
      account_splits: [],
    };
    store.sales.push(sale);
    applySaleEffects(sale);
    syncSaleAccountBalance(sale, effectiveSplits);
    save();
    return sale;
  }
  function updateSale(id, items, customerId, discount, vatAmount, paymentMethod, paid, note, date, accountSplits, shippingFee, shippingMethod, dueDate, isVat) {
    const sale = store.sales.find((x) => x.id === id);
    if (!sale) return null;
    revertSaleEffects(sale);

    const subtotal = items.reduce((sum, it) => sum + it.qty * it.unit_price, 0);
    const shipFee = shippingFee || 0;
    const total = subtotal - discount + vatAmount + shipFee;
    const changeAmt = paymentMethod !== "เงินเชื่อ" ? Math.max(0, paid - total) : 0;
    let status = "ชำระแล้ว";
    if (paymentMethod === "เงินเชื่อ" && paid < total) {
      status = paid === 0 ? "ค้างชำระ" : "ชำระบางส่วน";
    } else if (paymentMethod === "เงินสดแต่ยังไม่จ่าย") {
      status = "เงินสดแต่ค้างชำระ";
    }
    let effectiveSplits = null; // null = คงยอดที่เคยลงบัญชีไว้เดิม (ยังไม่แตะ)
    if (paymentMethod === "เงินสด" && paid > 0) {
      effectiveSplits = [{ account_id: getCashAccount().id, amount: paid }];
    } else if (paymentMethod === "โอนเงิน" && paid > 0) {
      effectiveSplits = normalizeSplits(accountSplits);
    } else if (status !== "ชำระแล้ว") {
      effectiveSplits = []; // ยังไม่ชำระ/ค้างชำระ -> ล้างยอดที่เคยลงบัญชี (ถ้ามี) เพราะยังไม่มีเงินเข้าจริง
    }
    const desc = describeSplits(effectiveSplits || sale.account_splits || []);

    sale.date = date || sale.date;
    sale.customer_id = customerId || null;
    sale.items = buildSaleItems(items);
    sale.subtotal = subtotal;
    sale.discount = discount;
    sale.vat_amount = vatAmount;
    sale.shipping_fee = shipFee;
    sale.shipping_method = shippingMethod || "";
    sale.due_date = dueDate !== undefined ? dueDate : sale.due_date || "";
    sale.total = total;
    sale.paid = paid;
    sale.change_amt = changeAmt;
    sale.payment_method = paymentMethod;
    if (status !== "ชำระแล้ว") {
      sale.paid_method = null;
    } else if (paymentMethod === "เงินสด" || paymentMethod === "โอนเงิน") {
      sale.paid_method = paymentMethod;
    }
    sale.status = status;
    sale.note = note || "";
    sale.bank_name = paymentMethod === "โอนเงิน" ? desc.bank_name : "";
    sale.bank_account_name = paymentMethod === "โอนเงิน" ? desc.bank_account_name : "";
    if (isVat !== undefined) sale.is_vat = !!isVat;

    applySaleEffects(sale);
    syncSaleAccountBalance(sale, effectiveSplits === null ? sale.account_splits || [] : effectiveSplits);
    save();
    return sale;
  }
  function deleteSale(id) {
    const idx = store.sales.findIndex((x) => x.id === id);
    if (idx === -1) return false;
    const sale = store.sales[idx];
    revertSaleEffects(sale);
    syncSaleAccountBalance(sale, []);
    store.sales.splice(idx, 1);
    save();
    return true;
  }
  function getSales(start, end, customerId) {
    let rows = store.sales;
    if (start || end) rows = rows.filter((s) => inRange(s.date, start, end));
    if (customerId) rows = rows.filter((s) => s.customer_id === customerId);
    return [...rows].sort((a, b) => (a.date < b.date ? 1 : -1));
  }
  function getSale(id) {
    return store.sales.find((x) => x.id === id) || null;
  }
  function markSalePaid(saleId, method, accountSplits) {
    const sale = store.sales.find((x) => x.id === saleId);
    if (!sale) return;
    const remain = sale.total - sale.paid;
    let newSplits = [];
    if (method === "โอนเงิน") {
      newSplits = normalizeSplits(accountSplits);
    } else if (method === "เงินสด") {
      newSplits = remain > 0 ? [{ account_id: getCashAccount().id, amount: remain }] : [];
    }
    const desc = describeSplits(newSplits);
    if (remain > 0 && sale.payment_method === "เงินเชื่อ" && sale.customer_id) {
      const c = getCustomer(sale.customer_id);
      if (c) {
        store.customerPayments.push({
          id: store.customerPayments.length + 1,
          customer_id: sale.customer_id,
          date: nowStr(),
          amount: remain,
          method: method || "เงินสด",
          bank_name: desc.bank_name,
          bank_account_name: desc.bank_account_name,
          note: `ชำระตามบิล ${sale.sale_no}`,
        });
        c.credit_balance -= remain;
      }
    }
    sale.paid = sale.total;
    sale.change_amt = 0;
    sale.status = "ชำระแล้ว";
    sale.paid_method = method || "เงินสด";
    if (sale.paid_method === "โอนเงิน") {
      sale.bank_name = desc.bank_name || sale.bank_name || "";
      sale.bank_account_name = desc.bank_account_name || sale.bank_account_name || "";
    }
    if (remain > 0) {
      syncSaleAccountBalance(sale, (sale.account_splits || []).concat(newSplits));
    }
    save();
  }

  // ------------------------------------------------------------ product returns (รับคืนสินค้า ผูกกับบิลขายเดิม)
  function getReturnedQtyForItem(saleId, fabricId) {
    return store.returns
      .filter((r) => r.sale_id === saleId)
      .reduce((sum, r) => sum + r.items.filter((it) => it.fabric_id === fabricId).reduce((s, it) => s + it.qty, 0), 0);
  }
  function getSaleReturns(saleId) {
    return store.returns.filter((r) => r.sale_id === saleId).sort((a, b) => (a.date < b.date ? 1 : -1));
  }
  function getReturns() {
    return [...store.returns].sort((a, b) => (a.date < b.date ? 1 : -1));
  }
  // ลบรายการคืนสินค้าออกจากระบบ (ใช้สำหรับล้างข้อมูลผิดพลาด/ทดสอบเท่านั้น ไม่ย้อนผลกระทบต่อสต็อค/ยอดบิล)
  function deleteReturn(returnId) {
    const idx = store.returns.findIndex((r) => r.id === returnId);
    if (idx === -1) return false;
    store.returns.splice(idx, 1);
    save();
    return true;
  }
  function addProductReturn(saleId, returnItems, method, accountId, note, exchangeItems, extraAccountId) {
    const sale = store.sales.find((x) => x.id === saleId);
    if (!sale) return null;
    const validItems = [];
    let subtotal = 0;
    for (const ri of returnItems || []) {
      const qtyWanted = Number(ri.qty) || 0;
      if (qtyWanted <= 0) continue;
      const saleItem = sale.items.find((it) => !it.is_misc && it.fabric_id === ri.fabric_id);
      if (!saleItem) continue;
      const alreadyReturned = getReturnedQtyForItem(saleId, ri.fabric_id);
      const maxReturnable = saleItem.qty - alreadyReturned;
      const qty = Math.min(qtyWanted, maxReturnable);
      if (qty <= 0) continue;
      const lineSubtotal = Math.round(qty * saleItem.unit_price * 100) / 100;
      subtotal += lineSubtotal;
      const f = getFabric(ri.fabric_id);
      validItems.push({ fabric_id: ri.fabric_id, code: saleItem.code || (f ? f.code : "") || "", name: saleItem.name || (f ? f.name : "") || "", qty, unit: saleItem.unit, unit_price: saleItem.unit_price, subtotal: lineSubtotal });
    }
    if (validItems.length === 0) return null;
    subtotal = Math.round(subtotal * 100) / 100;
    const ratio = sale.subtotal > 0 ? subtotal / sale.subtotal : 0;
    const discountPortion = Math.round(sale.discount * ratio * 100) / 100;
    const vatPortion = Math.round(sale.vat_amount * ratio * 100) / 100;
    const amount = Math.round((subtotal - discountPortion + vatPortion) * 100) / 100;
    const ret = { id: genId("return"), date: nowStr(), sale_id: saleId, sale_no: sale.sale_no, customer_id: sale.customer_id, items: validItems, subtotal, discount_portion: discountPortion, vat_portion: vatPortion, amount, method, account_id: method === "คืนเงินสด" ? accountId || null : null, note: note || "", exchange_items: [], exchange_diff: 0, extra_payment_amount: 0, extra_account_id: null };
    store.returns.push(ret);
    for (const it of validItems) {
      const f = getFabric(it.fabric_id);
      if (f) f.stock_qty = Math.round((f.stock_qty + it.qty) * 100) / 100;
      store.stockMovements.push({ id: store.stockMovements.length + 1, fabric_id: it.fabric_id, date: nowStr(), move_type: "รับคืนจากลูกค้า", qty: it.qty, ref_type: "return", ref_id: ret.id, note: `คืนจากบิล ${sale.sale_no}` });
    }
    const remainBeforeReturn = Math.max(0, Math.round((sale.total - sale.paid) * 100) / 100);
    sale.total = Math.round((sale.total - amount) * 100) / 100;
    const refundPortion = Math.max(0, Math.round((amount - remainBeforeReturn) * 100) / 100);
    if (method === "หักลดหนี้") {
      if (sale.payment_method === "เงินเชื่อ" && sale.customer_id) {
        const c = getCustomer(sale.customer_id);
        if (c) c.credit_balance = Math.round((c.credit_balance - amount) * 100) / 100;
      }
    } else if (method === "คืนเงินสด") {
      // คืนเงินสดจริงเฉพาะส่วนที่ลูกค้าจ่ายมาแล้ว (refundPortion) ส่วนที่ยังไม่ได้จ่าย แค่หักออกจากยอดค้างชำระ ไม่ต้องจ่ายเงินคืน
      sale.paid = Math.max(0, Math.round((sale.paid - refundPortion) * 100) / 100);
      if (accountId && refundPortion > 0) recordAccountMovement(accountId, -refundPortion, "return", ret.id, `คืนเงินสดให้ลูกค้า (บิล ${sale.sale_no})`);
    } else if (method === "เปลี่ยนของ") {
      // หักยอดที่ "จ่ายแล้ว" เฉพาะส่วนที่จ่ายมาแล้วจริง (refundPortion) เช่นเดียวกับคืนเงินสด
      sale.paid = Math.max(0, Math.round((sale.paid - refundPortion) * 100) / 100);
      // ถ้าลูกค้าเลือกผ้าใหม่ไปพร้อมกัน: ตัดสต็อคผ้าใหม่ทันที แล้วเทียบมูลค่ากับของที่คืน
      // ผ้าใหม่ถูกกว่า -> ส่วนต่างเก็บเป็นเครดิตแลกเปลี่ยนไว้ใช้ครั้งหน้า
      // ผ้าใหม่แพงกว่า -> รับชำระส่วนต่างทันทีเข้าบัญชีที่เลือก
      let exchangeSubtotal = 0;
      const validExchangeItems = [];
      for (const ei of exchangeItems || []) {
        const eqty = Number(ei.qty) || 0;
        if (eqty <= 0) continue;
        const ef = getFabric(ei.fabric_id);
        if (!ef) continue;
        const takeQty = Math.min(eqty, ef.stock_qty); // กันสต็อคติดลบ
        if (takeQty <= 0) continue;
        const eprice = Number(ei.unit_price) || 0;
        const esub = Math.round(takeQty * eprice * 100) / 100;
        exchangeSubtotal = Math.round((exchangeSubtotal + esub) * 100) / 100;
        ef.stock_qty = Math.round((ef.stock_qty - takeQty) * 100) / 100;
        validExchangeItems.push({ fabric_id: ei.fabric_id, code: ef.code, name: ef.name, qty: takeQty, unit: ef.unit, unit_price: eprice, subtotal: esub });
        store.stockMovements.push({
          id: store.stockMovements.length + 1,
          fabric_id: ei.fabric_id,
          date: nowStr(),
          move_type: "จ่ายผ้าแลกเปลี่ยนให้ลูกค้า",
          qty: -takeQty,
          ref_type: "return",
          ref_id: ret.id,
          note: `แลกเปลี่ยนจากบิล ${sale.sale_no}`,
        });
      }
      ret.exchange_items = validExchangeItems;
      // เทียบมูลค่าแบบรวมภาษีทั้งสองฝั่งให้สอดคล้องกัน (amount ของฝั่งคืนรวม VAT ตามสัดส่วนบิลแล้ว
      // ฝั่งผ้าใหม่ก็ต้องคิด VAT ตามสัดส่วนเดียวกันด้วย ไม่งั้นส่วนต่างจะเพี้ยนไปเท่ากับ VAT ของฝั่งผ้าใหม่)
      const exchangeRatio = sale.subtotal > 0 ? exchangeSubtotal / sale.subtotal : 0;
      const exchangeVatPortion = Math.round(sale.vat_amount * exchangeRatio * 100) / 100;
      const exchangeAmount = Math.round((exchangeSubtotal + exchangeVatPortion) * 100) / 100;
      const diff = Math.round((amount - exchangeAmount) * 100) / 100;
      ret.exchange_diff = diff;
      if (sale.customer_id) {
        const c = getCustomer(sale.customer_id);
        if (c) {
          if (diff > 0) {
            c.exchange_credit = Math.round(((c.exchange_credit || 0) + diff) * 100) / 100;
          } else if (diff < 0) {
            const extra = Math.round(-diff * 100) / 100;
            ret.extra_payment_amount = extra;
            ret.extra_account_id = extraAccountId || null;
            if (extraAccountId) recordAccountMovement(extraAccountId, extra, "return", ret.id, `รับชำระส่วนต่างแลกเปลี่ยนผ้า (บิล ${sale.sale_no})`);
          }
        }
      }
    }
    updateSaleStatusAfterReturn(sale);
    save();
    return ret;
  }
  function updateSaleStatusAfterReturn(sale) {
    if (sale.payment_method === "เงินเชื่อ") {
      if (sale.paid >= sale.total) sale.status = "ชำระแล้ว";
      else sale.status = sale.paid === 0 ? "ค้างชำระ" : "ชำระบางส่วน";
    } else if (sale.payment_method === "เงินสดแต่ยังไม่จ่าย") {
      sale.status = sale.paid >= sale.total ? "ชำระแล้ว" : "เงินสดแต่ค้างชำระ";
    } else if (sale.paid < sale.total) {
      sale.status = "ค้างชำระ";
    }
  }
  function useExchangeCredit(customerId, amount) {
    const c = getCustomer(customerId);
    if (!c || !amount) return;
    c.exchange_credit = Math.max(0, Math.round(((c.exchange_credit || 0) - amount) * 100) / 100);
    save();
  }

  // ------------------------------------------------------------ purchases
  function genPoNo() {
    const d = todayStr().replace(/-/g, "");
    const n = store.purchases.filter((p) => p.po_no.startsWith("PO" + d)).length;
    return "PO" + d + pad(n + 1, 3);
  }
  function createPurchase(items, supplierId, discount, vatAmount, paymentMethod, note, date, poNo, dueDate) {
    const subtotal = items.reduce((sum, it) => sum + it.qty * it.unit_cost, 0);
    const disc = discount || 0;
    const total = Math.max(0, subtotal - disc) + vatAmount;
    const purchase = {
      id: genId("purchase"),
      po_no: poNo || genPoNo(),
      date: date || nowStr(),
      due_date: dueDate || "",
      supplier_id: supplierId,
      items: items.map((it) => ({
        fabric_id: it.fabric_id,
        qty: it.qty,
        unit_cost: it.unit_cost,
        discount: it.discount || 0,
        subtotal: it.qty * it.unit_cost,
      })),
      subtotal,
      discount: disc,
      vat_amount: vatAmount,
      total,
      // ซื้อเงินสด: ถือว่าจ่ายครบทันทีตอนรับสินค้าเข้า (เหมือนบิลขายเงินสด) ไม่ต้องกดบันทึกจ่ายเงินแยกอีกขั้นตอน
      paid: paymentMethod === "เงินสด" ? total : 0,
      payment_method: paymentMethod,
      status: "รับสินค้าแล้ว",
      payment_status: paymentMethod === "เงินสด" ? "ชำระแล้ว" : "ค้างชำระ",
      cash_auto_paid: paymentMethod === "เงินสด",
      note: note || "",
    };
    store.purchases.push(purchase);
    applyPurchaseEffects(purchase);
    
    if (paymentMethod === "เงินสด" && total > 0) {
      syncPurchaseAccountBalance(purchase, [{ account_id: getCashAccount().id, amount: total }]);
    }
    save();
    return purchase;
  }
  // ผลของการรับสินค้าเข้าจริง: เพิ่มสต็อก + บันทึกการเคลื่อนไหว + เพิ่มยอดหนี้ซัพพลายเออร์ (ถ้าซื้อเงินเชื่อ)
  function applyPurchaseEffects(purchase) {
    for (const it of purchase.items) {
      const f = getFabric(it.fabric_id);
      if (f) {
        f.stock_qty += it.qty;
        f.cost_price = it.unit_cost;
      }
      store.stockMovements.push({
        id: store.stockMovements.length + 1,
        fabric_id: it.fabric_id,
        date: nowStr(),
        move_type: "รับเข้า",
        qty: it.qty,
        ref_type: "purchase",
        ref_id: purchase.id,
        note: purchase.po_no,
      });
    }
    if (purchase.payment_method === "เงินเชื่อ") {
      const s = getSupplier(purchase.supplier_id);
      if (s) s.credit_balance += purchase.total;
    }
  }
  // ย้อนผลของการรับสินค้า (ใช้ตอนแก้ไข/ลบใบสั่งซื้อที่รับสินค้าไปแล้ว) ตัดสต็อกที่เคยเพิ่มออก และปรับยอดหนี้ซัพพลายเออร์คืน
  function revertPurchaseEffects(purchase) {
    for (const it of purchase.items) {
      const f = getFabric(it.fabric_id);
      if (f) f.stock_qty -= it.qty;
      store.stockMovements.push({
        id: store.stockMovements.length + 1,
        fabric_id: it.fabric_id,
        date: nowStr(),
        move_type: "คืนสต็อก (แก้ไข/ลบใบสั่งซื้อ)",
        qty: -it.qty,
        ref_type: "purchase",
        ref_id: purchase.id,
        note: purchase.po_no,
      });
    }
    if (purchase.payment_method === "เงินเชื่อ") {
      const s = getSupplier(purchase.supplier_id);
      if (s) s.credit_balance -= purchase.total - purchase.paid;
    }
  }
  // บันทึกอัตโนมัติ/แก้ไขใบสั่งซื้อ: ถ้ายังไม่รับสินค้าจะแก้ตรงๆ ได้เลย
  // ถ้ารับสินค้าไปแล้วจะย้อนผลเดิมก่อนแล้วค่อยใส่ผลใหม่ตามรายการที่แก้ไข เพื่อให้สต็อก/ยอดหนี้ถูกต้องเสมอ
  function updatePurchase(id, items, supplierId, discount, vatAmount, paymentMethod, note, date, poNo, dueDate) {
    const purchase = store.purchases.find((x) => x.id === id);
    if (!purchase) return null;
    const wasReceived = purchase.status === "รับสินค้าแล้ว";
    if (wasReceived) revertPurchaseEffects(purchase);

    const subtotal = items.reduce((sum, it) => sum + it.qty * it.unit_cost, 0);
    const disc = discount || 0;
    const total = Math.max(0, subtotal - disc) + vatAmount;
    purchase.po_no = poNo || purchase.po_no;
    purchase.date = date || purchase.date;
    purchase.due_date = dueDate !== undefined ? dueDate : purchase.due_date || "";
    purchase.supplier_id = supplierId;
    purchase.items = items.map((it) => ({
      fabric_id: it.fabric_id,
      qty: it.qty,
      unit_cost: it.unit_cost,
      discount: it.discount || 0,
      subtotal: it.qty * it.unit_cost,
    }));
    purchase.subtotal = subtotal;
    purchase.discount = disc;
    purchase.vat_amount = vatAmount;
    purchase.total = total;
    purchase.payment_method = paymentMethod;
    purchase.note = note || "";
    if (wasReceived) {
      // ซื้อเงินสด: ให้ยอดจ่ายตามยอดรวมล่าสุดเสมอ (จ่ายครบทันที เหมือนบิลขายเงินสด)
      if (paymentMethod === "เงินสด") {
        purchase.paid = purchase.total;
        purchase.payment_status = "ชำระแล้ว";
        purchase.cash_auto_paid = true;
        syncPurchaseAccountBalance(purchase, purchase.total > 0 ? [{ account_id: getCashAccount().id, amount: purchase.total }] : []);
      } else {
        // เปลี่ยนจากเงินสดมาเป็นวิธีอื่น: ล้างยอดที่เคยจ่ายอัตโนมัติตอนเป็นเงินสดคืน กลับเป็นค้างชำระ (ไม่แตะยอดที่จ่ายจริงผ่าน "บันทึกจ่ายเงิน")
        if (purchase.cash_auto_paid) {
          purchase.paid = 0;
          syncPurchaseAccountBalance(purchase, []);
        }
        purchase.cash_auto_paid = false;
        purchase.payment_status = purchase.paid >= purchase.total ? "ชำระแล้ว" : purchase.paid > 0 ? "ชำระบางส่วน" : "ค้างชำระ";
      }
      applyPurchaseEffects(purchase);
      }
    save();
    return purchase;
  }
  // ใช้ลบใบสั่งซื้อร่างที่ยังไม่ได้รับสินค้าเท่านั้น (เช่น ตอนลบรายการสุดท้ายออกจนไม่เหลือรายการระหว่างบันทึกอัตโนมัติ)
  function deletePurchaseDraft(id) {
    const idx = store.purchases.findIndex((x) => x.id === id && x.status !== "รับสินค้าแล้ว");
    if (idx === -1) return false;
    store.purchases.splice(idx, 1);
    save();
    return true;
  }
  // ลบใบสั่งซื้อได้ทุกสถานะ ถ้ารับสินค้าไปแล้วจะย้อนสต็อก/ยอดหนี้ที่เคยบันทึกไว้ให้อัตโนมัติก่อนลบ
  function deletePurchase(id) {
    const idx = store.purchases.findIndex((x) => x.id === id);
    if (idx === -1) return false;
    const p = store.purchases[idx];
    if (p.status === "รับสินค้าแล้ว") revertPurchaseEffects(p);
    syncPurchaseAccountBalance(p, []);
    store.purchases.splice(idx, 1);
    save();
    return true;
  }
  function receivePurchase(purchaseId) {
    const p = store.purchases.find((x) => x.id === purchaseId);
    if (!p || p.status === "รับสินค้าแล้ว") return false;
    applyPurchaseEffects(p);
    
    p.status = "รับสินค้าแล้ว";
    save();
    return true;
  }
  function payPurchase(purchaseId, amount, method, accountSplits) {
    const p = store.purchases.find((x) => x.id === purchaseId);
    if (!p) return;
    p.paid += amount;
    p.payment_status = p.paid >= p.total ? "ชำระแล้ว" : "ชำระบางส่วน";
    let newSplits = [];
    if (method === "เงินสด" && amount > 0) {
      newSplits = [{ account_id: getCashAccount().id, amount: amount }];
    } else if (method === "โอนเงิน") {
      newSplits = normalizeSplits(accountSplits);
    }
    if (newSplits.length > 0) {
      syncPurchaseAccountBalance(p, (p.account_splits || []).concat(newSplits));
    }
    save();
  }
  function unpayPurchase(purchaseId) {
    const p = store.purchases.find((x) => x.id === purchaseId);
    if (!p) return;
    const amt = p.paid;
    if (amt > 0 && p.payment_method === "เงินเชื่อ") {
      const s = getSupplier(p.supplier_id);
      if (s) {
        store.supplierPayments.push({
          id: store.supplierPayments.length + 1,
          supplier_id: p.supplier_id,
          date: nowStr(),
          amount: -amt,
          method: "ยกเลิกการชำระ",
          note: `ยกเลิกการชำระ PO ${p.po_no}`,
        });
        s.credit_balance += amt;
      }
    }
    p.paid = 0;
    p.payment_status = "ค้างชำระ";
    syncPurchaseAccountBalance(p, []);
    save();
  }

    for (const s of rows) {

          cogs += it.qty * (Number(it.cost_price) || 0);
        } else {

          cogs += it.qty * (f ? f.cost_price : 0);

  function bestSellers(start, end, limit) {
    const rows = getSales(start, end);
    const map = {};
    for (const s of rows) {
      for (const it of s.items) {
        if (it.is_misc) continue;
        const f = getFabric(it.fabric_id);
        const key = it.fabric_id;
        if (!map[key]) map[key] = { code: f ? f.code : "?", name: f ? f.name : "(ลบแล้ว)", qty_sold: 0, total_sold: 0 };
        map[key].qty_sold += it.qty;
        map[key].total_sold += it.subtotal;
      }
    }
    return Object.values(map)
      .sort((a, b) => b.qty_sold - a.qty_sold)
      .slice(0, limit || 10);
  }

  // ยอดเงินสดค้างชำระ (เงินสดแต่ยังไม่จ่าย) ของลูกค้ารายหนึ่ง - ไม่รวมอยู่ใน credit_balance เพราะ credit_balance ใช้เช็ควงเงินเครดิตแยกต่างหาก
  function getCustomerCashPendingTotal(customerId) {
    return store.sales
      .filter((s) => s.customer_id === customerId && s.payment_method === "เงินสดแต่ยังไม่จ่าย" && (s.paid || 0) < s.total)
      .reduce((sum, s) => sum + (s.total - (s.paid || 0)), 0);
  }
  // ยอดค้างชำระรวมของลูกค้า = ยอดเครดิต (credit_balance) + ยอดเงินสดค้างจ่าย - ใช้แสดงผลเท่านั้น ไม่กระทบ credit_balance/credit_limit
  function getCustomerTotalDue(customer) {
    return (customer.credit_balance || 0) + getCustomerCashPendingTotal(customer.id);
  }
  // แยกยอดค้างชำระสะสมของลูกค้าออกเป็น "ค่าผ้า" กับ "ค่าส่ง" (เฉพาะบิลแว็ดที่มีค่าจัดส่งแยกบัญชี)
  // ใช้แสดงผลในใบเสร็จเท่านั้น ไม่กระทบยอดค้างชำระจริง (credit_balance ที่เหลือ ถือเป็นส่วนของค่าผ้าทั้งหมด)
  function getCustomerDueBreakdown(customer) {
    let fabric = customer.credit_balance || 0;
    let shipping = 0;
    const pending = store.sales.filter(
      (s) => s.customer_id === customer.id && s.payment_method === "เงินสดแต่ยังไม่จ่าย" && (s.paid || 0) < s.total
    );
    for (const s of pending) {
      const remain = s.total - (s.paid || 0);
      const isVatShip = !!s.is_vat && (s.shipping_fee || 0) > 0;
      if (isVatShip) {
        const shipPart = Math.min(remain, s.shipping_fee);
        shipping += shipPart;
        fabric += remain - shipPart;
      } else {
        fabric += remain;
      }
    }
    return { fabric, shipping };
  }

  // ช่วยแปลงค่าช่องหนึ่งให้เป็นข้อความปลอดภัยสำหรับ CSV (ค่าที่เป็น object/array ซ้อนอยู่ข้างในจะถูกแปลงเป็น JSON ในช่องเดียว)
  function csvNestedToReadable(v) {
    if (Array.isArray(v)) return v.map(csvNestedToReadable).join(" | ");
    if (v && typeof v === "object") {
      return Object.entries(v)
        .map(([k, val]) => `${k}=${val && typeof val === "object" ? csvNestedToReadable(val) : val}`)
        .join(" ");
    }
    return String(v);
  }
  function csvCell(v) {
    if (v === undefined || v === null) return "";
    if (typeof v === "object") v = csvNestedToReadable(v);
    let s = String(v);
    // แปลงขึ้นบรรทัดใหม่ในเซลล์ (เช่นรายการสินค้าหลายบรรทัด) ให้เป็นตัวคั่น " | " แทน เพราะเซลล์หลายบรรทัดใน .csv
    // มักแสดงผลไม่ถูกต้องเมื่อเปิดใน Excel/โปรแกรมดู CSV บางตัว ทำให้อ่านยาก
    s = s.replace(/\r\n|\r|\n/g, " | ");
    if (s.includes(",") || s.includes('"')) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  // สร้าง CSV หนึ่งส่วน (หนึ่งตาราง) จากอาร์เรย์ของ object โดยรวมทุกคีย์ที่พบในแถวใดๆ มาเป็นหัวตาราง
  function csvSection(title, rows) {
    if (!rows || rows.length === 0) return `## ${title} ##\r\n(ไม่มีข้อมูล)\r\n`;
    const keySet = new Set();
    rows.forEach((r) => Object.keys(r || {}).forEach((k) => keySet.add(k)));
    const keys = Array.from(keySet);
    const lines = [`## ${title} ##`, keys.map(csvCell).join(",")];
    rows.forEach((r) => lines.push(keys.map((k) => csvCell(r ? r[k] : "")).join(",")));
    return lines.join("\r\n") + "\r\n";
  }
  // จัดกลุ่มตารางข้อมูลเป็นหมวดตามหน้าเมนูของโปรแกรม (เรียงลำดับตาม TABS) ใช้ร่วมกันทั้งการ export เป็น .csv และ .xlsx (หลาย worksheet)
  function buildBackupPages() {
    return [
      ["ข้อมูลร้าน", [["ข้อมูลร้าน (shopInfo)", [store.shopInfo]]]],
      ["ขายสินค้า", [
        ["บิลขาย (sales)", store.sales],
        ["การชำระเงินลูกค้า (customerPayments)", store.customerPayments],
      ]],
      ["รับสินค้าเข้า", [
        ["ใบรับสินค้าเข้า (purchases)", store.purchases],
        ["การชำระเงินซัพพลายเออร์ (supplierPayments)", store.supplierPayments],
      ]],
      ["คลังผ้า", [
        ["ผ้า-สินค้า (fabrics)", store.fabrics],
        ["ประวัติการปรับสต็อก (stockMovements)", store.stockMovements],
      ]],
      ["ลูกค้า", [["ลูกค้า (customers)", store.customers]]],
      ["ซัพพลายเออร์", [["ซัพพลายเออร์ (suppliers)", store.suppliers]]],
      ["รายการรอสินค้า", [["รายการรอสินค้า (backorders)", store.backorders]]],
      ["ลูกค้าสั่งผ้า", [["คำสั่งซื้อออนไลน์ (customerOrders)", store.customerOrders]]],
      ["บัญชี", [
        ["บัญชีธนาคาร-เงินสด (bankAccounts)", store.bankAccounts],
        ["ความเคลื่อนไหวบัญชี (accountMovements)", store.accountMovements],
        ["รายจ่าย (expenses)", store.expenses],
        ["หมวดรายจ่าย (expenseCategories)", store.expenseCategories],
      ]],
    ];
  }
  function fmtMoneyForBackup(x) {
    const n = Number(x);
    if (isNaN(n)) return "0.00";
    return n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  // จัดรายการสินค้าในบิลขายให้อ่านง่ายแบบเดียวกับที่โปรแกรมแสดงในตะกร้า/ใบเสร็จ (รหัส ชื่อ จำนวน หน่วย x ราคา = ยอดรวม)
  // แทนที่จะ dump ทุก field ดิบๆ (fabric_id, stock_qty, is_misc ฯลฯ) ที่อ่านยาก
  function formatSaleItemsReadable(items) {
    if (!items || !items.length) return "";
    return items
      .map((it) => {
        let label = [it.code, it.name].filter(Boolean).join(" ").trim();
        if (!label && !it.is_misc && it.fabric_id) {
          // รายการเก่าบางรายการยังไม่มี code/name เก็บไว้ที่ตัว item เอง ให้ย้อนไปหาจากตารางผ้าแทน
          const f = getFabric(it.fabric_id);
          if (f) label = [f.code, f.name].filter(Boolean).join(" ").trim();
        }
        if (!label) label = it.is_misc ? "รายการฝากซื้อ" : "(ไม่พบข้อมูลผ้า)";
        const qtyUnit = `${it.qty}${it.unit ? " " + it.unit : ""}`;
        const sub = it.subtotal !== undefined && it.subtotal !== null ? it.subtotal : it.qty * it.unit_price;
        let line = `${label} ${qtyUnit} x ${fmtMoneyForBackup(it.unit_price)} = ${fmtMoneyForBackup(sub)}`;
        if (it.note) line += ` (${it.note})`;
        return line;
      })
      .join("\n");
  }
  // จัดรายการผ้าในใบรับสินค้าเข้าให้อ่านง่ายแบบเดียวกับที่โปรแกรมแสดง (รหัส ชื่อ จำนวน หน่วย x ราคาต้นทุน = ยอดรวม)
  // รายการรับสินค้าเข้าเก็บแค่ fabric_id ไม่ได้เก็บ code/name/unit ไว้ที่ตัว item เอง เลยต้องย้อนไปหาจากตารางผ้าเสมอ
  function formatPurchaseItemsReadable(items) {
    if (!items || !items.length) return "";
    return items
      .map((it) => {
        const f = it.fabric_id ? getFabric(it.fabric_id) : null;
        const label = f ? [f.code, f.name].filter(Boolean).join(" ").trim() : "(ไม่พบข้อมูลผ้า)";
        const qtyUnit = `${it.qty}${f && f.unit ? " " + f.unit : ""}`;
        const sub = it.subtotal !== undefined && it.subtotal !== null ? it.subtotal : it.qty * it.unit_cost;
        let line = `${label} ${qtyUnit} x ${fmtMoneyForBackup(it.unit_cost)} = ${fmtMoneyForBackup(sub)}`;
        if (it.discount) line += ` (ส่วนลด ${fmtMoneyForBackup(it.discount)})`;
        return line;
      })
      .join("\n");
  }
  // ให้หน้า UI นำไปสร้างไฟล์ .xlsx แบบหลาย worksheet เอง (แปลงค่าที่เป็น object/array ซ้อนให้เป็นข้อความอ่านง่ายไว้ล่วงหน้าแล้ว
  // เหลือแค่ตัวเลข/ข้อความ/ว่าง ที่ SheetJS ใส่ลงเซลล์ได้ตรงๆ)
  function exportBackupPages() {
    const pages = buildBackupPages();
    return pages.map(([pageTitle, sections]) => [
      pageTitle,
      sections.map(([title, rows]) => [
        title,
        (rows || []).map((r) => {
          const out = {};
          Object.keys(r || {}).forEach((k) => {
            const v = r[k];
            if (title === "บิลขาย (sales)" && k === "items") {
              out[k] = formatSaleItemsReadable(v);
            } else if (title === "ใบรับสินค้าเข้า (purchases)" && k === "items") {
              out[k] = formatPurchaseItemsReadable(v);
            } else {
              out[k] = v && typeof v === "object" ? csvNestedToReadable(v) : v;
            }
          });
          return out;
        }),
      ]),
    ]);
  }
  // สำรองข้อมูลเป็น CSV (สำหรับเปิดดู/ตรวจสอบใน Excel เท่านั้น ไม่รองรับการนำเข้ากลับ ใช้ไฟล์ .json สำหรับกู้คืนข้อมูล)
  // ใช้ exportBackupPages() ตัวเดียวกับที่สร้างไฟล์ .xlsx เพื่อให้คอลัมน์ items อ่านง่ายเหมือนกัน
  function exportBackupCsv() {
    const pages = exportBackupPages();
    const bar = "=".repeat(50);
    const pageBlocks = pages.map(([pageTitle, sections]) => {
      const header = `${bar}\r\nหน้า: ${pageTitle}\r\n${bar}`;
      const body = sections.map(([title, rows]) => csvSection(title, rows)).join("\r\n");
      return `${header}\r\n${body}`;
    });
    return "﻿" + pageBlocks.join("\r\n");
  }
  function importBackup(json) {
    const data = JSON.parse(json);
    store = data;
    save();
  }
  function resetAll() {
    store = emptyStore();
    save();
  }

  return {
    todayStr, nowStr, monthStartStr,
    getShopInfo, updateShopInfo,
    addSupplier, updateSupplier, deleteSupplier, getSuppliers, getSupplier,
    addCustomer, updateCustomer, deleteCustomer, getCustomers, getCustomer,

    paySupplierCredit, getSupplierPayments,

    adjustStock, getStockMovements, deleteStockMovement,
    addRoll, getRollsByFabric, getActiveRollsByFabric, getRoll, adjustRollQty,
    createSale, updateSale, deleteSale, getSales, getSale, markSalePaid,

    createPurchase, updatePurchase, deletePurchaseDraft, deletePurchase, receivePurchase, payPurchase, unpayPurchase, getPurchases, getPurchase, genPoNo,
    addExpense, getExpenses, deleteExpense, updateExpense,
    getExpenseCategories, addExpenseCategory, updateExpenseCategory, deleteExpenseCategory,
    addBackorder, updateBackorder, deleteBackorder, markBackorderDone, markBackorderUndone, getBackorders, getBackorder,
    addCustomerOrder, updateCustomerOrder, deleteCustomerOrder, markCustomerOrderDone, markCustomerOrderUndone, getCustomerOrders, getCustomerOrder,
    addQuotation, updateQuotation, deleteQuotation, getQuotations, getQuotation, setQuotationStatus, markQuotationConverted,
    addBillingNote, updateBillingNote, deleteBillingNote, getBillingNotesForCustomer, getBillingNote,
    getBankAccounts, getBankAccount, getCashAccount, createBankAccount, updateBankAccount, deleteBankAccount, adjustBankAccountBalance, transferBetweenAccounts, getAccountMovements,
    salesSummary, cogsSummary, expensesSummary, shippingSummary, bestSellers, lowStockList,
    arAging, apAging, getCustomerCashPendingTotal, getCustomerTotalDue, getCustomerDueBreakdown,
    exportBackup, exportBackupCsv, exportBackupPages, importBackup, resetAll,
    pullFromCloud, pushToCloud, setCloudSyncListener, getCloudStatus,
  };
}

}

  function money(x) {
    const n = Number(x);
    if (isNaN(n)) return "0.00";
    return n.toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  // แปลงวันที่จาก YYYY-MM-DD (หรือ YYYY-MM-DD HH:MM:SS) เก็บในระบบ ให้แสดงผลเป็น วัน/เดือน/ปี
  function fmtDate(dateStr) {
    if (!dateStr) return "";
    const [datePart, timePart] = String(dateStr).split(" ");
    const parts = datePart.split("-");
    if (parts.length !== 3) return dateStr;
    const [y, m, d] = parts;
    const out = `${d}/${m}/${y}`;
    return timePart ? `${out} ${timePart}` : out;
  }

  // input[type=date] ของเบราว์เซอร์แสดงผลตาม locale ของเครื่องผู้ใช้เสมอ (แก้ผ่าน HTML/attribute ไม่ได้)
  // ฟังก์ชันนี้สร้าง input วันที่พร้อมข้อความทับด้านบนที่บังคับให้แสดงเป็น วัน/เดือน/ปี เสมอ
  // คืนค่าเป็น <span> ที่มี getter/setter ของ .value ชี้ไปที่ input จริงข้างใน จึงใช้แทน el("input", {type:"date", ...}) ได้ทันที
  function dateInputEl(attrs) {
    attrs = Object.assign({}, attrs || {});
    const initialValue = attrs.value || "";
    const userOnChange = attrs.onChange;
    delete attrs.value;
    delete attrs.onChange;
    delete attrs.type;
    const display = el("span", { class: "date-display-overlay", text: fmtDate(initialValue) });
    const input = el("input", Object.assign({ type: "date", class: "date-native-input", value: initialValue }, attrs));
    input.addEventListener("change", () => {
      display.textContent = fmtDate(input.value);
    });
    if (userOnChange) input.addEventListener("change", userOnChange);
    const wrap = el("span", { class: "date-input-wrap" }, input, display);
    Object.defineProperty(wrap, "value", {
      get() {
        return input.value;
      },
      set(v) {
        input.value = v;
        display.textContent = fmtDate(v);
      },
    });
    return wrap;
  }

  function exposeTestRefs(name, obj) {
    if (typeof global.window !== "undefined") {
      global.window.__test = global.window.__test || {};
      global.window.__test[name] = obj;
    }

  // --------------------------------------------------------- dom helper
  function el(tag, attrs, ...children) {
    const doc = global.document;
    const node = doc.createElement(tag);
    attrs = attrs || {};
    for (const k of Object.keys(attrs)) {
      const v = attrs[k];
      if (v === null || v === undefined) continue;
      if (k === "class") node.className = v;
      else if (k === "text") node.textContent = v;
      else if (k === "style" && typeof v === "object") Object.assign(node.style, v);
      else if (k.length > 2 && k.startsWith("on") && typeof v === "function") {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (["value", "checked", "disabled", "selected", "type", "placeholder", "rows", "cols", "id"].includes(k)) {
        node[k] = v;
      } else {
        node.setAttribute(k, v);
      }
    }
    const flat = [];
    (function flatten(arr) {
      for (const c of arr) {
        if (Array.isArray(c)) flatten(c);
        else flat.push(c);
      }
    })(children);
    for (const c of flat) {
      if (c === null || c === undefined || c === false) continue;
      if (typeof c === "string" || typeof c === "number") {
        node.appendChild(doc.createTextNode(String(c)));
      } else {
        node.appendChild(c);
      }
    }
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

    return el("div", { class: "form-row" }, el("label", { text: labelText }), inputEl);

    return el("input", { type: "text", value: value === undefined || value === null ? "" : String(value) });

    const sel = el("select", {});
    options.forEach((o) =>
      sel.appendChild(el("option", { value: o.value, text: o.label, style: o.color ? { color: o.color, fontWeight: "600" } : null }))

  // แถวเลือกบัญชี + จำนวนเงิน แบบหลายแถว รองรับกรณีลูกค้าโอนแยกเข้าหลายบัญชีสำหรับยอดเดียวกัน (หรือร้านจ่ายแยกหลายบัญชี)
  function buildAccountSplitRows(defaultAmount, defaultAccountId) {
    const container = el("div", { class: "account-split-rows" });
    const rows = [];
    function addRow(presetAccountId, presetAmount) {
      const accSel = buildBankAccountSelect(presetAccountId);
      const amtInput = numberInput(presetAmount !== undefined && presetAmount !== null ? presetAmount : "");
      amtInput.setAttribute("placeholder", "จำนวนเงิน");
      const rowEl = el(
        "div",
        { class: "account-split-row", style: { display: "flex", gap: "6px", marginBottom: "4px", alignItems: "center" } },
        accSel,
        amtInput,
        el(
          "button",
          {
            class: "btn btn-sm",
            onClick: () => {
              if (rows.length <= 1) return;
              const idx = rows.indexOf(rowEl);
              if (idx !== -1) rows.splice(idx, 1);
              if (rowEl.parentNode) rowEl.parentNode.removeChild(rowEl);
            },
          },
          "ลบ"
        )
      );
      rowEl.__accSel = accSel;
      rowEl.__amtInput = amtInput;
      rows.push(rowEl);
      container.appendChild(rowEl);
    }
    addRow(defaultAccountId || null, defaultAmount);
    const addBtn = el("button", { class: "btn btn-sm", onClick: () => addRow() }, "+ เพิ่มบัญชี");
    function getSplits() {
      return rows
        .map((r) => ({
          account_id: r.__accSel.value ? Number(r.__accSel.value) : null,
          amount: Number(r.__amtInput.value) || 0,
        }))
        .filter((s) => s.account_id && s.amount > 0);
    }
    function getTotal() {
      return getSplits().reduce((sum, s) => sum + s.amount, 0);
    }
    function reset(presetAmount) {
      while (rows.length) {
        const r = rows.pop();
        if (r.parentNode) r.parentNode.removeChild(r);
      }
      addRow(null, presetAmount);
    }
    function setSplits(list) {
      while (rows.length) {
        const r = rows.pop();
        if (r.parentNode) r.parentNode.removeChild(r);
      }
      if (list && list.length > 0) {
        list.forEach((s) => addRow(s.account_id, s.amount));
      } else {
        addRow(null, "");
      }
    }
    // ถ้ามีแค่บัญชีเดียว (ยังไม่ได้กด "+ เพิ่มบัญชี") ให้ก็อปจำนวนเงินมาใส่อัตโนมัติ
    // เพื่อไม่ต้องพิมพ์จำนวนเงินซ้ำสองที่ (ถ้าแบ่งหลายบัญชีแล้ว ผู้ใช้ต้องกรอกเองตามที่ต้องการ)
    function syncAmountIfSingle(amount) {
      if (rows.length === 1) rows[0].__amtInput.value = amount;
    }
    return { container, addBtn, getSplits, getTotal, reset, setSplits, syncAmountIfSingle };
  }

  // ช่องเลือกแบบพิมพ์ค้นหาได้ (input + datalist) ใช้แทน select เมื่ออยากให้พิมพ์กรองตัวเลือกได้
  // ช่องเสิร์ชแบบพิมพ์ค้นหา: ค่าที่เลือกอยู่จะโชว์เป็นตัวจางๆ (placeholder) แทนการใส่เป็นข้อความจริงในช่อง
  // เพื่อให้พิมพ์ค้นหาต่อได้เลยโดยไม่ต้องลบข้อความเดิมออกก่อน
  function searchSelectInput(options, selectedValue, placeholder) {
    const listId = "dl_" + Math.random().toString(36).slice(2, 10);
    const datalist = el("datalist", { id: listId });
    const byLabel = new Map();
    options.forEach((o) => {
      if (!o.value) return;
      datalist.appendChild(el("option", { value: o.label }));
      byLabel.set(o.label, o.value);
    });
    const defaultPlaceholder = placeholder || "พิมพ์เพื่อค้นหา...";
    const selectedOpt = options.find((o) => o.value === String(selectedValue));
    const input = el("input", {
      type: "text",
      list: listId,
      placeholder: selectedOpt ? selectedOpt.label : defaultPlaceholder,
      value: "",
    });
    const wrap = el("span", { class: "search-select" }, input, datalist);
    wrap.getMatchedValue = () => {
      const v = input.value.trim();
      if (!v) return "";
      const match = byLabel.get(v);
      return match !== undefined ? match : null;
    };
    wrap.setLabel = (label) => {
      input.placeholder = label || defaultPlaceholder;
      input.value = "";
    };
    wrap.inputEl = input;
    return wrap;
  }

  function buildTable(headers, rows) {

function buildDataTable(columns, dataRows, opts) {
    opts = opts || {};
    const headers = [];
    if (opts.checkbox) headers.push("");
    headers.push(...columns);
    if (opts.actions) headers.push("จัดการ");
    const headerCells = headers.map((h, i) => {
      if (opts.checkbox && i === 0) {
        const allChecked = dataRows.length > 0 && dataRows.every((_, idx) => opts.checkbox.isChecked(idx));
        const headerChk = el("input", {
          type: "checkbox",
          checked: allChecked,
          title: "เลือกทั้งหมด",
          onChange: (e) => {
            if (opts.checkbox.onSelectAll) opts.checkbox.onSelectAll(e.target.checked);
          },
        });
        return el("th", {}, headerChk);
      }
      return el("th", { text: h, class: opts.actions && i === headers.length - 1 ? "actions-header" : "" });
    });
    const thead = el("thead", {}, el("tr", {}, ...headerCells));
    const tbody = el("tbody", {});
    dataRows.forEach((row, idx) => {
      const tr = el("tr", {});
      if (opts.checkbox) {
        const chk = el("input", {
          type: "checkbox",
          checked: opts.checkbox.isChecked(idx),
          onChange: (e) => opts.checkbox.onToggle(idx, e.target.checked),
        });
        tr.appendChild(el("td", {}, chk));
      }
      row.forEach((c, ci) => {
        const cellStyle = opts.cellStyle ? opts.cellStyle(row, ci, columns[ci]) : null;
        tr.appendChild(el("td", { text: String(c), style: cellStyle || {} }));
      });
      if (opts.actions) {
        const actionsCell = el("td", { class: "actions-cell" });
        opts.actions(idx).forEach((a) => {
          actionsCell.appendChild(el("button", { class: "btn btn-sm", onClick: () => a.onClick() }, a.label));
        });
        tr.appendChild(actionsCell);
      }
      tbody.appendChild(tr);
    });
    if (dataRows.length === 0) {
      tbody.appendChild(el("tr", {}, el("td", { colspan: headers.length, class: "empty", text: "ไม่มีข้อมูล" })));
    }
    return el("table", { class: "data-table" }, thead, tbody);
  }

  async function downloadTextFile(filename, text) {
    // ถ้าเบราว์เซอร์รองรับ (เช่น Chrome/Edge บนคอม) ให้เปิดหน้าต่าง "บันทึกเป็น" ให้เลือกตำแหน่งที่จะเซฟเองได้
    if (global.showSaveFilePicker) {
      try {
        const ext = (filename.match(/\.([a-z0-9]+)$/i) || [, "txt"])[1].toLowerCase();
        const mimeByExt = { json: "application/json", txt: "text/plain", csv: "text/csv" };
        const mime = mimeByExt[ext] || "text/plain";
        const handle = await global.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "ไฟล์ " + ext.toUpperCase(), accept: { [mime]: ["." + ext] } }],
        });
        const writable = await handle.createWritable();
        await writable.write(text);
        await writable.close();
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // ผู้ใช้กดยกเลิกหน้าต่างเลือกตำแหน่งเซฟ
        // ถ้าใช้ไม่ได้ด้วยเหตุอื่น ให้ตกไปใช้วิธีดาวน์โหลดปกติด้านล่างแทน
      }
    }
    const blob = new global.Blob([text], { type: "text/plain;charset=utf-8" });
    const url = global.URL.createObjectURL(blob);
    const a = el("a", { href: url, download: filename });
    global.document.body.appendChild(a);
    a.click();
    global.document.body.removeChild(a);
    global.URL.revokeObjectURL(url);
  }

  function csvEscape(v) {
    const s = String(v);
    if (s.includes(",") || s.includes('"') || s.includes("\n")) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  function downloadCsv(filename, rows) {
    const csv = rows.map((r) => r.map(csvEscape).join(",")).join("\r\n");
    const blob = new global.Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" });
    const url = global.URL.createObjectURL(blob);
    const a = el("a", { href: url, download: filename });
    global.document.body.appendChild(a);
    a.click();
    global.document.body.removeChild(a);
    global.URL.revokeObjectURL(url);
  }

  // แปลงหนึ่งตาราง (หัวข้อ + rows ที่ DB.exportBackupPages() เตรียมไว้แล้ว) ให้เป็น array-of-arrays สำหรับใส่ใน worksheet
  function backupSectionToAoa(title, rows) {
    const out = [[`## ${title} ##`]];
    if (!rows || rows.length === 0) {
      out.push(["(ไม่มีข้อมูล)"]);
      out.push([]);
      return out;
    }
    const keySet = new Set();
    rows.forEach((r) => Object.keys(r || {}).forEach((k) => keySet.add(k)));
    const keys = Array.from(keySet);
    out.push(keys);
    rows.forEach((r) => out.push(keys.map((k) => (r && r[k] !== undefined && r[k] !== null ? r[k] : ""))));
    out.push([]);
    return out;
  }
  // สร้างไฟล์ .xlsx แบบหลาย worksheet (1 worksheet ต่อ 1 หน้าเมนู) จากข้อมูลที่ DB.exportBackupPages() จัดกลุ่มไว้ให้แล้ว
  async function downloadBackupXlsx(filename) {
    const pages = DB.exportBackupPages();
    const wb = global.XLSX.utils.book_new();
    const usedNames = new Set();
    pages.forEach(([pageTitle, sections]) => {
      let aoa = [];
      sections.forEach(([title, rows]) => {
        aoa = aoa.concat(backupSectionToAoa(title, rows));
      });
      const ws = global.XLSX.utils.aoa_to_sheet(aoa);
      let sheetName = pageTitle.slice(0, 31);
      let i = 2;
      while (usedNames.has(sheetName)) {
        sheetName = `${pageTitle.slice(0, 28)}(${i++})`;
      }
      usedNames.add(sheetName);
      global.XLSX.utils.book_append_sheet(wb, ws, sheetName);
    });

    const xlsxMime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
    if (global.showSaveFilePicker) {
      try {
        const handle = await global.showSaveFilePicker({
          suggestedName: filename,
          types: [{ description: "ไฟล์ XLSX", accept: { [xlsxMime]: [".xlsx"] } }],
        });
        const buf = global.XLSX.write(wb, { bookType: "xlsx", type: "array" });
        const blob = new global.Blob([buf], { type: xlsxMime });
        const writable = await handle.createWritable();
        await writable.write(blob);
        await writable.close();
        return;
      } catch (e) {
        if (e && e.name === "AbortError") return; // ผู้ใช้กดยกเลิกหน้าต่างเลือกตำแหน่งเซฟ
        // ถ้าใช้ไม่ได้ด้วยเหตุอื่น ให้ตกไปใช้วิธีดาวน์โหลดปกติด้านล่างแทน
      }
    }
    global.XLSX.writeFile(wb, filename);
  }

  function copyTextToClipboard(text) {
    if (global.navigator && global.navigator.clipboard && global.navigator.clipboard.writeText) {
      return global.navigator.clipboard.writeText(text);
    }
    // Fallback สำหรับเบราว์เซอร์ที่ไม่รองรับ Clipboard API
    return new Promise((resolve, reject) => {
      try {
        const ta = global.document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        global.document.body.appendChild(ta);
        ta.focus();
        ta.select();
        const ok = global.document.execCommand("copy");
        global.document.body.removeChild(ta);
        ok ? resolve() : reject(new Error("copy failed"));
      } catch (err) {
        reject(err);
      }
    });
  }
