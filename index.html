  // ดึงคำขอสั่งผ้าจากลิงก์สาธารณะ (order.html) เข้ามาเป็นรายการลูกค้าสั่งผ้า
  async function pullOnlineOrderRequests() {
    const btn = refs.pullOrderRequestsBtn;
    if (btn) {
      btn.disabled = true;
      btn.textContent = "กำลังดึงคำขอ...";
    }
    try {
      const url = global.__SUPABASE_URL__ + "/rest/v1/order_requests?status=eq.new&select=*&order=created_at.asc";
      const res = await fetch(url, {
        headers: {
          apikey: global.__SUPABASE_ANON_KEY__,
          Authorization: "Bearer " + global.__SUPABASE_ANON_KEY__,
        },
      });
      if (!res.ok) throw new Error("โหลดคำขอไม่สำเร็จ");
      const requests = await res.json();
      if (!requests || requests.length === 0) {
        global.alert("ไม่มีคำขอใหม่จากลูกค้า");
        return;
      }
      const customers = DB.getCustomers();
      for (const r of requests) {
        let customerId = null;
        if (r.customer_code) {
          const code = String(r.customer_code).trim().toLowerCase();
          const match = customers.find((c) => (c.code || "").trim().toLowerCase() === code);
          if (match) customerId = match.id;
        }
        const items = Array.isArray(r.items) && r.items.length
          ? r.items.map((it) => ({ fabric_text: it.fabric_text || "", qty: it.qty || 0, unit: it.unit || "" }))
          : [];
        DB.addCustomerOrder({
          customer_id: customerId,
          customer_name: r.customer_name || "",
          customer_phone: r.customer_phone || "",
          shipping_method: r.shipping_method || "",
          shipping_address: r.shipping_address || "",
          items,
          status: "รอดำเนินการ",
          note: [r.note, "(คำขอจากลิงก์ออนไลน์)"].filter(Boolean).join(" "),
        });
        fetch(global.__SUPABASE_URL__ + "/rest/v1/order_requests?id=eq." + r.id, {
          method: "PATCH",
          headers: {
            apikey: global.__SUPABASE_ANON_KEY__,
            Authorization: "Bearer " + global.__SUPABASE_ANON_KEY__,
            "Content-Type": "application/json",
          },
          body: JSON.stringify({ status: "pulled" }),
        }).catch(() => {});
      }
      renderCustomerOrderTable();
      updateCustomerOrdersBadge();
      global.alert(`ดึงคำขอใหม่จากลูกค้าเรียบร้อย ${requests.length} คำขอ`);
    } catch (e) {
      global.alert("เกิดข้อผิดพลาดในการดึงคำขอ กรุณาลองใหม่อีกครั้ง");
    } finally {
      if (btn) {
        btn.disabled = false;
        btn.textContent = "ดึงคำขอใหม่จากลูกค้า";
      }
    }
  }

  function formatCustomerOrderItems(items) {
    if (!items || items.length === 0) return "-";
    return items
      .map((it, i) => `${i + 1}. ${it.fabric_text || "-"}${it.qty ? ` (${it.qty}${it.unit ? " " + it.unit : ""})` : ""}`)
      .join("  |  ");
  }

  function renderCustomerOrderTable() {
    const container = refs.customerOrderTableContainer;
    if (!container) return;
    clear(container);
    let rows = DB.getCustomerOrders();
    if (!customerOrderShowDone) rows = rows.filter((o) => !o.done);
    const withCustomer = rows.map((o) => ({ o, c: o.customer_id ? DB.getCustomer(o.customer_id) : null }));
    const q = customerOrderSearch.trim().toLowerCase();
    let filtered = withCustomer;
    if (q) {
      filtered = withCustomer.filter(({ o, c }) => {
        const name = c ? c.name : o.customer_name || "";
        const code = c ? c.code : "";
        const phone = c ? c.phone : o.customer_phone || "";
        const itemsText = (o.items || []).map((it) => it.fabric_text || "").join(" ");
        return (
          name.toLowerCase().includes(q) ||
          code.toLowerCase().includes(q) ||
          (phone || "").includes(q) ||
          itemsText.toLowerCase().includes(q)
        );
      });
    }
    rows = filtered.map((x) => x.o);
    const table = buildDataTable(
      ["วันที่", "ลูกค้า", "เบอร์โทร", "รายการผ้า", "วิธีจัดส่ง", "ที่อยู่จัดส่ง", "สถานะ", "หมายเหตุ"],
      filtered.map(({ o, c }) => [
        fmtDate(o.date),
        c ? `${c.code} - ${c.name}` : o.customer_name || "-",
        c ? c.phone || "-" : o.customer_phone || "-",
        formatCustomerOrderItems(o.items),
        o.shipping_method || "-",
        o.shipping_address || "-",
        o.done ? "เสร็จแล้ว" : o.status,
        o.note || "",
      ]),
      {
        cellStyle: (row, ci, colName) => {
          if (colName === "สถานะ" && row[ci] === "เสร็จแล้ว") return { color: "var(--text-muted)" };
          return null;
        },
        actions: (idx) => {
          const o = rows[idx];
          const actions = [{ label: "แก้ไข", onClick: () => openCustomerOrderModal(o.id) }];
          if (o.done) {
            actions.push({
              label: "ยกเลิกเสร็จแล้ว",
              onClick: () => {
                DB.markCustomerOrderUndone(o.id);
                renderCustomerOrderTable();
                updateCustomerOrdersBadge();
              },
            });
          } else {
            actions.push({
              label: "เสร็จแล้ว",
              onClick: () => {
                DB.markCustomerOrderDone(o.id);
                renderCustomerOrderTable();
                updateCustomerOrdersBadge();
              },
            });
          }
          actions.push({
            label: "ลบ",
            onClick: () => {
              if (global.confirm(`ต้องการลบรายการของ "${o.customer_name || "-"}" หรือไม่?`)) {
                DB.deleteCustomerOrder(o.id);
                renderCustomerOrderTable();
                updateCustomerOrdersBadge();
              }
            },
          });
          return actions;
        },
      }
    );
    container.appendChild(table);
  }

  function refreshBankAccountsTable() {
    if (!refs.acctBankContainer) return;
    clear(refs.acctBankContainer);
    const accounts = DB.getBankAccounts();
    const totalBalance = accounts.reduce((sum, a) => sum + (a.balance || 0), 0);
    refs.acctBankContainer.appendChild(
      el("p", { text: `ยอดรวมทั้งหมด: ${money(totalBalance)} บาท`, style: { fontWeight: "600", textAlign: "right", margin: "0 0 8px" } })
    );
    refs.acctBankContainer.appendChild(
      buildDataTable(
        ["ธนาคาร", "ชื่อบัญชี", "เลขบัญชี", "ยอดคงเหลือ"],
        accounts.map((a) => [a.bank_name, a.account_name, a.account_no || "-", money(a.balance || 0)]),
        {
          actions: (idx) => {
            const a = accounts[idx];
            const acts = [
              {
                label: "รายการเคลื่อนไหว",
                onClick: () => openAccountMovementsModal(a.id),
              },
              {
                label: "ปรับยอด",
                onClick: () => openAdjustBalanceModal(a),
              },
            ];
            if (!a.is_cash) {
              acts.push({ label: "แก้ไข", onClick: () => openBankAccountModal(a) });
              acts.push({
                label: "ลบ",
                onClick: () => {
                  if (!global.confirm(`ยืนยันลบบัญชี ${a.bank_name} - ${a.account_name}?`)) return;
                  if (!DB.deleteBankAccount(a.id)) {
                    global.alert("ไม่สามารถลบบัญชีนี้ได้");
                    return;
                  }
                  refreshBankAccountsTable();
                },
              });
            }
            return acts;
          },
        }
      )
    );
  }

  function openBankAccountModal(existing) {
    const bankNameInput = textInput(existing ? existing.bank_name : "");
    const accountNameInput = textInput(existing ? existing.account_name : "");
    const accountNoInput = textInput(existing ? existing.account_no : "");
    const initialBalanceInput = existing ? null : numberInput(0);
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const bankName = bankNameInput.value.trim();
          const accountName = accountNameInput.value.trim();
          if (!bankName || !accountName) {
            global.alert("กรุณาระบุชื่อธนาคารและชื่อบัญชี");
            return;
          }
          const data = { bank_name: bankName, account_name: accountName, account_no: accountNoInput.value.trim() };
          if (existing) {
            DB.updateBankAccount(existing.id, data);
          } else {
            const newAcct = DB.createBankAccount(data);
            const initBal = Number(initialBalanceInput.value) || 0;
            if (initBal !== 0) DB.adjustBankAccountBalance(newAcct.id, initBal, "ยอดเริ่มต้นตอนเปิดบัญชี");
          }
          closeModal();
          refreshBankAccountsTable();
        },
      },
      "บันทึก"
    );
    const body = el(
      "div",
      {},
      formField("ธนาคาร", bankNameInput),
      formField("ชื่อบัญชี", accountNameInput),
      formField("เลขที่บัญชี", accountNoInput),
      existing ? el("div", {}) : formField("ยอดเริ่มต้น", initialBalanceInput),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("bankAccountForm", { bankNameInput, accountNameInput, accountNoInput, saveBtn });
    openModal(existing ? "แก้ไขบัญชีธนาคาร" : "เพิ่มบัญชีธนาคาร", body);
  }

  function openAdjustBalanceModal(account) {
    const balanceInput = numberInput(account.balance || 0);
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const newBalance = Number(balanceInput.value);
          if (isNaN(newBalance)) {
            global.alert("กรุณาระบุยอดให้ถูกต้อง");
            return;
          }
          DB.adjustBankAccountBalance(account.id, newBalance, "ปรับปรุงยอดบัญชี");
          closeModal();
          refreshBankAccountsTable();
        },
      },
      "บันทึก"
    );
    const body = el(
      "div",
      {},
      el("p", { text: `${account.bank_name} - ${account.account_name} ยอดปัจจุบัน ${money(account.balance || 0)} บาท` }),
      formField("ยอดใหม่", balanceInput),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("adjustBalanceForm", { balanceInput, saveBtn });
    openModal("ปรับยอดบัญชี", body);
  }

  function openAccountMovementsModal(accountId) {
    const acct = DB.getBankAccount(accountId);
    if (!acct) return;
    const movements = DB.getAccountMovements(accountId);
    const table = buildDataTable(
      ["วันที่", "รายการ", "จำนวนเงิน"],
      movements.map((m) => [fmtDate(m.date), m.note || m.ref_type, (m.amount >= 0 ? "+" : "") + money(m.amount)])
    );
    const body = el(
      "div",
      {},
      el("p", { text: `${acct.bank_name} - ${acct.account_name} ยอดคงเหลือ ${money(acct.balance || 0)} บาท` }),
      el("div", { class: "table-container" }, table)
    );
    openModal("รายการเคลื่อนไหวบัญชี", body);
  }

  function refreshAcctSummary() {
    const s = DB.salesSummary(acctStart, acctEnd);
    const cogs = DB.cogsSummary(acctStart, acctEnd);
    const exp = DB.expensesSummary(acctStart, acctEnd);
    const shipping = DB.shippingSummary(acctStart, acctEnd);
    const income = s.total_sales - s.total_vat - shipping;
    const netProfit = income - cogs - exp;
    clear(refs.acctSummaryBox);
    refs.acctSummaryBox.appendChild(
      el(
        "div",
        {},
        el("div", { class: "totals-line", text: `รายรับจากการขาย (ไม่รวม VAT และค่าจัดส่ง): ${money(income)} บาท (${s.n_sales} บิล)` }),
        el("div", { class: "totals-line", text: `ค่าจัดส่งที่เก็บจากลูกค้า (ไม่นับเป็นกำไร): ${money(shipping)} บาท` }),
        el("div", { class: "totals-line", text: `ต้นทุนขาย (โดยประมาณจากราคาทุนปัจจุบัน): ${money(cogs)} บาท` }),
        el("div", { class: "totals-line", text: `รายจ่ายอื่นๆ: ${money(exp)} บาท` }),
        el("div", { class: "totals-line totals-main", text: `กำไรสุทธิโดยประมาณ: ${money(netProfit)} บาท` })
      )
    );

    clear(refs.acctExpenseContainer);
    const expenses = DB.getExpenses(acctStart, acctEnd);
    refs.acctExpenseContainer.appendChild(
      buildDataTable(
        ["วันที่", "หมวดหมู่", "รายละเอียด", "จำนวนเงิน", "จ่ายจากบัญชี"],
        expenses.map((e) => {
          const acct = e.account_id ? DB.getBankAccount(e.account_id) : null;
          return [fmtDate(e.date), e.category, e.description, money(e.amount), acct ? `${acct.bank_name} - ${acct.account_name}` : "-"];
        }),
        {
          actions: (idx) => [
            {
              label: "แก้ไข",
              onClick: () => openExpenseModal(expenses[idx]),
            },
            {
              label: "ลบ",
              onClick: () => {
                if (global.confirm("ต้องการลบรายการนี้หรือไม่?")) {
                  DB.deleteExpense(expenses[idx].id);
                  refreshAcctSummary();
                  refreshBankAccountsTable();
                }
              },
            },
          ],
        }
      )
    );

    clear(refs.acctArContainer);
    refs.acctArContainer.appendChild(buildDataTable(["รหัสลูกค้า", "ชื่อลูกค้า", "ค้างชำระ"], DB.arAging().map((c) => [c.code, c.name, money(c.credit_balance)])));
    clear(refs.acctApContainer);
    refs.acctApContainer.appendChild(buildDataTable(["รหัสผู้จัดจำหน่าย", "ชื่อซัพพลายเออร์", "ค้างจ่าย"], DB.apAging().map((s) => [s.code, s.name, money(s.credit_balance)])));
  }

  function openExpenseModal(existing) {
    const catOptions = DB.getExpenseCategories();
    const existingCatName = existing ? existing.category || "" : "";
    const catOptionList = [{ value: "", label: "-- ไม่ระบุหมวดหมู่ --" }].concat(
      catOptions.map((c) => ({ value: c.name, label: c.name }))
    );
    if (existingCatName && !catOptions.find((c) => c.name === existingCatName)) {
      catOptionList.push({ value: existingCatName, label: existingCatName + " (เดิม)" });
    }
    const catSelect = selectInput(catOptionList, existingCatName);
    const manageCatBtn = el(
      "button",
      { class: "btn btn-sm", type: "button", onClick: () => openExpenseCategoryModal(() => openExpenseModal(existing)) },
      "จัดการหมวดหมู่"
    );
    const descInput = textInput(existing ? existing.description : "");
    const amountInput = numberInput(existing ? existing.amount : "");
    const accounts = DB.getBankAccounts();
    const cashAcct = DB.getCashAccount();
    const existingAccountId = existing ? existing.account_id : null;
    const accountSelect = selectInput(
      accounts.map((a) => ({ value: String(a.id), label: `${a.bank_name} - ${a.account_name}` })),
      existingAccountId ? String(existingAccountId) : (cashAcct ? String(cashAcct.id) : "")
    );
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const amt = Number(amountInput.value);
          if (!amt || amt <= 0) {
            global.alert("กรุณาระบุจำนวนเงินให้ถูกต้อง");
            return;
          }
          const accountId = accountSelect.value ? Number(accountSelect.value) : null;
          if (existing) {
            DB.updateExpense(existing.id, {
              category: catSelect.value,
              description: descInput.value.trim(),
              amount: amt,
              account_id: accountId,
              date: existing.date,
            });
          } else {
            DB.addExpense(catSelect.value, descInput.value.trim(), amt, null, accountId);
          }
          closeModal();
          refreshAcctSummary();
          refreshBankAccountsTable();
        },
      },
      "บันทึก"
    );
    const body = el(
      "div",
      {},
      formField("หมวดหมู่", el("div", { style: { display: "flex", gap: "6px", alignItems: "center" } }, catSelect, manageCatBtn)),
      formField("รายละเอียด", descInput),
      formField("จำนวนเงิน", amountInput),
      formField("จ่ายจากบัญชี", accountSelect),
      el("div", { class: "modal-actions" }, saveBtn)
    );
    exposeTestRefs("expenseForm", { catSelect, descInput, amountInput, accountSelect, saveBtn });
    openModal(existing ? "แก้ไขรายจ่าย" : "เพิ่มรายจ่าย", body);
  }

  function openExpenseCategoryModal(onClose) {
    function render() {
      const cats = DB.getExpenseCategories();
      const rows = cats.map((c) => {
        const nameInput = textInput(c.name);
        const saveRowBtn = el(
          "button",
          {
            class: "btn btn-sm",
            onClick: () => {
              const v = nameInput.value.trim();
              if (!v) {
                global.alert("กรุณาระบุชื่อหมวดหมู่");
                return;
              }
              DB.updateExpenseCategory(c.id, v);
              render();
            },
          },
          "บันทึก"
        );
        const delRowBtn = el(
          "button",
          {
            class: "btn btn-sm",
            onClick: () => {
              if (!global.confirm(`ลบหมวดหมู่ "${c.name}"? (รายจ่ายเดิมที่ใช้หมวดหมู่นี้จะไม่ถูกลบ)`)) return;
              DB.deleteExpenseCategory(c.id);
              render();
            },
          },
          "ลบ"
        );
        return el(
          "div",
          { style: { display: "flex", gap: "6px", marginBottom: "6px", alignItems: "center" } },
          nameInput,
          saveRowBtn,
          delRowBtn
        );
      });

      const newNameInput = textInput("");
      const addBtn = el(
        "button",
        {
          class: "btn btn-sm",
          onClick: () => {
            const v = newNameInput.value.trim();
            if (!v) {
              global.alert("กรุณาระบุชื่อหมวดหมู่");
              return;
            }
            DB.addExpenseCategory(v);
            newNameInput.value = "";
            render();
          },
        },
        "+ เพิ่ม"
      );
      const closeBtn = el(
        "button",
        { class: "btn btn-primary", onClick: () => (onClose ? onClose() : closeModal()) },
        "ปิด"
      );

      const body = el(
        "div",
        {},
        cats.length ? el("div", {}, ...rows) : el("p", { text: "ยังไม่มีหมวดหมู่ กรุณาเพิ่มหมวดหมู่ด้านล่าง" }),
        el("div", { style: { display: "flex", gap: "6px", marginTop: "10px", alignItems: "center" } }, newNameInput, addBtn),
        el("div", { class: "modal-actions" }, closeBtn)
      );
      exposeTestRefs("expenseCategoryForm", { newNameInput, addBtn, closeBtn });
      openModal("จัดการหมวดหมู่รายจ่าย", body);
    }
    render();
  }

  let reportStart = "";

  function renderReports() {
    const sec = sections.reports;
    clear(sec);
    reportStart = DB.monthStartStr();
    reportEnd = DB.todayStr();
    reportSubTab = "sales";

    const startInput = dateInputEl({ value: reportStart, onChange: (e) => { reportStart = e.target.value; } });
    const endInput = dateInputEl({ value: reportEnd, onChange: (e) => { reportEnd = e.target.value; } });
    const showBtn = el("button", { class: "btn", onClick: refreshReports }, "แสดงรายงาน");
    const exportSalesBtn = el("button", { class: "btn", onClick: exportSalesCsv }, "ส่งออกยอดขายเป็น CSV");
    const exportBestBtn = el("button", { class: "btn", onClick: exportBestCsv }, "ส่งออกสินค้าขายดีเป็น CSV");
    const toolbar = el(
      "div",
      { class: "toolbar" },
      el("span", { text: "จากวันที่:" }), startInput,
      el("span", { text: "ถึงวันที่:" }), endInput,
      showBtn, exportSalesBtn, exportBestBtn
    );

    const subTabsNav = el("div", { class: "subtabs" });
    const subTabButtons = {};
    [
      ["sales", "รายงานยอดขาย"],
      ["best", "สินค้าขายดี"],
      ["low", "สินค้าใกล้หมด"],
    ].forEach(([key, label]) => {
      const b = el("button", { class: "tab-btn", onClick: () => { reportSubTab = key; refreshReports(); } }, label);
      subTabButtons[key] = b;
      subTabsNav.appendChild(b);
    });
    refs.reportSubTabButtons = subTabButtons;

    const contentContainer = el("div", { class: "table-container" });
    refs.reportContentContainer = contentContainer;

    sec.appendChild(el("div", { class: "section-inner" }, toolbar, subTabsNav, contentContainer));
    refreshReports();
  }

  function refreshReports() {
    Object.keys(refs.reportSubTabButtons).forEach((k) => refs.reportSubTabButtons[k].classList.toggle("active", k === reportSubTab));
    const container = refs.reportContentContainer;
    clear(container);
    if (reportSubTab === "sales") {
      const sales = DB.getSales(reportStart, reportEnd);
      const rows = sales.map((s) => {
        const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
        return [s.sale_no, fmtDate(s.date), c ? c.name : "ลูกค้าทั่วไป", money(s.subtotal - s.discount), money(s.vat_amount), money(s.total), s.status];
      });
      container.appendChild(
        buildDataTable(["เลขที่บิล", "วันที่", "ลูกค้า", "ก่อนภาษี", "VAT", "ยอดรวม", "สถานะ"], rows, {
          cellStyle: (row, ci, colName) =>
            colName === "สถานะ" && (row[ci] === "ค้างชำระ" || row[ci] === "เงินสดแต่ค้างชำระ") ? { color: "var(--danger)", fontWeight: "600" } : null,
        })
      );
    } else if (reportSubTab === "best") {
      const best = DB.bestSellers(reportStart, reportEnd, 30);
      container.appendChild(buildDataTable(["รหัส", "ชื่อผ้า", "จำนวนที่ขาย", "ยอดขายรวม"], best.map((b) => [b.code, b.name, b.qty_sold, money(b.total_sold)])));
    } else {
      const low = DB.lowStockList();
      container.appendChild(buildDataTable(["รหัส", "ชื่อผ้า", "คงเหลือ", "จุดสั่งซื้อ", "หน่วย"], low.map((f) => [f.code, f.name, f.stock_qty, f.reorder_point, f.unit])));
    }
  }

  function exportSalesCsv() {
    const sales = DB.getSales(reportStart, reportEnd);
    const rows = [["เลขที่บิล", "วันที่", "ลูกค้า", "ก่อนภาษี", "VAT", "ยอดรวม", "ชำระแล้ว", "สถานะ"]];
    sales.forEach((s) => {
      const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
      rows.push([s.sale_no, fmtDate(s.date), c ? c.name : "ลูกค้าทั่วไป", s.subtotal - s.discount, s.vat_amount, s.total, s.paid, s.status]);
    });
    downloadCsv("sales_report.csv", rows);
  }
  function exportBestCsv() {
    const best = DB.bestSellers(reportStart, reportEnd, 1000);
    const rows = [["รหัส", "ชื่อผ้า", "จำนวนที่ขาย", "ยอดขายรวม"]];
    best.forEach((b) => rows.push([b.code, b.name, b.qty_sold, b.total_sold]));
    downloadCsv("best_sellers.csv", rows);
  }

  function openBackupModal() {
    const exportBtn = el(
      "button",
      { class: "btn", onClick: () => downloadTextFile(`siricharoen_backup_${DB.todayStr()}.json`, DB.exportBackup()) },
      "ดาวน์โหลดไฟล์สำรองข้อมูล (.json)"
    );
    const fileInput = el("input", { type: "file", accept: ".json" });
    const importBtn = el(
      "button",
      {
        class: "btn btn-danger",
        onClick: () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) {
            global.alert("กรุณาเลือกไฟล์สำรองข้อมูล (.json)");
            return;
          }
          if (!global.confirm("การนำเข้าข้อมูลจะเขียนทับข้อมูลปัจจุบันทั้งหมด ยืนยันหรือไม่?")) return;
          const reader = new global.FileReader();
          reader.onload = async () => {
            try {
              DB.importBackup(reader.result);
              // ต้องอัปโหลดข้อมูลที่กู้คืนขึ้นคลาวด์ให้เสร็จก่อนรีเฟรชหน้า มิฉะนั้นตอนรีเฟรช
              // ระบบจะไปดึงข้อมูลเก่าบนคลาวด์ (ที่ยังไม่ได้อัปเดต) กลับมาทับข้อมูลที่เพิ่งกู้คืนทันที
              if (DB.pushToCloud) {
                await DB.pushToCloud();
              }
              if (DB.getCloudStatus && DB.getCloudStatus() === "error") {
                global.alert(
                  "นำเข้าข้อมูลในเครื่องสำเร็จ แต่อัปโหลดขึ้นคลาวด์ไม่สำเร็จ (เช็คอินเทอร์เน็ต)\nกรุณาอย่าเพิ่งรีเฟรชหน้า ให้ลองกดนำเข้าไฟล์เดิมซ้ำอีกครั้งจนกว่าจะอัปโหลดสำเร็จ ไม่เช่นนั้นข้อมูลที่กู้คืนจะหายไปตอนรีเฟรช"
                );
                return;
              }
              global.alert("นำเข้าข้อมูลสำเร็จ กรุณารีเฟรชหน้าเว็บ");
              global.location.reload();
            } catch (e) {
              global.alert("ไฟล์ไม่ถูกต้อง: " + e.message);
            }
          };
          reader.readAsText(file);
        },
      },
      "นำเข้าข้อมูลจากไฟล์สำรอง"
    );
    const body = el(
      "div",
      {},
      el("p", { text: "ควรดาวน์โหลดไฟล์สำรองข้อมูลเก็บไว้เป็นระยะ เผื่อกรณีเบราว์เซอร์ล้างข้อมูลหรือเปลี่ยนเครื่อง" }),
      exportBtn,
      el("hr"),
      el("p", { text: "นำเข้าข้อมูลจากไฟล์สำรอง (จะเขียนทับข้อมูลปัจจุบัน)" }),
      fileInput,
      importBtn
    );
    exposeTestRefs("backup", { exportBtn, fileInput, importBtn });
    openModal("สำรอง / กู้คืนข้อมูล", body, { wide: true });
  }

  // ==================================================================== init
  function init() {
    const layoutRoot = buildLayout();
    global.document.body.appendChild(layoutRoot);
    global.document.body.appendChild(buildModal());

    renderers.dashboard = renderDashboard;
    renderers.pos = renderPOS;
    renderers.posVat = renderPOSVat;
    renderers.stock = renderStock;
    renderers.customers = renderCustomers;
    renderers.suppliers = renderSuppliers;
    renderers.purchases = renderPurchases;
    renderers.backorders = renderBackorders;
    renderers.customerOrders = renderCustomerOrders;
    renderers.accounting = renderAccounting;
    renderers.reports = renderReports;

    switchTab("dashboard");

    function runBulkImportFabrics() {
      // นำเข้ารายการผ้าที่เตรียมไว้ (BULK_IMPORT_FABRICS) อัตโนมัติทุกครั้งที่เปิดโปรแกรม ไม่ต้องกดปุ่มเอง
      // ทำหลังจากดึงข้อมูลคลาวด์เสร็จแล้วเท่านั้น กันไม่ให้แข่งกับการซิงค์คลาวด์แล้วอัปโหลดข้อมูลไม่ครบขึ้นไปทับของจริง
      if (BULK_IMPORT_FABRICS.length) {
        try {
          importBulkFabrics({ silent: true });
        } catch (e) {
          // ไม่ให้การนำเข้าล้มเหลวไปกระทบการเปิดแอปหลัก
        }
      }
    }

    // ===== ซิงค์ข้อมูลกับคลาวด์ (Supabase) =====
    // แสดงข้อมูลจาก localStorage ก่อนทันที (โหลดเร็ว/ใช้งานได้แม้ออฟไลน์)
    // แล้วดึงข้อมูลล่าสุดจากคลาวด์มาซ้อนทับ + รีเฟรชหน้าจอเมื่อโหลดเสร็จ
    function updateCloudBadge() {
      if (!refs.cloudBadge) return;
      const status = DB.getCloudStatus ? DB.getCloudStatus() : "offline";
      const labels = {
        connecting: "คลาวด์: กำลังเชื่อมต่อ...",
        synced: "คลาวด์: ซิงค์แล้ว ✓",
        error: "คลาวด์: ผิดพลาด",
        conflict: "คลาวด์: ข้อมูลไม่ตรงกัน กู้คืนแล้ว",
        offline: "คลาวด์: ออฟไลน์",
      };
      refs.cloudBadge.textContent = labels[status] || "คลาวด์: ไม่ทราบสถานะ";
    }
    if (DB.setCloudSyncListener) {
      DB.setCloudSyncListener(() => {
        switchTab(currentTab);
        updateCloudBadge();
      });
    }
    updateCloudBadge();
    if (DB.pullFromCloud) {
      DB.pullFromCloud().then(() => {
        runBulkImportFabrics();
        switchTab(currentTab);
        updateCloudBadge();
      });
    } else {
      runBulkImportFabrics();
    }
    global.setInterval(updateCloudBadge, 2000);
  }

  const api = {
    init, DB, VAT_ENABLED, VAT_RATE,
    switchTab,
    refs,
    getCart: () => cart,
    openFabricModal, openAdjustStockModal, openMovementsModal, openRollCountModal,
    openCustomerModal, openCustomerHistoryModal, openCustomerPayModal,
    openSupplierModal, openSupplierPayModal,
    openPurchaseModal, openPurchaseItemsModal, openPurchasePayModal,
    openExpenseModal, openSettingsModal, openBackupModal,
    checkout, addPosRow, posRowSetFabric,
    editSalePOS, cancelEditSalePOS, reprintSalePOS, deleteSalePOS, openMarkSalePaidModal,
    renderStockTable, renderCustomerTable, renderSupplierTable, renderPurchaseTable,
    renderPosItemsTable, renderPosSalesHistory, refreshAcctSummary, refreshReports,
    closeModal,
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }

  // ===== รหัสผ่านสำหรับเข้าผ่านลิงก์ออนไลน์ (กันคนทั่วไปที่บังเอิญเจอลิงก์) =====
  var LINK_PASSWORD = "Sirichareon2518";
  var LINK_AUTH_KEY = "sc_link_pw_ok";

  function hidePasswordGate() {
    var overlay = global.document.getElementById("scPasswordGate");
    if (overlay) overlay.remove();
  }

  function setupPasswordGate() {
    var overlay = global.document.getElementById("scPasswordGate");
    if (!overlay) {
      init();
      return;
    }
    var input = global.document.getElementById("scPasswordInput");
    var btn = global.document.getElementById("scPasswordSubmit");
    var err = global.document.getElementById("scPasswordError");
    function tryLogin() {
      if (input.value === LINK_PASSWORD) {
        try {
          localStorage.setItem(LINK_AUTH_KEY, "1");
        } catch (e) {}
        hidePasswordGate();
        init();
      } else {
        err.style.display = "block";
        input.value = "";
        input.focus();
      }
    }
    btn.addEventListener("click", tryLogin);
    input.addEventListener("keydown", function (e) {
      if (e.key === "Enter") tryLogin();
    });
    input.focus();
  }

  function bootWithPasswordGate() {
    var alreadyOk = false;
    try {
      alreadyOk = localStorage.getItem(LINK_AUTH_KEY) === "1";
    } catch (e) {}
    if (alreadyOk) {
      hidePasswordGate();
      init();
    } else {
      setupPasswordGate();
    }
  }

  if (typeof global.window !== "undefined") {
    global.window.SiriCharoenApp = api;
    if (global.document.readyState === "loading") {
      global.document.addEventListener("DOMContentLoaded", bootWithPasswordGate);
    } else {
      bootWithPasswordGate();
    }
  }
})(typeof window !== "undefined" ? window : global);
</script>

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((e) => {
        console.error("Service worker registration failed:", e);
      });
    });
  }
</script>
