        onClick: () => {
          if (formatSelect.value === "xlsx") {
            downloadBackupXlsx(`siricharoen_backup_${DB.todayStr()}.xlsx`);
          } else if (formatSelect.value === "csv") {
            downloadTextFile(`siricharoen_backup_${DB.todayStr()}.csv`, DB.exportBackupCsv());
          } else {
            downloadTextFile(`siricharoen_backup_${DB.todayStr()}.json`, DB.exportBackup());
          }
        },
      },
      "ดาวน์โหลดไฟล์สำรองข้อมูล"
    );
    const fileInput = el("input", { type: "file", accept: ".json" });
    const importBtn = el(
      "button",
      {
        class: "btn btn-danger",
        onClick: () => {
          const file = fileInput.files && fileInput.files[0];
          if (!file) {
            global.alert("กรุณาเลือกไฟล์สำรองข้อมูล (.json)");
            return;
          }
          if (!global.confirm("การนำเข้าข้อมูลจะเขียนทับข้อมูลปัจจุบันทั้งหมด ยืนยันหรือไม่?")) return;
          const reader = new global.FileReader();
          reader.onload = async () => {
            try {
              DB.importBackup(reader.result);
              // ต้องอัปโหลดข้อมูลที่กู้คืนขึ้นคลาวด์ให้เสร็จก่อนรีเฟรชหน้า มิฉะนั้นตอนรีเฟรช
              // ระบบจะไปดึงข้อมูลเก่าบนคลาวด์ (ที่ยังไม่ได้อัปเดต) กลับมาทับข้อมูลที่เพิ่งกู้คืนทันที
              if (DB.pushToCloud) {
                await DB.pushToCloud();
              }
              if (DB.getCloudStatus && DB.getCloudStatus() === "error") {
                global.alert(
                  "นำเข้าข้อมูลในเครื่องสำเร็จ แต่อัปโหลดขึ้นคลาวด์ไม่สำเร็จ (เช็คอินเทอร์เน็ต)\nกรุณาอย่าเพิ่งรีเฟรชหน้า ให้ลองกดนำเข้าไฟล์เดิมซ้ำอีกครั้งจนกว่าจะอัปโหลดสำเร็จ ไม่เช่นนั้นข้อมูลที่กู้คืนจะหายไปตอนรีเฟรช"
                );
                return;
              }
              global.alert("นำเข้าข้อมูลสำเร็จ กรุณารีเฟรชหน้าเว็บ");
              global.location.reload();
            } catch (e) {
              global.alert("ไฟล์ไม่ถูกต้อง: " + e.message);
            }
          };
          reader.readAsText(file);
        },
      },
      "นำเข้าข้อมูลจากไฟล์สำรอง"
    );
    const body = el(
      "div",
      {},
      el("p", { text: "ควรดาวน์โหลดไฟล์สำรองข้อมูลเก็บไว้เป็นระยะ เผื่อกรณีเบราว์เซอร์ล้างข้อมูลหรือเปลี่ยนเครื่อง" }),
      formField("ประเภทไฟล์", formatSelect),
      exportBtn,
      el("p", { class: "muted", style: { fontSize: "13px" }, text: "หมายเหตุ: ไฟล์ .xlsx และ .csv ใช้สำหรับเปิดดู/ตรวจสอบข้อมูลเท่านั้น (ไฟล์ .xlsx แบ่งเป็น worksheet ตามหน้าเมนู) การนำเข้ากู้คืนข้อมูลด้านล่างต้องใช้ไฟล์ .json เท่านั้น" }),
      el("hr"),
      el("p", { text: "นำเข้าข้อมูลจากไฟล์สำรอง (จะเขียนทับข้อมูลปัจจุบัน)" }),
      fileInput,
      importBtn
    );
    exposeTestRefs("backup", { exportBtn, formatSelect, fileInput, importBtn });
    openModal("สำรอง / กู้คืนข้อมูล", body, { wide: true });
  }

  // ==================================================================== init
  function init() {
    const layoutRoot = buildLayout();
    global.document.body.appendChild(layoutRoot);
    global.document.body.appendChild(buildModal());

    renderers.dashboard = renderDashboard;
    renderers.pos = renderPOS;
    renderers.stock = renderStock;
    renderers.customers = renderCustomers;
    renderers.suppliers = renderSuppliers;
    renderers.purchases = renderPurchases;
    renderers.backorders = renderBackorders;
    renderers.customerOrders = renderCustomerOrders;
    renderers.quotations = renderQuotations;
    renderers.accounting = renderAccounting;
    renderers.reports = renderReports;

    switchTab("dashboard");

    function runBulkImportFabrics() {
      // นำเข้ารายการผ้าที่เตรียมไว้ (BULK_IMPORT_FABRICS) อัตโนมัติทุกครั้งที่เปิดโปรแกรม ไม่ต้องกดปุ่มเอง
      // ทำหลังจากดึงข้อมูลคลาวด์เสร็จแล้วเท่านั้น กันไม่ให้แข่งกับการซิงค์คลาวด์แล้วอัปโหลดข้อมูลไม่ครบขึ้นไปทับของจริง
      if (BULK_IMPORT_FABRICS.length) {
        try {
          importBulkFabrics({ silent: true });
        } catch (e) {
          // ไม่ให้การนำเข้าล้มเหลวไปกระทบการเปิดแอปหลัก
        }
      }
    }

    // ===== ซิงค์ข้อมูลกับคลาวด์ (Supabase) =====
    // แสดงข้อมูลจาก localStorage ก่อนทันที (โหลดเร็ว/ใช้งานได้แม้ออฟไลน์)
    // แล้วดึงข้อมูลล่าสุดจากคลาวด์มาซ้อนทับ + รีเฟรชหน้าจอเมื่อโหลดเสร็จ
    function updateCloudBadge() {
      if (!refs.cloudBadge) return;
      const status = DB.getCloudStatus ? DB.getCloudStatus() : "offline";
      const labels = {
        connecting: "คลาวด์: กำลังเชื่อมต่อ...",
        synced: "คลาวด์: ซิงค์แล้ว ✓",
        error: "คลาวด์: ผิดพลาด",
        conflict: "คลาวด์: ข้อมูลไม่ตรงกัน กู้คืนแล้ว",
        offline: "คลาวด์: ออฟไลน์",
      };
      refs.cloudBadge.textContent = labels[status] || "คลาวด์: ไม่ทราบสถานะ";
    }
    if (DB.setCloudSyncListener) {
      DB.setCloudSyncListener(() => {
        switchTab(currentTab);
        updateCloudBadge();
      });
    }
    updateCloudBadge();
    if (DB.pullFromCloud) {
      DB.pullFromCloud().then(() => {
        runBulkImportFabrics();
        switchTab(currentTab);
        updateCloudBadge();
      });
    } else {
      runBulkImportFabrics();
    }
    global.setInterval(updateCloudBadge, 2000);
  }

  const api = {
    init, DB, VAT_ENABLED, VAT_RATE,
    switchTab,
    refs,
    getCart: () => cart,
    openFabricModal, openAdjustStockModal, openMovementsModal,
    openCustomerModal, openCustomerHistoryModal, openCustomerPayModal,
    openSupplierModal, openSupplierPayModal,
    openPurchaseModal, openPurchaseItemsModal, openPurchasePayModal,
    openExpenseModal, openSettingsModal, openBackupModal,
    checkout, addPosRow, posRowSetFabric,
    editSalePOS, cancelEditSalePOS, reprintSalePOS, deleteSalePOS, openMarkSalePaidModal,
    renderStockTable, renderCustomerTable, renderSupplierTable, renderPurchaseTable,
    renderPosItemsTable, renderPosSalesHistory, refreshAcctSummary, refreshReports,
    closeModal,
  };

  if (typeof module !== "undefined" && module.exports) {
    module.exports = api;
  }

  // ============================================================ เข้าสู่ระบบ
  // ป้องกันไม่ให้คนแปลกหน้าที่มี anon key เข้าถึงข้อมูลร้านได้โดยไม่ล็อกอิน (RLS บน Supabase บังคับให้ต้องล็อกอินก่อนถึงจะอ่าน/แก้ไขข้อมูลได้)
  // เช็คว่าเครื่องนี้เคยล็อกอินไว้แล้วหรือไม่ (มี session ของ Supabase เก็บอยู่ใน localStorage) แบบไม่ต้องรอเน็ตเวิร์ก
  // เพื่อให้เครื่องที่เคยล็อกอินแล้วยังเปิดแอปได้ทันทีแม้ออฟไลน์ (ตามฟีเจอร์ offline เดิม) มีแค่เครื่องใหม่ที่ไม่เคยล็อกอินเท่านั้นที่จะเจอหน้าเข้าสู่ระบบ
  function hasStoredSupabaseSession() {
    try {
      for (let i = 0; i < global.localStorage.length; i++) {
        const k = global.localStorage.key(i);
        if (k && k.indexOf("sb-") === 0 && k.indexOf("-auth-token") !== -1 && global.localStorage.getItem(k)) {
          return true;
        }
      }
    } catch (e) {}
    return false;
  }

  function showLoginScreen() {
    const overlay = el("div", { class: "modal-overlay", style: { zIndex: "2000" } });
    const errorMsg = el("div", { style: { color: "var(--danger, #c0392b)", minHeight: "18px", fontSize: "13px", marginTop: "4px" } });
    const emailInput = textInput("");
    emailInput.type = "email";
    emailInput.placeholder = "อีเมล";
    const passInput = textInput("");
    passInput.type = "password";
    passInput.placeholder = "รหัสผ่าน";
    const submitBtn = el("button", { class: "btn btn-primary btn-block" }, "เข้าสู่ระบบ");

    async function doLogin() {
      errorMsg.textContent = "";
      const email = emailInput.value.trim();
      const password = passInput.value;
      if (!email || !password) {
        errorMsg.textContent = "กรุณากรอกอีเมลและรหัสผ่าน";
        return;
      }
      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังเข้าสู่ระบบ...";
      try {
        const { error } = await global.__supabaseClient__.auth.signInWithPassword({ email, password });
        if (error) {
          errorMsg.textContent = "อีเมลหรือรหัสผ่านไม่ถูกต้อง";
          submitBtn.disabled = false;
          submitBtn.textContent = "เข้าสู่ระบบ";
          return;
        }
        overlay.remove();
        init();
      } catch (e) {
        errorMsg.textContent = "เชื่อมต่อไม่สำเร็จ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่ (ต้องมีเน็ตตอนเข้าสู่ระบบครั้งแรก)";
        submitBtn.disabled = false;
        submitBtn.textContent = "เข้าสู่ระบบ";
      }
    }
    submitBtn.addEventListener("click", doLogin);
    passInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
    emailInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") passInput.focus();
    });

    const box = el(
      "div",
      { class: "modal-box", style: { maxWidth: "380px" } },
      el("div", { class: "modal-header" }, el("h2", {}, "เข้าสู่ระบบร้านผ้าศิริเจริญ")),
      el(
        "div",
        { class: "modal-body" },
        formField("อีเมล", emailInput),
        formField("รหัสผ่าน", passInput),
        errorMsg,
        submitBtn
      )
    );
    overlay.appendChild(box);
    global.document.body.appendChild(overlay);
    emailInput.focus();
  }

  async function signOut() {
    if (!global.__supabaseClient__) return;
    if (!global.confirm("ต้องการออกจากระบบหรือไม่?")) return;
    try {
      await global.__supabaseClient__.auth.signOut();
    } catch (e) {}
    global.location.reload();
  }

  function bootWithAuth() {
    if (!global.__supabaseClient__) {
      init();
      return;
    }
    if (hasStoredSupabaseSession()) {
      init();
    } else {
      showLoginScreen();
    }
    try {
      global.__supabaseClient__.auth.onAuthStateChange((event) => {
        if (event === "SIGNED_OUT") global.location.reload();
      });
    } catch (e) {}
  }
if (typeof global.window !== "undefined") {
    global.window.SiriCharoenApp = api;
    // ป้องกันเผลอเลื่อนเมาส์แล้วค่าตัวเลขในช่องกรอกเปลี่ยนไปโดยไม่ตั้งใจ: เอาโฟกัสออกจากช่องตัวเลขทันทีที่มีการเลื่อนเมาส์
    global.document.addEventListener(
      "wheel",
      (e) => {
        const el = global.document.activeElement;
        if (el && el.tagName === "INPUT" && el.type === "number") el.blur();
      },
      { passive: true }
    );
    if (global.document.readyState === "loading") {
      global.document.addEventListener("DOMContentLoaded", bootWithAuth);
    } else {
      bootWithAuth();
    }
  }
})(typeof window !== "undefined" ? window : global);
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((e) => {
        console.error("Service worker registration failed:", e);
      });
    });
  }
</script>
</body>
