  function openSaleDetailModal(saleId) {
    const s = DB.getSale(saleId);
    if (!s) return;
    const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
    const itemRows = s.items.map((it) => {
      if (it.is_misc) {
        return ["-", `${it.name || ""} (ฝากซื้อ)`, it.note || "", it.qty, it.unit || "", money(it.unit_price), money(it.qty * it.unit_price)];
      }
      const f = DB.getFabric(it.fabric_id);
      return [
        f ? f.code : "-",
        f ? f.name : "(สินค้านี้ถูกลบแล้ว)",
        it.note || "",
        it.qty,
        it.unit || (f ? f.unit : ""),
        money(it.unit_price),
        money(it.qty * it.unit_price),
      ];
    });
    const itemsTable = buildDataTable(["รหัสผ้า", "ชื่อผ้า", "โน้ต", "จำนวน", "หน่วย", "ราคา/หน่วย", "รวม"], itemRows);
    const infoLines = [
      `เลขที่บิล: ${s.sale_no}`,
      `วันที่: ${fmtDate(s.date)}`,
      `ลูกค้า: ${c ? c.name : "ลูกค้าทั่วไป"}`,
      `ชำระโดย: ${s.payment_method === "เงินเชื่อ" ? "เครดิต" : s.payment_method}`,
      `สถานะ: ${s.status}`,
    ];
    if (s.due_date) infoLines.push(`วันที่ครบกำหนดชำระเงิน: ${fmtDate(s.due_date)}`);
    if (s.shipping_method) infoLines.push(`วิธีจัดส่ง: ${s.shipping_method}`);
    if (s.note) infoLines.push(`หมายเหตุ: ${s.note}`);
    const infoBlock = el("div", { style: { marginBottom: "10px" } }, ...infoLines.map((t) => el("div", { text: t })));
    const totalsBlock = el(
      "div",
      { class: "totals-line", style: { marginTop: "10px" } },
      el("div", { text: `ยอดรวมก่อนหักส่วนลด: ${money(s.subtotal)} บาท` }),
      s.discount ? el("div", { text: `ส่วนลด: ${money(s.discount)} บาท` }) : null,
      s.shipping_fee ? el("div", { text: `ค่าจัดส่ง: ${money(s.shipping_fee)} บาท` }) : null,
      s.vat_amount ? el("div", { text: `ภาษีมูลค่าเพิ่ม: ${money(s.vat_amount)} บาท` }) : null,
      el("div", { text: `ยอดสุทธิ: ${money(s.total)} บาท`, style: { fontWeight: "600" } }),
      el("div", { text: `ชำระแล้ว: ${money(s.paid)} บาท` }),
      s.total - s.paid > 0
        ? el("div", {
            text: `ค้างชำระ: ${money(s.total - s.paid)} บาท`,
            style: { color: "var(--danger)", fontWeight: "600" },
          })
        : null
    );
    const body = el("div", {}, infoBlock, itemsTable, totalsBlock);
    openModal(`รายละเอียดบิล - ${s.sale_no}`, body, { wide: true });
  }

  function renderPosSalesHistory() {
    const container = refs.posHistoryTableContainer;
    if (!container) return;
    clear(container);
    let sales = DB.getSales();
    if (!posHistoryShowAll) {
      const fromDate = posHistoryDate || DB.todayStr();
      const toDate = posHistoryDateTo || DB.todayStr();
      sales = sales.filter((s) => {
        const d = s.date.slice(0, 10);
        return d >= fromDate && d <= toDate;
      });
    }
    if (posHistoryUnpaidOnly || posHistoryUnpaidOnlyCash) {
      sales = sales.filter(
        (s) =>
          (posHistoryUnpaidOnly && s.status === "ค้างชำระ") ||
          (posHistoryUnpaidOnlyCash && s.status === "เงินสดแต่ค้างชำระ")
      );
    }
    const historyQ = posHistorySearch.trim().toLowerCase();
    if (historyQ) {
      sales = sales.filter((s) => {
        const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
        const custName = c ? c.name : "ลูกค้าทั่วไป";
        return (s.sale_no || "").toLowerCase().includes(historyQ) || custName.toLowerCase().includes(historyQ);
      });
    }
    if (refs.posHistorySummary) {
      const totalAmount = sales.reduce((sum, s) => sum + s.total, 0);
      const totalShipping = sales.reduce((sum, s) => sum + (s.shipping_fee || 0), 0);
      refs.posHistorySummary.textContent =
        `รวม ${sales.length} บิล ยอดขายรวม ${money(totalAmount)} บาท` +
        (totalShipping ? ` (ค่าส่งรวม ${money(totalShipping)} บาท)` : "");
    }

    const thead = el(
      "thead",
      {},
      el(
        "tr",
        {},
        el("th", { text: "เลขที่บิล" }),
        el("th", { text: "วันที่" }),
        el("th", { text: "ลูกค้า" }),
        el("th", { text: "ยอดรวม" }),
        el("th", { text: "ภาษีมูลค่าเพิ่ม" }),
        el("th", { text: "สถานะ" }),
        el("th", { text: "วิธีจัดส่ง" }),
        el("th", { text: "จัดการ" })
      )
    );
    const tbody = el("tbody", {});

    if (sales.length === 0) {
      tbody.appendChild(el("tr", {}, el("td", { colspan: 8, class: "empty", text: "ไม่มีข้อมูล" })));
    }

    sales.forEach((s) => {
      const c = s.customer_id ? DB.getCustomer(s.customer_id) : null;
      const actionsCell = el(
        "td",
        { class: "actions-cell" },
        el("button", { class: "btn btn-sm", onClick: () => editSalePOS(s.id) }, "แก้ไข"),
        s.status !== "ชำระแล้ว"
          ? el(
              "button",
              {
                class: "btn btn-sm",
                onClick: () => openMarkSalePaidModal(s.id),
              },
              "ชำระแล้ว"
            )
          : null,
        el("button", { class: "btn btn-sm", onClick: () => reprintSalePOS(s.id) }, "พิมพ์ใบเสร็จ"),
        el("button", { class: "btn btn-sm", onClick: () => openProductReturnModal(s.id) }, "รับคืนสินค้า"),
        el("button", { class: "btn btn-sm", onClick: () => deleteSalePOS(s.id) }, "ลบ")
      );
      const isUnpaidStatus = s.status === "ค้างชำระ" || s.status === "เงินสดแต่ค้างชำระ";
      const paidLabel =
        s.status === "ชำระแล้ว" && s.paid_method
          ? s.paid_method === "โอนเงิน" && (s.bank_name || s.bank_account_name)
            ? `${s.status} (${s.paid_method}: ${[s.bank_name, s.bank_account_name].filter(Boolean).join(" ")})`
            : `${s.status} (${s.paid_method})`
          : isUnpaidStatus && s.due_date
          ? `${s.status} (ครบกำหนด ${fmtDate(s.due_date)})`
          : s.status;
      const statusCell = el("td", {
        text: paidLabel,
        style: isUnpaidStatus ? { color: "var(--danger)", fontWeight: "600" } : {},
      });
      const totalCell = s.shipping_fee
        ? el(
            "td",
            {},
            el("div", { text: `ก่อนค่าส่ง ${money(s.total - s.shipping_fee)}` }),
            el("div", { text: `รวมค่าส่ง ${money(s.total)}` })
          )
        : el("td", { text: money(s.total) });
      const saleNoCell = el(
        "td",
        {},
        el(
          "button",
          { class: `btn btn-sm ${isUnpaidStatus ? "btn-danger" : "btn-primary"}`, onClick: () => openSaleDetailModal(s.id) },
          s.sale_no
        )
      );
      const tr = el(
        "tr",
        {},
        saleNoCell,
        el("td", { text: fmtDate(s.date) }),
        el("td", {
          text:
            c && DB.getCustomerTotalDue(c) > 0
              ? `${c.name} (ค้างชำระ ${money(DB.getCustomerTotalDue(c))})`
              : c
              ? c.name
              : "ลูกค้าทั่วไป",
        }),
        totalCell,
        el("td", { text: s.vat_amount ? money(s.vat_amount) : "-" }),
        statusCell,
        el("td", { text: s.shipping_method || "-" }),
        actionsCell
      );
      tbody.appendChild(tr);
    });

    const table = el("table", { class: "data-table" }, thead, tbody);
    container.appendChild(table);
  }

  function deleteSalePOS(saleId) {
    const sale = DB.getSale(saleId);
    if (!sale) return;
    if (!global.confirm(`ยืนยันลบบิลเลขที่ ${sale.sale_no} ยอดรวม ${money(sale.total)} บาท? สต็อกและยอดค้างชำระ (ถ้ามี) จะถูกคืนกลับให้อัตโนมัติ`)) return;
    if (editingSaleId === saleId) {
      cancelEditSalePOS();
    }
    DB.deleteSale(saleId);
    renderPosSalesHistory();
    global.alert(`ลบบิลเลขที่ ${sale.sale_no} เรียบร้อยแล้ว`);
  }

  function openMarkSalePaidModal(saleId, refreshFn) {
    const refresh = refreshFn || renderPosSalesHistory;
    const sale = DB.getSale(saleId);
    if (!sale) return;
    const remain = sale.total - sale.paid;
    // ใช้บัญชีที่ลูกค้าเคยเลือก/ที่แนะนำไว้ในใบเสร็จเป็นค่าเริ่มต้น จะได้ไม่ต้องเลื่อนหาบัญชีซ้ำตอนบันทึกว่าโอนเข้าบัญชีไหน
    const cust = sale.customer_id ? DB.getCustomer(sale.customer_id) : null;
    const preferredAccountId = getCustomerPreferredAccountId(cust);
    const methodSelect = selectInput(
      [
        { value: "เงินสด", label: "เงินสด" },
        { value: "โอนเงิน", label: "โอนเงิน" },
      ],
      "เงินสด"
    );
    const accountSplit = buildAccountSplitRows(remain, preferredAccountId);
    const accountSplitRow = formField("บัญชีที่รับโอน (แบ่งหลายบัญชีได้)", el("div", {}, accountSplit.container, accountSplit.addBtn));
    function updateBankRowsVisibility() {
      const isTransfer = methodSelect.value === "โอนเงิน";
      accountSplitRow.style.display = isTransfer ? "" : "none";
    }
    methodSelect.addEventListener("change", updateBankRowsVisibility);
    updateBankRowsVisibility();

    const form = el(
      "div",
      { class: "form-panel" },
      el("p", { text: `บิลเลขที่ ${sale.sale_no} ยอดค้างชำระ ${money(remain)} บาท` }),
      formField("ชำระโดย", methodSelect),
      accountSplitRow
    );
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const method = methodSelect.value;
          let accountSplits = null;
          if (method === "โอนเงิน") {
            accountSplits = accountSplit.getSplits();
            // ถ้ายอดค้างชำระเป็น 0 อยู่แล้ว (เช่น แก้ไขบิลจนยอดพอดีกับที่จ่ายไปแล้ว แต่สถานะยังไม่ขึ้น "ชำระแล้ว")
            // ไม่ต้องบังคับให้เลือกบัญชี/กรอกจำนวนเงิน เพราะไม่มีเงินที่ต้องโอนจริงแล้ว แค่ต้องการอัปเดตสถานะให้ตรง
            if (remain > 0) {
              if (accountSplits.length === 0) {
                global.alert("กรุณาเลือกบัญชีที่รับโอน และระบุจำนวนเงิน");
                return;
              }
              const splitTotal = accountSplit.getTotal();
              if (splitTotal !== remain) {
                global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดค้างชำระ (${money(remain)}) กรุณาตรวจสอบ`);
                return;
              }
              if (accountSplits.length === 1) rememberCustomerAccount(cust, String(accountSplits[0].account_id));
            }
          }
          DB.markSalePaid(saleId, method, accountSplits);
          closeModal();
          refresh();
        },
      },
      "บันทึกการชำระเงิน"
    );
    exposeTestRefs("markSalePaid", { methodSelect, accountSplit, saveBtn });
    openModal("บันทึกการชำระเงิน", el("div", {}, form, el("div", { class: "modal-actions" }, saveBtn)));
  }

  // สร้างและเปิดตัวอย่างใบเสร็จสำหรับผ้าที่ให้ลูกค้าแทนตอนเปลี่ยนของ (ใช้ได้ทั้งตอนบันทึกใหม่ และย้อนดูประวัติภายหลัง)
  function printExchangeReceipt(ret) {
    if (!ret.exchange_items || ret.exchange_items.length === 0) {
      global.alert("รายการคืนนี้ไม่มีผ้าที่เปลี่ยนให้ลูกค้า");
      return;
    }
    const cartItems = ret.exchange_items.map((it) => ({
      code: it.code || "",
      name: it.name || "",
      qty: it.qty,
      unit_price: it.unit_price,
      unit: it.unit,
      note: "",
    }));
    const exchangeSubtotal = round2(ret.exchange_items.reduce((s, it) => s + it.qty * it.unit_price, 0));
    const pseudoSale = {
      id: `return-${ret.id}`,
      sale_no: `${ret.sale_no}-EX${ret.id}`,
      date: ret.date,
      customer_id: ret.customer_id,
      subtotal: exchangeSubtotal,
      discount: 0,
      vat_amount: 0,
      is_vat: false,
      shipping_fee: 0,
      shipping_method: "",
      total: exchangeSubtotal,
      paid: exchangeSubtotal,
      payment_method: "เงินสด",
      note: `ใบเสร็จผ้าที่เปลี่ยนแทน (จากการคืนสินค้าบิล ${ret.sale_no})`,
    };
    showReceiptModal(pseudoSale, ret.customer_id, cartItems);
  }

  function openProductReturnModal(saleId, refreshFn) {
    const refresh = refreshFn || renderPosSalesHistory;
    const sale = DB.getSale(saleId);
    if (!sale) return;
    const cust = sale.customer_id ? DB.getCustomer(sale.customer_id) : null;
    const remain = sale.total - sale.paid;

    // รายการผ้าที่ยังคืนได้ (ไม่รวมรายการฝากซื้อ และไม่รวมของที่คืนครบแล้ว)
    const rows = sale.items
      .filter((it) => !it.is_misc && it.fabric_id)
      .map((it) => {
        const returned = DB.getReturnedQtyForItem(saleId, it.fabric_id);
        const maxReturnable = Math.round((it.qty - returned) * 100) / 100;
        const fabric = DB.getFabric(it.fabric_id);
        const code = it.code || (fabric ? fabric.code : "") || "";
        const name = it.name || (fabric ? fabric.name : "") || "";
        return { item: it, returned, maxReturnable, code, name };
      })
      .filter((r) => r.maxReturnable > 0);

    const qtyInputs = [];
    let bodyChildren = [];

    if (rows.length === 0) {
      bodyChildren.push(el("p", { text: "ไม่มีรายการผ้าที่คืนได้แล้ว (คืนครบทุกชิ้นแล้ว หรือบิลนี้มีแต่รายการฝากซื้อ)" }));
    } else {
      const table = el(
        "table",
        { class: "data-table" },
        el(
          "thead",
          {},
          el(
            "tr",
            {},
            el("th", { text: "รหัส - ชื่อผ้า" }),
            el("th", { text: "ซื้อไป" }),
            el("th", { text: "คืนแล้ว" }),
            el("th", { text: "คืนได้อีก" }),
            el("th", { text: "จำนวนที่จะคืน" })
          )
        ),
        el(
          "tbody",
          {},
          ...rows.map((r) => {
            const qtyInput = numberInput(0);
            qtyInput.addEventListener("input", updatePreview);
            qtyInputs.push({ fabric_id: r.item.fabric_id, unit_price: r.item.unit_price, input: qtyInput, maxReturnable: r.maxReturnable });
            return el(
              "tr",
              {},
              el("td", { text: `${r.code} - ${r.name}` }),
              el("td", { text: `${round3(r.item.qty)} ${r.item.unit}` }),
              el("td", { text: `${round3(r.returned)} ${r.item.unit}` }),
              el("td", { text: `${round3(r.maxReturnable)} ${r.item.unit}` }),
              el("td", {}, qtyInput)
            );
          })
        )
      );
      bodyChildren.push(table);
    }

    const methodSelect = selectInput(
      [
        { value: "หักลดหนี้", label: "หักลดหนี้ (ลดยอดค้างชำระของบิลนี้)" },
        { value: "คืนเงินสด", label: "คืนเงินสด/โอน (จ่ายเงินคืนออกจากบัญชี)" },
        { value: "เปลี่ยนของ", label: "เปลี่ยนของ (เลือกผ้าใหม่ให้ลูกค้าทันที หรือเก็บเครดิตไว้ใช้ครั้งหน้า)" },
      ],
      remain > 0 ? "หักลดหนี้" : "คืนเงินสด"
    );
    const accountSelect = buildBankAccountSelect(getCustomerPreferredAccountId(cust));
    const accountRow = formField("จ่ายเงินคืนจากบัญชี", accountSelect);

    // ---- ผ้าที่จะให้ลูกค้าแทน (เฉพาะกรณีเลือก "เปลี่ยนของ") ----
    let exchangeCart = []; // { fabric_id, code, name, unit, unit_price, qty }
    const exchangeListEl = el("div", {});
    const { opts: exchangeFabricOptions } = fabricSelectOptions();
    const exchangeFabricSelect = searchSelectInput(exchangeFabricOptions, "", "พิมพ์รหัส/ชื่อผ้าที่จะให้ลูกค้าแทน");
    const exchangeQtyInput = numberInput(1);
    exchangeQtyInput.setAttribute("placeholder", "จำนวน");
    const exchangePriceInput = numberInput(0);
    exchangePriceInput.setAttribute("placeholder", "ราคา/หน่วย");
    exchangeFabricSelect.inputEl.addEventListener("change", () => {
      const v = exchangeFabricSelect.getMatchedValue();
      if (!v) return;
      const f = DB.getFabric(Number(v));
      if (f) exchangePriceInput.value = f.sell_price || 0;
    });
    function renderExchangeList() {
      clear(exchangeListEl);
      if (exchangeCart.length === 0) {
        exchangeListEl.appendChild(el("p", { text: "ยังไม่ได้เลือกผ้าที่จะให้ลูกค้าแทน" }));
        return;
      }
      exchangeListEl.appendChild(
        el(
          "table",
          { class: "data-table" },
          el(
            "thead",
            {},
            el(
              "tr",
              {},
              el("th", { text: "รหัส - ชื่อผ้า" }),
              el("th", { text: "จำนวน" }),
              el("th", { text: "ราคา/หน่วย" }),
              el("th", { text: "รวม" }),
              el("th", { text: "" })
            )
          ),
          el(
            "tbody",
            {},
            ...exchangeCart.map((it, idx) =>
              el(
                "tr",
                {},
                el("td", { text: `${it.code} - ${it.name}` }),
                el("td", { text: `${round3(it.qty)} ${it.unit}` }),
                el("td", { text: money(it.unit_price) }),
                el("td", { text: money(round2(it.qty * it.unit_price)) }),
                el(
                  "td",
                  {},
                  el(
                    "button",
                    {
                      class: "btn btn-sm",
                      onClick: () => {
                        exchangeCart.splice(idx, 1);
                        renderExchangeList();
                        updatePreview();
                      },
                    },
                    "ลบ"
                  )
                )
              )
            )
          )
        )
      );
    }
    renderExchangeList();
    const exchangeAddBtn = el(
      "button",
      {
        class: "btn btn-sm",
        onClick: () => {
          const v = exchangeFabricSelect.getMatchedValue();
          if (!v) {
            global.alert("กรุณาเลือกผ้าที่จะให้ลูกค้าแทนจากรายการ");
            return;
          }
          const f = DB.getFabric(Number(v));
          if (!f) return;
          const qty = Math.max(0, Number(exchangeQtyInput.value) || 0);
          if (qty <= 0) {
            global.alert("กรุณาระบุจำนวน");
            return;
          }
          if (qty > f.stock_qty) {
            global.alert(`สต็อคผ้า ${f.code} เหลือ ${round3(f.stock_qty)} ${f.unit} ไม่พอ`);
            return;
          }
          const price = Math.max(0, Number(exchangePriceInput.value) || 0);
          exchangeCart.push({ fabric_id: f.id, code: f.code, name: f.name, unit: f.unit, unit_price: price, qty });
          exchangeFabricSelect.setLabel("");
          exchangeQtyInput.value = 1;
          exchangePriceInput.value = 0;
          renderExchangeList();
          updatePreview();
        },
      },
      "+ เพิ่ม"
    );
    const exchangeSection = el(
      "div",
      {},
      el("h4", { text: "ผ้าที่จะให้ลูกค้าแทน" }),
      exchangeListEl,
      el(
        "div",
        { style: { display: "flex", alignItems: "center", gap: "10px", marginBottom: "8px" } },
        el("div", { style: { flex: "1 1 auto", minWidth: "0" } }, exchangeFabricSelect),
        el("div", { style: { flex: "0 0 90px" } }, exchangeQtyInput),
        el("div", { style: { flex: "0 0 100px" } }, exchangePriceInput),
        exchangeAddBtn
      )
    );
    const extraAccountSelect = buildBankAccountSelect(getCustomerPreferredAccountId(cust));
    const extraAccountRow = formField("รับชำระส่วนต่างเข้าบัญชี", extraAccountSelect);

    function computeExchangeSubtotal() {
      return round2(exchangeCart.reduce((s, it) => s + it.qty * it.unit_price, 0));
    }

    const previewLbl = el("p", { text: "มูลค่าที่จะคืน: 0.00 บาท" });
    function computeReturnAmount() {
      let subtotal = 0;
      qtyInputs.forEach((qi) => {
        const qty = Math.min(Math.max(0, Number(qi.input.value) || 0), qi.maxReturnable);
        subtotal += qty * qi.unit_price;
      });
      subtotal = Math.round(subtotal * 100) / 100;
      const ratio = sale.subtotal > 0 ? subtotal / sale.subtotal : 0;
      const discountPortion = Math.round(sale.discount * ratio * 100) / 100;
      const vatPortion = Math.round(sale.vat_amount * ratio * 100) / 100;
      const amount = Math.round((subtotal - discountPortion + vatPortion) * 100) / 100;
      return { subtotal, amount };
    }
    function updatePreview() {
      const { amount } = computeReturnAmount();
      let text = `มูลค่าที่จะคืน: ${money(amount)} บาท`;
      if (methodSelect.value === "เปลี่ยนของ") {
        const exSub = computeExchangeSubtotal();
        const diff = round2(amount - exSub);
        text += ` | มูลค่าผ้าใหม่ที่ให้แทน: ${money(exSub)} บาท`;
        if (diff > 0) text += ` | ลูกค้าได้เครดิตแลกเปลี่ยน ${money(diff)} บาท`;
        else if (diff < 0) text += ` | ลูกค้าต้องจ่ายเพิ่ม ${money(-diff)} บาท`;
        else text += ` | ไม่มีส่วนต่าง`;
        extraAccountRow.style.display = diff < 0 ? "" : "none";
      } else {
        extraAccountRow.style.display = "none";
      }
      previewLbl.textContent = text;
    }
    function updateMethodVisibility() {
      accountRow.style.display = methodSelect.value === "คืนเงินสด" ? "" : "none";
      exchangeSection.style.display = methodSelect.value === "เปลี่ยนของ" ? "" : "none";
      updatePreview();
    }
    methodSelect.addEventListener("change", updateMethodVisibility);
    updateMethodVisibility();

    const noteInput = textInput("");

    // ประวัติการคืนของบิลนี้ (ถ้ามี)
    const pastReturns = DB.getSaleReturns(saleId);
    const historyBlock =
      pastReturns.length > 0
        ? el(
            "div",
            {},
            el("h4", { text: "ประวัติการคืนของบิลนี้" }),
            el(
              "ul",
              {},
              ...pastReturns.map((r) => {
                const hasExchange = r.method === "เปลี่ยนของ" && r.exchange_items && r.exchange_items.length > 0;
                const label = `${fmtDate(r.date)} - ${r.items.map((it) => `${it.code || (DB.getFabric(it.fabric_id) ? DB.getFabric(it.fabric_id).code : "")} x${round3(it.qty)}`).join(", ")} - มูลค่า ${money(r.amount)} บาท (${r.method}${
                  hasExchange
                    ? " -> ให้แทน: " +
                      r.exchange_items.map((it) => `${it.code} x${round3(it.qty)}`).join(", ") +
                      (r.exchange_diff > 0
                        ? ` เครดิต ${money(r.exchange_diff)}`
                        : r.exchange_diff < 0
                          ? ` รับเพิ่ม ${money(-r.exchange_diff)}`
                          : "")
                    : ""
                })`;
                return el(
                  "li",
                  {},
                  label,
                  hasExchange
                    ? el(
                        "button",
                        { class: "btn btn-sm", style: { marginLeft: "8px" }, onClick: () => printExchangeReceipt(r) },
                        "พิมพ์บิลผ้าที่เปลี่ยน"
                      )
                    : null
                );
              })
            )
          )
        : null;

    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",
        onClick: () => {
          const items = qtyInputs
            .map((qi) => ({ fabric_id: qi.fabric_id, qty: Math.min(Math.max(0, Number(qi.input.value) || 0), qi.maxReturnable) }))
            .filter((it) => it.qty > 0);
          if (items.length === 0) {
            global.alert("กรุณาระบุจำนวนที่จะคืนอย่างน้อย 1 รายการ");
            return;
          }
          const method = methodSelect.value;
          const accountId = method === "คืนเงินสด" ? Number(accountSelect.value) || null : null;
          if (method === "คืนเงินสด" && !accountId) {
            global.alert("กรุณาเลือกบัญชีที่จะจ่ายเงินคืน");
            return;
          }
          let exchangeItemsPayload = [];
          let extraAccountId = null;
          if (method === "เปลี่ยนของ") {
            exchangeItemsPayload = exchangeCart.map((it) => ({ fabric_id: it.fabric_id, qty: it.qty, unit_price: it.unit_price }));
            const { amount } = computeReturnAmount();
            const exSub = computeExchangeSubtotal();
            const diff = round2(amount - exSub);
            if (diff < 0) {
              extraAccountId = Number(extraAccountSelect.value) || null;
              if (!extraAccountId) {
                global.alert("ลูกค้าต้องจ่ายเพิ่ม กรุณาเลือกบัญชีที่จะรับชำระส่วนต่าง");
                return;
              }
            }
          }
          const ret = DB.addProductReturn(saleId, items, method, accountId, noteInput.value.trim(), exchangeItemsPayload, extraAccountId);
          if (!ret) {
            global.alert("ไม่สามารถบันทึกการคืนสินค้าได้ กรุณาตรวจสอบจำนวนอีกครั้ง");
            return;
          }
          closeModal();
          refresh();
          renderCustomerTable && renderCustomerTable();

  function buildCustomerSelectOptions() {
    const customers = DB.getCustomers();
    const options = [{ value: "0", label: "ลูกค้าทั่วไป (เงินสด)" }].concat(
      customers.map((c) => {
        const due = DB.getCustomerTotalDue(c);
        const parts = [];
        // ถ้ายอดติดลบ แปลว่าร้านติดเครดิตลูกค้าอยู่ (ลูกค้าจ่ายเกิน/มีเครดิตค้างคืน) ให้โชว์เป็น "เครดิต -X" แทน "ค้างชำระ -X" จะได้ไม่งง
        // ถ้าไม่มีค้างชำระเลย (due = 0) ไม่ต้องโชว์อะไรเลย
        if (due < 0) parts.push(`เครดิต ${money(due)}`);
        else if (due > 0) parts.push(`ค้างชำระ ${money(due)}`);
        // เครดิตแลกเปลี่ยนสินค้า (จากการรับคืนผ้าแบบเปลี่ยนของ) เป็นคนละยอดกับค้างชำระ โชว์เฉพาะตอนมียอดเท่านั้น
        if (c.exchange_credit > 0) parts.push(`เครดิตแลกเปลี่ยน ${money(c.exchange_credit)}`);
        const suffix = parts.length > 0 ? ` (${parts.join(", ")})` : "";
        return { value: String(c.id), label: `${c.code} - ${c.name}${suffix}` };
      })
    );
    const wrap = searchSelectInput(options, "0", "พิมพ์ชื่อ/รหัสลูกค้าเพื่อค้นหา...");
    wrap._customerId = 0;
    function applyMatch(v) {
      if (v === null) {
        global.alert("ไม่พบลูกค้าตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ");
        const cur = options.find((o) => o.value === String(wrap._customerId));
        wrap.setLabel(cur ? cur.label : "ลูกค้าทั่วไป (เงินสด)");
        return;
      }
      const id = Number(v) || 0;
      wrap._customerId = id;
      const opt = options.find((o) => o.value === String(id));
      wrap.setLabel(opt ? opt.label : "ลูกค้าทั่วไป (เงินสด)");
    }
    wrap.inputEl.addEventListener("change", () => applyMatch(wrap.getMatchedValue()));
    wrap.getCustomerId = () => wrap._customerId;
    wrap.setCustomerId = (id) => applyMatch(String(id || 0));
    return wrap;
  }

  function fabricSelectOptions(selectedId) {
    const fabrics = DB.getFabrics("");
    const opts = [{ value: "", label: "-- เลือกผ้า --" }].concat(
      fabrics.map((f) => ({ value: String(f.id), label: `${f.code} - ${f.name} (คงเหลือ ${round3(f.stock_qty)} ${f.unit})` }))
    );
    return { opts, fabrics };
  }

  // 1 เมตร = 1.0936133 หลา / 1 หลา = 0.9144 เมตร
  const YARD_PER_METER = 1.0936133;
  const METER_PER_YARD = 0.9144;
  // ผลลัพธ์ = จำนวน "baseUnit" ต่อ 1 "unit" (ใช้แปลงจำนวน/ราคาระหว่างหน่วยขายกับหน่วยที่เก็บสต็อกจริง)
  function unitFactor(unit, baseUnit) {
    if (!unit || !baseUnit || unit === baseUnit) return 1;
    if (unit === "หลา" && baseUnit === "เมตร") return METER_PER_YARD;
    if (unit === "เมตร" && baseUnit === "หลา") return YARD_PER_METER;
    return 1;
  }

  function addPosRow() {
    cart.push({ fabric_id: "", code: "", name: "", unit: "หลา", baseUnit: "", qty: 1, unit_price: 0, cost_price: 0, stock_qty: null, is_misc: false, note: "", roll_id: null });
    renderPosItemsTable();
    updatePosTotals();
  }

  function addMiscPosRow() {
    cart.push({ fabric_id: "", code: "", name: "", unit: "ชิ้น", baseUnit: "", qty: 1, unit_price: 0, cost_price: 0, stock_qty: null, is_misc: true, note: "", roll_id: null });
    renderPosItemsTable();
    updatePosTotals();
  }

  function autoSelectRollForRow(idx, fabricId) {
    const rolls = DB.getActiveRollsByFabric(fabricId);
    cart[idx].roll_id = rolls.length === 1 ? rolls[0].id : null;
  }
  function posRowSetRoll(idx, rollIdStr) {
    cart[idx].roll_id = Number(rollIdStr) || null;
  }
  function posRowSetFabric(idx, fidStr) {
    const fid = Number(fidStr) || 0;
    const f = fid ? DB.getFabric(fid) : null;
    if (f) {
      const saleUnit = cart[idx].unit || "หลา";
      cart[idx].fabric_id = f.id;
      cart[idx].code = f.code;
      cart[idx].name = f.name;
      cart[idx].unit = saleUnit;
      cart[idx].baseUnit = f.unit;
      cart[idx].stock_qty = f.stock_qty;
      autoSelectRollForRow(idx, f.id);
      if (!cart[idx].unit_price) cart[idx].unit_price = round2(f.sell_price * unitFactor(saleUnit, f.unit));
    } else {
      cart[idx] = { fabric_id: "", code: "", name: "", unit: cart[idx].unit || "หลา", baseUnit: "", qty: cart[idx].qty, unit_price: 0, stock_qty: null, note: cart[idx].note || "", roll_id: null };
    }
    renderPosItemsTable();
    updatePosTotals();
  }

  function posRowSetUnit(idx, unitVal) {
    const row = cart[idx];
    const f = row.fabric_id ? DB.getFabric(row.fabric_id) : null;
    if (f) {
      // แปลงราคา/หน่วยให้สอดคล้องกับหน่วยที่เลือกใหม่ (มูลค่ารวมของรายการยังเท่าเดิม)
      const oldFactor = unitFactor(row.unit, f.unit);
      const newFactor = unitFactor(unitVal, f.unit);
      const pricePerBase = row.unit_price && oldFactor ? row.unit_price / oldFactor : f.sell_price;
      row.unit_price = round2(pricePerBase * newFactor);
    }
    row.unit = unitVal;
    renderPosItemsTable();
    updatePosTotals();
  }

  function round2(n) {
    return Math.round((Number(n) || 0) * 100) / 100;
  }
  function round3(n) {
    return Math.round((Number(n) || 0) * 1000) / 1000;
  }

        el("th", { text: "จำนวน" }),
        el("th", { text: "หน่วย" }),
        el("th", { text: "ราคา/หน่วย" }),
        el("th", { text: "ทุน/หน่วย" }),
        el("th", { text: "รวม" }),
        el("th", { text: "คงเหลือ" }),

    }

    cart.forEach((row, idx) => {

        nameInput.addEventListener("input", (e) => {

          cart[idx].unit = e.target.value;

          }

        });

        stockText = `${round3(row.stock_qty)} ${row.baseUnit}`;
        if (row.unit && row.unit !== row.baseUnit) {
          const factor = unitFactor(row.unit, row.baseUnit);
          const equiv = factor ? row.stock_qty / factor : row.stock_qty;
          stockText += ` (≈ ${round3(equiv)} ${row.unit})`;
        }
      }
      const amountCell = el("td", { text: money(row.qty * row.unit_price) });

        if (activeRolls.length > 1) {
          const rollSelect = selectInput(
            [{ value: "", label: "-- เลือกม้วน --" }].concat(activeRolls.map((r) => ({ value: String(r.id), label: `ม้วนที่ ${r.roll_no} (${r.qty})` }))),
            row.roll_id ? String(row.roll_id) : ""
          );
          rollSelect.addEventListener("change", () => posRowSetRoll(idx, rollSelect.value));
          rollCell = el("td", {}, rollSelect);
        } else if (activeRolls.length === 1) {
          rollCell = el("td", { text: `ม้วนที่ ${activeRolls[0].roll_no}` });
        } else {
          rollCell = el("td", { text: "-" });
        }
      }

      const removeBtn = el(
        "button",
        {
          class: "btn btn-sm",
          onClick: () => {
            cart.splice(idx, 1);
            renderPosItemsTable();

        "ลบ"
      );

  function updatePosRowAmount(idx) {
    const cell = refs["posRowAmount_" + idx];
    if (cell) cell.textContent = money(cart[idx].qty * cart[idx].unit_price);
  }

  function calcPosTotals() {
    const subtotal = cart.reduce((s, it) => s + it.qty * it.unit_price, 0);
    const discountRaw = Number(refs.posDiscountInput.value) || 0;
    const discount = refs.posDiscountUnitSelect && refs.posDiscountUnitSelect.value === "%" ? round2((subtotal * discountRaw) / 100) : discountRaw;
    const base = Math.max(0, subtotal - discount);
    const vat = refs.posVatChk && refs.posVatChk.checked ? Math.round(base * VAT_RATE * 100) / 100 : 0;
    const shippingFee = Number(refs.posShippingFeeInput.value) || 0;
    const total = base + vat + shippingFee;
    return { subtotal, discount, vat, shippingFee, total };
  }

  function updatePosTotals() {
    const { subtotal, discount, vat, shippingFee, total } = calcPosTotals();
    refs.posSubtotalLbl.textContent = `ยอดรวมก่อนภาษี: ${money(subtotal - discount)} บาท`;
    if (refs.posVatLbl) {
      refs.posVatLbl.textContent = `ภาษีมูลค่าเพิ่ม ${Math.round(VAT_RATE * 100)}%: ${money(vat)} บาท`;
    }
    if (refs.posShippingLbl) {
      refs.posShippingLbl.textContent = `ค่าจัดส่ง: ${money(shippingFee)} บาท`;
    }
    refs.posTotalLbl.textContent = `ยอดสุทธิ: ${money(total)} บาท`;
    const paid = Number(refs.posPaidInput.value) || 0;
    const change = refs.posPaymentSelect.value !== "เงินเชื่อ" ? Math.max(0, paid - total) : 0;
    refs.posChangeLbl.textContent = `เงินทอน: ${money(change)} บาท`;
  }

  function checkout() {
    const validItems = cart.filter((it) => it.qty > 0 && (it.is_misc ? (it.name || "").trim() : it.fabric_id));
    if (validItems.length === 0) {
      global.alert("กรุณาเลือกสินค้าและระบุจำนวนอย่างน้อย 1 รายการ");
      return;
    }
    for (const it of validItems) {
      if (it.is_misc || !it.fabric_id) continue;
      const activeRolls = DB.getActiveRollsByFabric(it.fabric_id);
      if (activeRolls.length > 1 && !it.roll_id) {
        global.alert(`กรุณาเลือกม้วนที่จะตัดขายสำหรับ "${it.code} - ${it.name}" (มีมากกว่า 1 ม้วนเหลืออยู่)`);
        return;
      }
    }
    const { subtotal, discount, vat, shippingFee, total } = calcPosTotals();
    const custId = refs.posCustomerSelect.getCustomerId();
    const paymentMethod = refs.posPaymentSelect.value;
    const paid = Number(refs.posPaidInput.value) || 0;
    const shippingMethod = refs.posShippingMethodInput.value.trim();

    if (paymentMethod === "เงินเชื่อ") {
      if (!custId) {
        global.alert("การขายแบบเครดิตต้องเลือกลูกค้า");
        return;
      }
      const customer = DB.getCustomer(custId);
      const newBalance = customer.credit_balance + (total - paid);
      if (customer.credit_limit > 0 && newBalance > customer.credit_limit) {
        const ok = global.confirm(
          `ลูกค้ารายนี้มีวงเงินเครดิต ${money(customer.credit_limit)} บาท ยอดหลังขายจะเป็น ${money(
            newBalance
          )} บาท เกินวงเงินที่กำหนด ต้องการดำเนินการต่อหรือไม่?`
        );
        if (!ok) return;
      }
    } else if (paymentMethod !== "เงินสด" && paymentMethod !== "เงินสดแต่ยังไม่จ่าย" && paid < total) {
      global.alert("จำนวนเงินที่รับน้อยกว่ายอดที่ต้องชำระ");
      return;
    }

    let accountSplits = null;
    if (paymentMethod === "โอนเงิน") {
      accountSplits = refs.posAccountSplit.getSplits();
      if (accountSplits.length === 0) {
        global.alert("กรุณาเลือกบัญชีที่รับโอน");
        return;
      }
      const splitTotal = refs.posAccountSplit.getTotal();
      if (splitTotal !== paid) {
        global.alert(`ยอดรวมที่แบ่งเข้าบัญชี (${money(splitTotal)}) ไม่เท่ากับยอดที่รับ (${money(paid)}) กรุณาตรวจสอบ`);
        return;
      }
    }

    const items = validItems.map((it) => {
      if (it.is_misc) {
        return {
          fabric_id: null,
          is_misc: true,
          name: it.name.trim(),
          code: "",
          cost_price: it.cost_price || 0,
          qty: it.qty,
          unit_price: it.unit_price,
          unit: it.unit || "ชิ้น",
          stock_qty: 0,
          note: (it.note || "").trim(),
        };
      }
      const f = DB.getFabric(it.fabric_id);
      const factor = f ? unitFactor(it.unit, f.unit) : 1;
      return {
        fabric_id: it.fabric_id,
        qty: it.qty,
        unit_price: it.unit_price,
        unit: it.unit,
        stock_qty: it.qty * factor,
        roll_id: it.roll_id || null,
        note: (it.note || "").trim(),
      };
    });
    const isVat = !!(refs.posVatChk && refs.posVatChk.checked);
    const sale = editingSaleId
      ? DB.updateSale(editingSaleId, items, custId || null, discount, vat, paymentMethod, paid, refs.posNoteInput.value.trim(), undefined, accountSplits, shippingFee, shippingMethod, refs.posDueDateInput.value, isVat)
      : DB.createSale(items, custId || null, discount, vat, paymentMethod, paid, refs.posNoteInput.value.trim(), undefined, accountSplits, shippingFee, shippingMethod, refs.posDueDateInput.value, isVat);

    if (!sale) {
      global.alert("ไม่สามารถบันทึกบิลได้ กรุณาตรวจสอบข้อมูลอีกครั้ง");
      return;
    }

    // เก็บค่าที่ต้องใช้ทำใบเสร็จไว้ก่อน แล้วรีเซ็ตฟอร์ม/สถานะแก้ไขให้เรียบร้อยทันที
    // ก่อนเปิดโมดัลใบเสร็จ กันปัญหาปุ่ม "ยกเลิกการแก้ไข" ค้างอยู่ ถ้าโมดัลใบเสร็จมีปัญหาระหว่างเปิด
    const receiptCustId = custId;
    const receiptItems = validItems.slice();

    if (pendingExchangeCredit && pendingExchangeCredit.customerId === custId) {
      DB.useExchangeCredit(custId, pendingExchangeCredit.amount);
    }
    pendingExchangeCredit = null;

    editingSaleId = null;
    cart = [];
    addPosRow();
    refs.posDiscountInput.value = 0;
    if (refs.posDiscountUnitSelect) refs.posDiscountUnitSelect.value = "บาท";
    refs.posPaidInput.value = 0;
    refs.posShippingFeeInput.value = 0;
    refs.posShippingMethodInput.value = "";
    refs.posDueDateInput.value = "";
    refs.posPaymentSelect.value = "เงินสดแต่ยังไม่จ่าย";
    refs.posAccountSplit.reset(0);
    refs.posNoteInput.value = "";
    refs.posAccountSplitRow.style.display = "none";
    if (refs.posVatChk) refs.posVatChk.checked = false;

    const newCustomerSelect = buildCustomerSelectOptions();
    const oldSelect = refs.posCustomerSelect;
    if (oldSelect.parentNode) {
      oldSelect.parentNode.replaceChild(newCustomerSelect, oldSelect);
    }
    refs.posCustomerSelect = newCustomerSelect;
    if (refs.exchangeCreditInfo) refs.exchangeCreditInfo.style.display = "none";
    if (refs.useExchangeCreditBtn) refs.useExchangeCreditBtn.style.display = "none";

    updatePosTotals();
    updateEditBannerUI();
    renderPosSalesHistory();

    showReceiptModal(sale, receiptCustId, receiptItems);
  }

  function buildReceiptDoc(sale, cust, shop, cartItems, docType, lang, payAccountLabel) {
    // docType: "delivery" (ใบส่งสินค้า) | "cash" (บิลเงินสด) | "normal" (ใบเสร็จปกติ)
    // lang: "th" (ค่าเริ่มต้น) | "en" (สำหรับลูกค้าต่างชาติ)
    // payAccountLabel: บัญชีที่แนะนำให้ลูกค้าโอนเงิน (ไม่ผูกกับสถานะการชำระเงินจริงของบิลนี้)
    const isEn = lang === "en";
    const L = isEn
      ? {
          deliveryNote: "Delivery Note",
          cashBill: "Cash Bill",
          taxInvoiceReceipt: "Receipt / Delivery Note",
          receipt: "Receipt",
          generalCustomer: "Walk-in Customer",
          taxId: "Tax ID",
          invoiceNo: "No.",
          date: "Date",
          customer: "Customer",
          shippingMethod: "Shipping Method",
          item: "Item",
          qty: "Qty",
          price: "Price",
          amount: "Amount",
          subtotalBeforeDiscount: "Subtotal (before discount)",
          discount: "Discount",
          beforeVat: "Subtotal (before VAT)",
          vatLabel: (pct) => `VAT ${pct}%`,
          beforeShipping: "Subtotal (before shipping)",
          shippingFee: "Shipping Fee",
          shippingFeeSeparate: "Shipping Fee (paid separately)",
          total: "Total",
          paid: "Paid",
          change: "Change",
          bank: "Bank",
          accountName: "Account Name",
          thankYou: "Thank you for your business",
          deliveredBy: "Delivered by",
          receivedGoodsBy: "Received by",
          receivedPaymentBy: "Received Payment by",
          note: "Note",
          totalDueAll: "Total outstanding balance",
          dueFabricPart: "  - Fabric portion",
          dueShippingPart: "  - Shipping portion",
          currency: "THB",
          payAccount: "Payment Account",
          transferTo: "Transfer to account",
        }
      : {
          deliveryNote: "ใบส่งสินค้า",
          cashBill: "บิลเงินสด",
          taxInvoiceReceipt: "ใบเสร็จรับเงิน/ใบส่งของ",
          receipt: "ใบเสร็จรับเงิน",
          generalCustomer: "ลูกค้าทั่วไป",
          taxId: "เลขผู้เสียภาษี",
          invoiceNo: "เลขที่บิล",
          date: "วันที่",
          customer: "ลูกค้า",
          shippingMethod: "วิธีจัดส่ง",
          item: "รายการ",
          qty: "จำนวน",
          price: "ราคา",
          amount: "รวม",
          subtotalBeforeDiscount: "ยอดรวมก่อนหักส่วนลด",
          discount: "ส่วนลด",
          beforeVat: "ยอดรวมก่อนภาษีมูลค่าเพิ่ม",
          vatLabel: (pct) => `ภาษีมูลค่าเพิ่ม ${pct}%`,
          beforeShipping: "ยอดรวมก่อนค่าจัดส่ง",
          shippingFee: "ค่าจัดส่ง",
          shippingFeeSeparate: "ค่าจัดส่ง (ชำระแยกต่างหาก)",
          total: "ยอดสุทธิ",
          paid: "รับเงิน",
          change: "เงินทอน",
          bank: "โอนเข้าธนาคาร",
          accountName: "ชื่อบัญชี",
          thankYou: "ขอบคุณที่ใช้บริการ",
          deliveredBy: "ผู้ส่งสินค้า",
          receivedGoodsBy: "ผู้รับสินค้า",
          receivedPaymentBy: "ผู้รับเงิน",
          note: "หมายเหตุ",
          totalDueAll: "ยอดค้างชำระสะสมทั้งหมด",
          dueFabricPart: "  - ค่าผ้า",
          dueShippingPart: "  - ค่าส่ง",
          currency: "บาท",
          payAccount: "บัญชีสำหรับโอนเงิน",
          transferTo: "โอนเข้าบัญชี",
        };
    const showVat = VAT_ENABLED || !!(sale && sale.is_vat);
    const isDeliveryDoc = docType === "delivery";
    const docTitle = isDeliveryDoc
      ? L.deliveryNote
      : docType === "cash"
      ? L.cashBill
      : showVat
      ? L.taxInvoiceReceipt
      : L.receipt;
    const custName = cust ? cust.name : L.generalCustomer;
    // บิลที่เป็นแว็ดและมีค่าจัดส่ง: แยกค่าส่งออกจากยอดสุทธิเสมอ (ไม่ว่าจะเป็นใบส่งสินค้าหรือใบเสร็จ) เพราะลูกค้าต้องโอนเงินค่าสินค้ากับค่าส่งแยกบัญชีกัน เหมือนใบวางบิล
    const excludeShippingFromTotal = showVat && docType !== "cash" && (sale.shipping_fee || 0) > 0;
    const displayTotal = excludeShippingFromTotal ? sale.total - (sale.shipping_fee || 0) : sale.total;

    // -------- plain text version (สำหรับดาวน์โหลดไฟล์ .txt) --------
    const lines = [];
    if (showVat && !isDeliveryDoc && shop.tax_id) lines.push(`${L.taxId}: ${shop.tax_id}`);
    lines.push(docTitle);
    lines.push(`${L.invoiceNo}: ${sale.sale_no}`);
    lines.push(`${L.date}: ${fmtDate(sale.date)}`);
    lines.push(`${L.customer}: ${custName}`);
    if (sale.shipping_method) lines.push(`${L.shippingMethod}: ${sale.shipping_method}`);
    lines.push("-".repeat(40));
    cartItems.forEach((it) => {
      const sub = it.qty * it.unit_price;
      const qtyUnit = `${it.qty}${it.unit ? " " + it.unit : ""}`;
      const label = it.code || it.name || "";
      lines.push(
        `${label.slice(0, 20).padEnd(20)}${qtyUnit.padStart(10)} x ${money(it.unit_price).padStart(9)} = ${money(sub).padStart(11)}`
      );
      if (it.note) lines.push(`    (${it.note})`);
    });
    lines.push("-".repeat(40));
    if (sale.discount) {
      lines.push(`${L.subtotalBeforeDiscount.padEnd(24)}${money(sale.subtotal).padStart(14)}`);
      lines.push(`${L.discount.padEnd(24)}${money(sale.discount).padStart(14)}`);
    }
    if (showVat) {
      lines.push(`${L.beforeVat.padEnd(24)}${money(sale.subtotal - (sale.discount || 0)).padStart(14)}`);
      lines.push(`${L.vatLabel(Math.round(VAT_RATE * 100)).padEnd(24)}${money(sale.vat_amount).padStart(14)}`);
    }
    if (!excludeShippingFromTotal && sale.shipping_fee) {
      lines.push(`${L.beforeShipping.padEnd(24)}${money(displayTotal - sale.shipping_fee).padStart(14)}`);
      lines.push(`${L.shippingFee.padEnd(24)}${money(sale.shipping_fee).padStart(14)}`);
    }
    lines.push(`${L.total.padEnd(24)}${money(displayTotal).padStart(14)}`);
    if (excludeShippingFromTotal) {
      lines.push(`  ${L.transferTo} ${BILLING_FABRIC_ACCOUNT_TEXT}`);
      lines.push("-".repeat(40));
      lines.push(`${L.shippingFeeSeparate.padEnd(24)}${money(sale.shipping_fee).padStart(14)}`);
      if (payAccountLabel) lines.push(`  ${L.transferTo} ${payAccountLabel}`);
    }
    if (sale.paid) lines.push(`${L.paid.padEnd(24)}${money(sale.paid).padStart(14)}`);
    if (sale.change_amt) lines.push(`${L.change.padEnd(24)}${money(sale.change_amt).padStart(14)}`);
    if (sale.payment_method === "โอนเงิน" && (sale.bank_name || sale.bank_account_name)) {
      lines.push(`${L.bank}: ${sale.bank_name || "-"}`);
      lines.push(`${L.accountName}: ${sale.bank_account_name || "-"}`);
    }
    lines.push("-".repeat(40));
    lines.push(L.thankYou);
    const linesNoSign = lines.slice();
    lines.push("");
    lines.push("");
    lines.push(`.....................................  ${L.deliveredBy}`);
    lines.push("");
    lines.push(`.....................................  ${L.receivedGoodsBy}`);
    lines.push("");
    lines.push(`.....................................  ${L.receivedPaymentBy}`);
    if (sale.note) {
      lines.push("");
      lines.push("-".repeat(40));
      lines.push(`${L.note}: ${sale.note}`);
      linesNoSign.push("");
      linesNoSign.push("-".repeat(40));
      linesNoSign.push(`${L.note}: ${sale.note}`);
    }
    if (cust) {
      const totalDue = DB.getCustomerTotalDue(cust);
      if (totalDue > 0) {
        linesNoSign.push("");
        linesNoSign.push("-".repeat(40));
        linesNoSign.push(`${L.totalDueAll}: ${money(totalDue)} ${L.currency}`);
        if (showVat) {
          const dueBreakdown = DB.getCustomerDueBreakdown(cust);
          if (dueBreakdown.shipping > 0) {
            linesNoSign.push(`${L.dueFabricPart}: ${money(dueBreakdown.fabric)} ${L.currency}`);
            linesNoSign.push(`${L.dueShippingPart}: ${money(dueBreakdown.shipping)} ${L.currency}`);
          }
        }
      }
    }
    // บัญชีสำหรับโอนเงิน: ใส่ไว้ล่างสุดของข้อความเสมอ เพื่อให้ลูกค้าเห็นชัดตอนอ่านที่แชท/ไลน์
    // (ถ้าแยกค่าจัดส่งออกจากยอดแล้ว บัญชีจะถูกระบุไว้คู่กับแต่ละยอดด้านบนแทน ไม่ต้องซ้ำตรงนี้)
    if (payAccountLabel && !excludeShippingFromTotal) {
      lines.push("");
      lines.push(`${L.payAccount}: ${payAccountLabel}`);
      linesNoSign.push("");
      linesNoSign.push(`${L.payAccount}: ${payAccountLabel}`);
    }
    const text = lines.join("\n");
    const textForCopy = linesNoSign.join("\n");

    // -------- HTML table version (สำหรับแสดงตัวอย่าง/พิมพ์) --------
    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const itemRows = cartItems
      .map((it, i) => {
        const sub = it.qty * it.unit_price;
        const qtyUnit = `${it.qty}${it.unit ? " " + it.unit : ""}`;
        const label = it.code || it.name || "";
        const noteHtml = it.note ? `<div style="font-size:10.5px;color:#666;margin-top:2px;">${esc(it.note)}</div>` : "";
        const rowBorder = i === cartItems.length - 1 ? "" : "border-bottom:1px dotted #999;";
        return `<tr><td style="padding:7px 4px;${rowBorder}">${esc(label)}${noteHtml}</td><td style="padding:7px 4px;text-align:right;${rowBorder}">${esc(
          qtyUnit
        )}</td><td style="padding:7px 4px;text-align:right;${rowBorder}">${money(it.unit_price)}</td><td style="padding:7px 4px;text-align:right;${rowBorder}">${money(sub)}</td></tr>`;
      })
      .join("");

    let summaryRowsTop = "";
    if (sale.discount) {
      summaryRowsTop += `<tr><td style="padding:2px 0;color:#444;">${L.subtotalBeforeDiscount}</td><td style="padding:2px 0;text-align:right;">${money(
        sale.subtotal
      )}</td></tr>`;
      summaryRowsTop += `<tr><td style="padding:2px 0;color:#444;">${L.discount}</td><td style="padding:2px 0;text-align:right;">${money(sale.discount)}</td></tr>`;
    }
    if (showVat) {
      summaryRowsTop += `<tr><td style="padding:2px 0;color:#444;">${L.beforeVat}</td><td style="padding:2px 0;text-align:right;">${money(
        sale.subtotal - (sale.discount || 0)
      )}</td></tr>`;
      summaryRowsTop += `<tr><td style="padding:2px 0;color:#444;">${L.vatLabel(
        Math.round(VAT_RATE * 100)
      )}</td><td style="padding:2px 0;text-align:right;">${money(sale.vat_amount)}</td></tr>`;
    }
    if (!excludeShippingFromTotal && sale.shipping_fee) {
      summaryRowsTop += `<tr><td style="padding:2px 0;color:#444;">${L.beforeShipping}</td><td style="padding:2px 0;text-align:right;">${money(
        displayTotal - sale.shipping_fee
      )}</td></tr>`;
      summaryRowsTop += `<tr><td style="padding:2px 0;color:#444;">${L.shippingFee}</td><td style="padding:2px 0;text-align:right;">${money(sale.shipping_fee)}</td></tr>`;
    }

    let summaryRowsBottom = "";
    if (excludeShippingFromTotal) {
      summaryRowsBottom += `<tr><td colspan="2" style="padding:0 0 4px;font-size:10.5px;color:#555;">${L.transferTo} ${esc(BILLING_FABRIC_ACCOUNT_TEXT)}</td></tr>`;
      summaryRowsBottom += `<tr><td style="padding:6px 0 2px;color:#444;">${L.shippingFeeSeparate}</td><td style="padding:6px 0 2px;text-align:right;">${money(
        sale.shipping_fee
      )}</td></tr>`;
      if (payAccountLabel) {
        summaryRowsBottom += `<tr><td colspan="2" style="padding:0 0 4px;font-size:10.5px;color:#555;">${L.transferTo} ${esc(payAccountLabel)}</td></tr>`;
      }
    }
    if (sale.paid) {
      summaryRowsBottom += `<tr><td style="padding:3px 0;color:#444;">${L.paid}</td><td style="padding:3px 0;text-align:right;">${money(sale.paid)}</td></tr>`;
    }
    if (sale.change_amt) {
      summaryRowsBottom += `<tr><td style="padding:3px 0;color:#444;">${L.change}</td><td style="padding:3px 0;text-align:right;">${money(sale.change_amt)}</td></tr>`;
    }
    if (sale.payment_method === "โอนเงิน" && (sale.bank_name || sale.bank_account_name)) {
      summaryRowsBottom += `<tr><td style="padding:3px 0;color:#444;">${L.bank}</td><td style="padding:3px 0;text-align:right;">${esc(
        sale.bank_name || "-"
      )}</td></tr>`;
      summaryRowsBottom += `<tr><td style="padding:3px 0;color:#444;">${L.accountName}</td><td style="padding:3px 0;text-align:right;">${esc(
        sale.bank_account_name || "-"
      )}</td></tr>`;
    }

    const taxIdLine =
      showVat && !isDeliveryDoc && shop.tax_id
        ? `<div style="font-size:11px;color:#888;letter-spacing:0.5px;margin-top:3px;">${L.taxId}: ${esc(shop.tax_id)}</div>`
        : "";
    const shippingMethodRow = sale.shipping_method
      ? `<tr><td style="padding:2px 0;color:#444;">${L.shippingMethod}</td><td style="padding:2px 0;text-align:right;">${esc(sale.shipping_method)}</td></tr>`
      : "";
    // ถ้าแยกค่าจัดส่งออกจากยอด (บิลแว็ดที่มีค่าส่ง) จะไปโชว์บัญชีคู่กับแต่ละยอดในส่วนสรุปด้านล่างแทน (แบบเดียวกับใบวางบิล) ไม่ต้องซ้ำในตารางข้อมูลบนนี้
    const payAccountRow =
      payAccountLabel && !excludeShippingFromTotal
        ? `<tr><td style="padding:2px 0;color:#444;">${L.payAccount}</td><td style="padding:2px 0;text-align:right;">${esc(payAccountLabel)}</td></tr>`
        : "";

    let qrFooterHtml = "";
    if (!sale.is_vat && (docType === "normal" || docType === "delivery")) {
      const rollTags = cartItems
        .map((it) => {
          if (!it.roll_id) return null;
          const r = DB.getRoll(it.roll_id);
          return r && r.fabric_id === it.fabric_id ? r : null;
        })
        .filter(Boolean)
        .map((roll) => {
          const fab = DB.getFabric(roll.fabric_id);
          if (!fab) return "";
          const url = rollQrUrl(fab.code, roll.roll_no);
          const img = qrDataUrl(url, 140);
          return `<div style="display:inline-block;text-align:center;padding:8px;border:1px dashed #999;margin:4px;vertical-align:top;"><img src="${img}" width="70" height="70"/><div style="font-size:10px;font-weight:bold;margin-top:3px;">${esc(fab.code)}</div><div style="font-size:9px;color:#666;">ม้วนที่ ${roll.roll_no}</div></div>`;
        })
        .join("");
      if (rollTags) {
        qrFooterHtml = `<div style="margin-top:18px;padding-top:10px;border-top:1px dashed #999;text-align:center;"><div style="font-size:10px;color:#888;margin-bottom:2px;">สแกนเพื่อเช็คสต็อก (ตัดแปะที่ม้วนผ้า)</div>${rollTags}</div>`;
      }
    }

    const html = `
      <div style="max-width:380px;margin:0;font-family:Tahoma,'Segoe UI',sans-serif;color:#111;">
        <div style="text-align:center;border-bottom:2px solid #000;padding-bottom:10px;margin-bottom:14px;">
          <div style="font-size:17px;font-weight:bold;letter-spacing:0.5px;">${esc(docTitle)}</div>
          <div style="font-size:11px;color:#888;margin-top:3px;">${isEn ? "No." : "เลขที่"} ${esc(sale.sale_no)}</div>
          ${taxIdLine}
        </div>
        <table style="width:100%;font-size:12px;margin-bottom:12px;border-collapse:collapse;">
          <tr><td style="padding:3px 0;color:#444;">${L.date}</td><td style="padding:3px 0;text-align:right;">${esc(fmtDate(sale.date))}</td></tr>
          <tr><td style="padding:3px 0;color:#444;">${L.customer}</td><td style="padding:3px 0;text-align:right;font-weight:bold;font-size:14px;">${esc(custName)}</td></tr>
          ${shippingMethodRow}
          ${payAccountRow}
        </table>
        <table style="width:100%;border-collapse:collapse;font-size:12px;margin-bottom:12px;">
          <thead>
            <tr style="border-top:1.5px solid #000;border-bottom:1.5px solid #000;">
              <th style="text-align:left;padding:6px 4px;">${L.item}</th>
              <th style="text-align:right;padding:6px 4px;">${L.qty}</th>
              <th style="text-align:right;padding:6px 4px;">${L.price}</th>
              <th style="text-align:right;padding:6px 4px;">${L.amount}</th>
            </tr>
          </thead>
          <tbody>${itemRows}</tbody>
        </table>
        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:6px;">${summaryRowsTop}</table>
        <div style="border:1.5px solid #000;border-radius:4px;padding:8px 10px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:${
          summaryRowsBottom ? "10px" : "16px"
        };">
          <span style="font-weight:bold;font-size:14px;">${L.total}</span>
          <span style="font-weight:bold;font-size:16px;">${money(displayTotal)} ${L.currency}</span>
        </div>
        ${summaryRowsBottom ? `<table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:16px;">${summaryRowsBottom}</table>` : ""}
        <div style="font-size:12px;color:#444;text-align:center;margin-bottom:18px;">${L.thankYou}</div>
        <div style="display:flex;justify-content:space-between;margin-top:28px;font-size:11px;text-align:center;color:#000;">
          <div style="width:30%;border-top:1px solid #000;padding-top:4px;">${L.deliveredBy}</div>
          <div style="width:30%;border-top:1px solid #000;padding-top:4px;">${L.receivedGoodsBy}</div>
          <div style="width:30%;border-top:1px solid #000;padding-top:4px;">${L.receivedPaymentBy}</div>
        </div>

  const BILLING_FABRIC_ACCOUNT_TEXT = "หจก. นิวศิริเจริญ ธ.กสิกรไทย (KBank) เลขที่ 0458527326";

  function buildBillingStatementDoc(cust, shop, sales, dueDateStr, note, shipAccountLabel, wholeAccountLabel, docNo) {
    const custName = cust ? cust.name : "ลูกค้าทั่วไป";
    const custAddress = cust && cust.address ? cust.address : "";
    // บิลที่เป็นแว็ดและมีค่าจัดส่ง: แยกค่าส่งออกจากยอดของบิลนั้น แล้วไปสรุปรวมเป็นบรรทัดแยกด้านล่าง
    // (เพราะลูกค้าต้องโอนเงินค่าส่งแยกต่างหาก เหมือนใบส่งสินค้าที่เป็นแว็ด)
    const rowsData = sales.map((s) => {
      const isVatShip = !!s.is_vat && (s.shipping_fee || 0) > 0;
      const shipAmt = isVatShip ? s.shipping_fee : 0;
      const lineAmt = (s.total || 0) - shipAmt;
      return { sale: s, lineAmt, shipAmt };
    });
    const grandTotal = rowsData.reduce((sum, r) => sum + r.lineAmt, 0);
    const shippingTotal = rowsData.reduce((sum, r) => sum + r.shipAmt, 0);
    const todayDisplay = fmtDate(DB.todayStr());
    const dueDateDisplay = dueDateStr ? fmtDate(dueDateStr) : "";
    const noteTrimmed = note ? String(note).trim() : "";

    const lines = [];
    if (shop.tax_id) lines.push(`เลขผู้เสียภาษี: ${shop.tax_id}`);
    lines.push("ใบวางบิล");
    lines.push(`เลขที่: ${docNo}`);
    lines.push(`วันที่วางบิล: ${todayDisplay}`);
    if (dueDateDisplay) lines.push(`กำหนดชำระ: ${dueDateDisplay}`);
    lines.push(`ลูกค้า: ${custName}`);
    if (custAddress) lines.push(`ที่อยู่: ${custAddress}`);
    lines.push("-".repeat(40));
    rowsData.forEach(({ sale: s, lineAmt }) => {
      lines.push(`${String(s.sale_no).padEnd(18)}${fmtDate(s.date).padStart(12)}${money(lineAmt).padStart(12)}`);
    });
    lines.push("-".repeat(40));
    lines.push(`${"รวมเป็นเงินทั้งสิ้น".padEnd(24)}${money(grandTotal).padStart(14)}`);
    if (shippingTotal > 0) {
      lines.push(`  โอนเข้าบัญชี ${BILLING_FABRIC_ACCOUNT_TEXT}`);
      lines.push("-".repeat(40));
      lines.push(`${"ค่าจัดส่งรวม (ชำระแยกต่างหาก)".padEnd(24)}${money(shippingTotal).padStart(14)}`);
      if (shipAccountLabel) lines.push(`  โอนเข้าบัญชี ${shipAccountLabel}`);
    } else if (wholeAccountLabel) {
      lines.push(`  โอนเข้าบัญชี ${wholeAccountLabel}`);
    }
    const linesNoSign = lines.slice();
    lines.push("");
    lines.push("");
    lines.push("ลงชื่อ..................................... ผู้วางบิล");
    lines.push("");
    lines.push("ลงชื่อ..................................... ผู้รับวางบิล");
    if (noteTrimmed) {
      lines.push("");
      lines.push("-".repeat(40));
      lines.push(`หมายเหตุ: ${noteTrimmed}`);
      linesNoSign.push("");
      linesNoSign.push("-".repeat(40));
      linesNoSign.push(`หมายเหตุ: ${noteTrimmed}`);
    }
    const text = lines.join("\n");
    const textForCopy = linesNoSign.join("\n");

    const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const rows = rowsData
      .map(
        ({ sale: s, lineAmt }) =>
          `<tr style="border-bottom:1px solid #ddd;"><td style="padding:5px 4px;">${esc(s.sale_no)}</td><td style="padding:5px 4px;">${esc(
            fmtDate(s.date)
          )}</td><td style="padding:5px 4px;text-align:right;">${money(lineAmt)}</td></tr>`
      )
      .join("");
    const taxIdLine = shop.tax_id
      ? `<div style="text-align:left;font-size:11px;color:#555;margin-bottom:6px;">เลขผู้เสียภาษี: ${esc(shop.tax_id)}</div>`
      : "";
    const addressLine = custAddress
      ? `<tr><td style="padding:2px 0;color:#555;">ที่อยู่</td><td style="padding:2px 0;text-align:right;">${esc(custAddress)}</td></tr>`
      : "";
    const dueDateRow = dueDateDisplay
      ? `<tr><td style="padding:2px 0;color:#555;">กำหนดชำระ</td><td style="padding:2px 0;text-align:right;">${esc(dueDateDisplay)}</td></tr>`
      : "";
    const fabricAcctRow =
      shippingTotal > 0
        ? `<tr><td colspan="2" style="padding:0 0 4px;font-size:10.5px;color:#555;">โอนเข้าบัญชี ${esc(BILLING_FABRIC_ACCOUNT_TEXT)}</td></tr>`
        : "";
    const shippingRow =
      shippingTotal > 0
        ? `<tr style="border-top:1px dashed #999;"><td style="padding:6px 0 2px;color:#555;">ค่าจัดส่งรวม (ชำระแยกต่างหาก)</td><td style="padding:6px 0 2px;text-align:right;">${money(
            shippingTotal
          )} บาท</td></tr>`
        : "";
    const shippingAcctRow =
      shippingTotal > 0 && shipAccountLabel
        ? `<tr><td colspan="2" style="padding:0 0 4px;font-size:10.5px;color:#555;">โอนเข้าบัญชี ${esc(shipAccountLabel)}</td></tr>`
        : "";
    const wholeAcctRow =
      shippingTotal <= 0 && wholeAccountLabel
        ? `<tr><td colspan="2" style="padding:0 0 4px;font-size:10.5px;color:#555;">โอนเข้าบัญชี ${esc(wholeAccountLabel)}</td></tr>`
        : "";
    const noteHtml = noteTrimmed
      ? `<div style="border-top:1px dashed #999;margin-top:20px;padding-top:8px;font-size:11.5px;color:#333;">หมายเหตุ: ${esc(noteTrimmed)}</div>`
      : "";
    const html = `
      <div style="max-width:480px;margin:0;font-family:Tahoma,'Segoe UI',sans-serif;color:#111;">
        ${taxIdLine}
        <div style="text-align:left;border-bottom:1px solid #000;padding-bottom:8px;margin-bottom:10px;">
          <strong style="font-size:15px;">ใบวางบิล</strong>
        </div>
        <table style="width:100%;font-size:12px;margin-bottom:10px;border-collapse:collapse;">
          <tr><td style="padding:2px 0;color:#555;">เลขที่</td><td style="padding:2px 0;text-align:right;">${esc(docNo)}</td></tr>
          <tr><td style="padding:2px 0;color:#555;">วันที่วางบิล</td><td style="padding:2px 0;text-align:right;">${esc(todayDisplay)}</td></tr>
          ${dueDateRow}
          <tr><td style="padding:2px 0;color:#555;">ลูกค้า</td><td style="padding:2px 0;text-align:right;font-weight:bold;">${esc(custName)}</td></tr>
          ${addressLine}
        </table>
        <table style="width:100%;font-size:11.5px;border-collapse:collapse;margin-bottom:8px;">
          <tr style="border-bottom:1px solid #000;">
            <td style="padding:5px 4px;font-weight:bold;">เลขที่บิล</td>
            <td style="padding:5px 4px;font-weight:bold;">วันที่</td>
            <td style="padding:5px 4px;font-weight:bold;text-align:right;">จำนวนเงิน</td>
          </tr>
          ${rows}
        </table>
        <table style="width:100%;font-size:12px;border-collapse:collapse;margin-bottom:16px;">
          <tr style="border-top:1px solid #000;"><td style="padding:6px 0 2px;font-weight:bold;">รวมเป็นเงินทั้งสิ้น</td><td style="padding:6px 0 2px;text-align:right;font-weight:bold;">${money(
            grandTotal
          )} บาท</td></tr>
          ${fabricAcctRow}
          ${wholeAcctRow}
          ${shippingRow}
          ${shippingAcctRow}
        </table>
        <div style="display:flex;justify-content:space-between;margin-top:32px;font-size:11.5px;">
          <div>ลงชื่อ..................... ผู้วางบิล</div>
          <div>ลงชื่อ..................... ผู้รับวางบิล</div>
        </div>
        ${noteHtml}
      </div>
    `;
    return { docTitle: "ใบวางบิล", docNo, text, textForCopy, html };
  }

  function openBillingStatementModal(cust, sales, existing) {
    const shop = DB.getShopInfo();
    const defaultDue = new Date();
    defaultDue.setDate(defaultDue.getDate() + 14);
    const initialDue = existing && existing.due_date ? existing.due_date : defaultDue.toISOString().slice(0, 10);
    const dueDateInput = el("input", { type: "date", value: initialDue });
    const noteInput = textInput(existing ? existing.note || "" : "");
    noteInput.setAttribute("placeholder", "หมายเหตุ (จะพิมพ์ท้ายใบวางบิล)");

    // มีบิลแว็ดที่แยกค่าส่งไหม: ถ้ามี ค่าผ้าจะโอนเข้าบัญชีคงที่ของร้าน ส่วนค่าส่งให้เลือกบัญชีเอง
    // ถ้าไม่มี�("ใบวางบิลที่ไม่แว็ด/ไม่มีค่อยใช้บัญชีแยก) ยอดทั้งหมดให้เลือกบัญชีเอง
    const hasShipping = sales.some((s) => !!s.is_vat && (s.shipping_fee || 0) > 0);
    // ค่าเริ่มต้นของบัญชีรับค่าส่งในบิล,แวไ บัญชีที่ๅลงแลง็ด ติดตามชื่อบัญชีกสิกรไวย - ฒิทิเจริญ โดยนายสิริปานพชร (ถ้ามีในระ!บบ)
    const preferredAcctId = getCustomerPreferredAccountId(cust);
    const defaultShipAcct = hasShipping
      ? DB.getBankAccounts().find((a) => {
          if (a.is_cash) return false;
          const bank = String(a.bank_name || "").toLowerCase();
          if (!(bank.includes("กสิกร") || bank.includes("kbank"))) return false;
          const name = String(a.account_name || "");
          return name.includes("ศิริเจริญ") || name.includes("สิริปานพชร");
        })
      : null;
    const initialShipAcctId =
      existing && existing.ship_account_id ? existing.ship_account_id : preferredAcctId || (defaultShipAcct ? defaultShipAcct.id : "");
    const initialWholeAcctId = existing && existing.whole_account_id ? existing.whole_account_id : preferredAcctId;
    const shipAccountSelect = hasShipping ? buildBankAccountSelect(initialShipAcctId) : null;
    const wholeAccountSelect = !hasShipping ? buildBankAccountSelect(initialWholeAcctId) : null;
    function selLabel(sel) {
      if (!sel) return "";
      const opt = sel.options[sel.selectedIndex];
      return opt ? opt.textContent : "";
    }

    const record =
      existing ||
      DB.addBillingNote({
        customer_id: cust ? cust.id : null,
        sale_ids: sales.map((s) => s.id),
        due_date: dueDateInput.value,
        note: noteInput.value,
        ship_account_id: shipAccountSelect ? shipAccountSelect.value : "",
        whole_account_id: wholeAccountSelect ? wholeAccountSelect.value : "",
      });

    let current = buildBillingStatementDoc(cust, shop, sales, dueDateInput.value, noteInput.value, selLabel(shipAccountSelect), selLabel(wholeAccountSelect), record.doc_no);
    const previewBox = el("div", { class: "receipt-preview" });
    previewBox.innerHTML = current.html;

    function persistRecord() {
      DB.updateBillingNote(record.id, {
        due_date: dueDateInput.value,
        note: noteInput.value,
        ship_account_id: shipAccountSelect ? shipAccountSelect.value : "",
        whole_account_id: wholeAccountSelect ? wholeAccountSelect.value : "",
      });
    }

    function refresh() {
      current = buildBillingStatementDoc(cust, shop, sales, dueDateInput.value, noteInput.value, selLabel(shipAccountSelect), selLabel(wholeAccountSelect), record.doc_no);
      previewBox.innerHTML = current.html;
      persistRecord();
    }
    dueDateInput.addEventListener("change", refresh);
    noteInput.addEventListener("input", refresh);
    if (shipAccountSelect)
      shipAccountSelect.addEventListener("change", () => {
        rememberCustomerAccount(cust, shipAccountSelect.value);
        refresh();
      });
    if (wholeAccountSelect)
      wholeAccountSelect.addEventListener("change", () => {
        rememberCustomerAccount(cust, wholeAccountSelect.value);
        refresh();
      });

    const downloadBtn = el(
      "button",
      { class: "btn", onClick: () => downloadTextFile(`${current.docNo}.txt`, current.text) },
      "บันทึกเป็นไฟล์ .txt"
    );
    const printBtn = el("button", { class: "btn", onClick: () => printReceiptHtml(current.html) }, "พิมพ์ใบวางบิล");
    const copyBtn = el(
      "button",
      {
        class: "btn",
        onClick: () => {
          copyTextToClipboard(current.textForCopy)
            .then(() => {
              const original = "คัดลอกข้อความใบวางบิล";

  function qrDataUrl(text, size) {
    try {
      return new global.QRious({ value: text, size: size || 200 }).toDataURL();
    } catch (e) {
      return "";
    }
  }

  const STOCK_CHECK_BASE_URL = "https://siricharoen-fabric-shop.pages.dev/stock.html";
  function rollQrUrl(fabricCode, rollNo) {
    return `${STOCK_CHECK_BASE_URL}?code=${encodeURIComponent(fabricCode)}&roll=${rollNo}`;
  }
  function escapeHtmlText(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  }
  function printRollQrSheet(items) {
    if (!items || !items.length) return;
    const tags = items
      .map(({ fabric, roll }) => {
        const url = rollQrUrl(fabric.code, roll.roll_no);
        const img = qrDataUrl(url, 200);
        return `<div class="qr-tag"><img src="${img}" width="120" height="120"/><div class="qr-code">${escapeHtmlText(fabric.code)}</div><div class="qr-roll">ม้วนที่ ${roll.roll_no}</div><div class="qr-name">${escapeHtmlText(fabric.name)}</div></div>`;
      })
      .join("");
    const w = global.window.open("", "_blank");
    if (!w) {
      global.alert("กรุณาอนุญาตป๊อปอัพเพื่อพิมพ์ QR");
      return;
    }
    w.document.write(`
      <html>
      <head>
        <meta charset="UTF-8">
        <title>พิมพ์ QR</title>
        <style>
          body { font-family: Tahoma, sans-serif; margin: 16px; }
          .qr-sheet { display: flex; flex-wrap: wrap; gap: 8px; }
          .qr-tag { border: 1px dashed #999; padding: 6px; text-align: center; width: 3.5cm; box-sizing: border-box; }
          .qr-code { font-size: 12px; font-weight: bold; margin-top: 4px; }
          .qr-roll { font-size: 11px; color: #444; }
          .qr-name { font-size: 10px; color: #666; }
          .print-btn { margin-bottom: 16px; }
          @media print { .print-btn { display: none; } }
        </style>
      </head>
      <body>
        <button class="print-btn" onclick="window.print()">พิมพ์</button>
        <div class="qr-sheet">${tags}</div>
      </body>
      </html>
    `);
    w.document.close();
  }
  function printQrForSelectedFabrics() {
    const items = [];
    fabricSelectedIds.forEach((fid) => {
      const fab = DB.getFabric(fid);
      if (!fab) return;
      const rolls = DB.getActiveRollsByFabric(fid);
      rolls.forEach((roll) => items.push({ fabric: fab, roll }));
    });
    if (!items.length) {
      global.alert("ไม่มีม้วนที่มีสต็อกในรายการที่เลือก");
      return;
    }
    printRollQrSheet(items);
  }
  function openReceiveRollsModal(fabricId) {
    const f = DB.getFabric(fabricId);
    if (!f) return;
    const existingRolls = DB.getRollsByFabric(fabricId);
    const startNo = existingRolls.length ? Math.max(...existingRolls.map((r) => r.roll_no)) + 1 : 1;
    const rowsContainer = el("div", { class: "roll-rows-container" });
    const totalText = el("div", { class: "roll-total-text" });
    function updateTotal() {
      const total = rows.reduce((s, r) => s + (Number(r.qty.value) || 0), 0);
      totalText.textContent = `รวม ${rows.length} ม้วน, ${total} ${f.unit || ""}`;
    }
    function makeQtyInput() {
      const inp = numberInput(0);
      inp.addEventListener("input", updateTotal);
      return inp;
    }
    let rows = [{ qty: makeQtyInput() }];
    function renderRows() {
      clear(rowsContainer);
      rows.forEach((row, idx) => {
        const rowEl = el(
          "div",
          { class: "roll-row", style: "display:flex;align-items:center;gap:8px;margin-bottom:6px;" },
          el("span", { text: `ม้วนที่ ${startNo + idx}`, style: "min-width:80px;" }),
          row.qty,
          el(
            "button",
            {
              class: "btn btn-sm",
              onClick: () => {
                if (rows.length <= 1) return;
                rows.splice(idx, 1);
                renderRows();
              },
            },
            "ลบ"
          )
        );
        rowsContainer.appendChild(rowEl);
      });
      updateTotal();
    }
    renderRows();
    const addRowBtn = el(
      "button",
      {
        class: "btn btn-sm",
        onClick: () => {
          rows.push({ qty: makeQtyInput() });
          renderRows();
        },
      },
      "+ เพิ่มม้วน"
    );
    const noteInput = textInput("");
    const saveBtn = el(
      "button",
      {
        class: "btn btn-primary",

      "div",
      {},
      el("div", { style: "margin-bottom:8px;color:#666;font-size:13px;", text: `${f.code} - ${f.name} (มีอยู่แล้ว ${existingRolls.length} ม้วน)` }),
      rowsContainer,

  function renderStockTable() {
    const container = refs.stockTableContainer;
    clear(container);
    const fabrics = DB.getFabrics(stockSearch, { onlyLowStock: stockLowOnly });
    
    const rows = fabrics.map((f) => {
      const sup = f.supplier_id ? DB.getSupplier(f.supplier_id) : null;
      return [
        f.code, f.name, f.category, f.color, f.unit,
        money(f.cost_price), money(f.sell_price), f.stock_qty, f.reorder_point,
        sup ? sup.name : "",
      ];
    });
    const table = buildDataTable(
      ["รหัส", "ชื่อผ้า", "ประเภท", "สี", "หน่วย", "ราคาทุน", "ราคาขาย", "คงเหลือ", "จุดสั่งซื้อ", "ซัพෞลายเออร์"],
      rows,
      {
        checkbox: {
          isChecked: (idx) => fabricSelectedIds.has(fabrics[idx].id),
          onToggle: (idx, checked) => {
            const id = fabrics[idx].id;
            if (checked) fabricSelectedIds.add(id);
            else fabricSelectedIds.delete(id);
            updateFabricBulkButtons();
          },
          onSelectAll: (checked) => {
            if (checked) fabrics.forEach((f) => fabricSelectedIds.add(f.id));
            else fabrics.forEach((f) => fabricSelectedIds.delete(f.id));
            renderStockTable();
          },
        },
        cellStyle: (row, ci, colName) =>
          colName === "คงเหลือ" && Number(row[ci]) <= 0 ? { color: "var(--danger)", fontWeight: "600" } : null,
        actions: (idx) => {
          const f = fabrics[idx];
          return [
            { label: "แก้ไข", onClick: () => openFabricModal(f.id) },
            { label: "รับผ้าเข้า (แยกม้วน)", onClick: () => openReceiveRollsModal(f.id) },
            { label: "ปรับสต็อก", onClick: () => openAdjustStockModal(f.id) },
            { label: "ประวัติ", onClick: () => openMovementsModal(f.id) },
            
            {
              label: "ลบ",
              onClick: () => {
                if (global.confirm("ต้องการปิดการใช้งานสินค้านี้หรือไม่?")) {
                  DB.deleteFabric(f.id);
                  renderStockTable();
                }
              },
            },
          ];
        },
      }
    );
    container.appendChild(table);
    updateFabricBulkButtons();
  }

    const nameInput = textInput(fabric ? fabric.name : "");

    );

    const sellInput = numberInput(fabric ? fabric.sell_price : 0);
    const stockInput = numberInput(fabric ? fabric.stock_qty : 0);

    const noteInput = textInput(fabric ? fabric.note : "");
    const supplierOptions = suppliers.map((s) => ({ value: String(s.id), label: `${s.code} - ${s.name}` }));

    const supplierSelect = searchSelectInput(

      "พิมพ์รหัส/ชื่อซัพพลายเออร์เพื่อค้นหา... (เว้นว่างได้ถ้าไม่ระบุ)"
    );
    supplierSelect._supplierId = Number(initialSupplierValue) || 0;
    supplierSelect.inputEl.addEventListener("change", () => {
      const v = supplierSelect.getMatchedValue();
      if (v === null) {
        global.alert("ไม่พบซัพพลายเออร์ตามที่พิมพ์ กรุณาเลือกจากรายการที่ปรากฏ หรือเว้นว่างไว้ถ้าไม่ระบุ");
        const cur = supplierOptions.find((o) => o.value === String(supplierSelect._supplierId));
        supplierSelect.setLabel(cur ? cur.label : "(ไม่ระบุ)");
        return;
      }
      supplierSelect._supplierId = v ? Number(v) : 0;

    const saveBtn = el(

        class: "btn btn-primary",
        onClick: () => {

          if (!name) {
            global.alert("กรุณากรอกชื่อผ้า");

          if (!code) {
            global.alert("กรุณากรอกรหัสสินค้า");
            return;
          }
          const dupe = DB.getFabrics("", { onlyActive: true }).find(
            (x) => x.code === code && (!fabric || x.id !== fabric.id)

            color: colorInput.value.trim(),
            pattern: patternInput.value.trim(),
            unit: unitInput.value || "หลา",
            cost_price: Number(costInput.value) || 0,
            sell_price: Number(sellInput.value) || 0,
            reorder_point: Number(reorderInput.value) || 0,
            note: noteInput.value.trim(),
            supplier_id: supplierSelect.getSupplierId() || null,
          };
          if (fabric) {
            DB.updateFabric(fabric.id, data);

            data.stock_qty = Number(stockInput.value) || 0;

          }
          closeModal();
          renderStockTable();
        },
      },
      "บันทึก"
    );
    exposeTestRefs("fabricForm", {
      codeInput, nameInput, categoryInput, colorInput, patternInput, unitInput,
      costInput, sellInput, stockInput, reorderInput, noteInput, supplierSelect, saveBtn,
    });
    openModal(fabric ? "แก้ไขผ้า" : "เพิ่มผ้าใหม่", el("div", {}, form, el("div", { class: "modal-actions" }, saveBtn)), { wide: true });
  }
