<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ส่งคำขอสั่งผ้า - ร้านผ้าศิริเจริญ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Sarabun", "Tahoma", "Leelawadee UI", "Segoe UI", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px;
    color: #111;
    line-height: 1.5;
  }
  .card {
    max-width: 640px;
    margin: 0 auto;
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e2e2e2;
    padding: 28px 32px;
  }
  h1 {
    font-size: 21px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #666;
    margin: 0 0 22px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 6px;
    margin-top: 20px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"],
  input[type="tel"],
  input[type="number"],
  select,
  textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: #2563eb;
  }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 0; }
  .row-3 > div { min-width: 130px; }
  .ship-row > div { min-width: 240px; }
  button {
    width: 100%;
    margin-top: 22px;
    padding: 13px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { background: #93b4ea; cursor: default; }
  .hint {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 12px;
  }
  .error {
    font-size: 13px;
    color: #d33;
    margin-top: 12px;
    display: none;
  }
  .success-box {
    text-align: center;
    padding: 20px 0;
  }
  .success-box .icon {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .success-box h2 {
    font-size: 18px;
    margin: 0 0 8px;
  }
  .success-box p {
    font-size: 14px;
    color: #666;
    margin: 0;
  }
  .success-box button {
    margin-top: 20px;
  }
  .items-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
  }
  .item-row {
    border: 1px solid #e8e8e8;
    border-radius: 10px;
    padding: 16px;
    position: relative;
    background: #fafafa;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
  }
  .item-row-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }
  .item-num {
    font-size: 13px;
    font-weight: 600;
    color: #444;
    flex: 1 1 auto;
    min-width: 0;
  }
  .remove-item-btn {
    width: auto;
    margin: 0;
    padding: 3px 10px;
    background: transparent;
    color: #d33;
    border: 1px solid #d33;
    border-radius: 6px;
    font-size: 12px;
    font-weight: 500;
    flex-shrink: 0;
  }
  .item-line {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  .item-line .item-fabric { flex: 3 1 220px; min-width: 160px; }
  .item-line .item-qty { flex: 1 1 90px; min-width: 70px; }
  .item-line .item-unit { flex: 1 1 100px; min-width: 84px; }
  .add-item-btn {
    background: #fff;
    color: #2563eb;
    border: 1px dashed #2563eb;
    margin-top: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <div id="formView">
    <h1>ส่งคำขอสั่งผ้า</h1>
    <p class="subtitle">ร้านผ้าศิริเจริญ</p>

    <form id="orderForm">
      <div class="row row-3">
        <div>
          <label for="code">รหัสลูกค้า (ถ้ามี)</label>
          <input type="text" id="code" placeholder="เช่น CU00001" />
        </div>
        <div>
          <label for="name">ชื่อ-นามสกุล *</label>
          <input type="text" id="name" placeholder="สมชาย ใจดี" required />
        </div>
        <div>
          <label for="phone">เบอร์โทร *</label>
          <input type="tel" id="phone" placeholder="081-234-5678" required />
        </div>
      </div>

      <div id="itemsContainer" class="items-grid"></div>
      <button type="button" id="addItemBtn" class="add-item-btn">+ เพิ่มรายการผ้าอีก</button>

      <div class="row ship-row">
        <div>
          <label for="shippingMethod">วิธีจัดส่ง *</label>
          <select id="shippingMethod" required>
            <option value="">-- เลือกวิธีจัดส่ง --</option>
            <option value="Flash (ถ้าไม่ถึง 30 หลา มีค่าส่ง 60 บาท)">Flash (ถ้าไม่ถึง 30 หลา มีค่าส่ง 60 บาท)</option>
            <option value="ขนส่ง">ขนส่ง</option>
            <option value="มารับเอง">มารับเอง</option>
            <option value="มอเตอร์ไซค์ไปส่ง (เมื่อสั่ง 50 หลาขึ้นไป)">มอเตอร์ไซค์ไปส่ง (เมื่อสั่ง 50 หลาขึ้นไป)</option>
            <option value="Grab">Grab</option>
            <option value="อื่นๆ">อื่นๆ (ระบุเอง)</option>
          </select>

          <div id="shippingOtherField" style="display:none;">
            <label for="shippingOther">ระบุวิธีจัดส่ง *</label>
            <input type="text" id="shippingOther" placeholder="เช่น ไปรษณีย์ไทย, นิ่มซี่เส็ง" />
          </div>
        </div>

        <div id="addressField">
          <label for="address">ที่อยู่จัดส่ง *</label>
          <textarea id="address" placeholder="บ้านเลขที่ ถนน ตำบล/แขวง อำเภอ/เขต จังหวัด รหัสไปรษณีย์"></textarea>
        </div>
      </div>

      <label for="note">หมายเหตุ</label>
      <input type="text" id="note" placeholder="ไม่บังคับ" />

      <button type="submit" id="submitBtn">ส่งคำขอ</button>
      <p class="error" id="errorMsg"></p>
      <p class="hint">ทางร้านจะติดต่อกลับพร้อมแจ้งราคา</p>
    </form>
  </div>

  <div id="successView" style="display:none;">
    <div class="success-box">
      <div class="icon">✓</div>
      <h2>ส่งคำขอเรียบร้อยแล้ว</h2>
      <p>ทางร้านผ้าศิริเจริญได้รับคำขอของคุณแล้ว จะติดต่อกลับพร้อมแจ้งราคาเร็ว ๆ นี้</p>
      <button id="newRequestBtn">ส่งคำขอใหม่</button>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://hpygvqhajpvhseamdfdc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_jVV5H3D5A94bE7X6pIwtvw_hP6v_NHR";

  var form = document.getElementById("orderForm");
  var submitBtn = document.getElementById("submitBtn");
  var errorMsg = document.getElementById("errorMsg");
  var formView = document.getElementById("formView");
  var successView = document.getElementById("successView");
  var newRequestBtn = document.getElementById("newRequestBtn");
  var itemsContainer = document.getElementById("itemsContainer");
  var addItemBtn = document.getElementById("addItemBtn");
  var shippingMethodSelect = document.getElementById("shippingMethod");
  var shippingOtherField = document.getElementById("shippingOtherField");
  var shippingOtherInput = document.getElementById("shippingOther");
  var addressField = document.getElementById("addressField");
  var addressInput = document.getElementById("address");

  function updateShippingFieldsVisibility() {
    var val = shippingMethodSelect.value;

    if (val === "อื่นๆ") {
      shippingOtherField.style.display = "block";
      shippingOtherInput.setAttribute("required", "required");
    } else {
      shippingOtherField.style.display = "none";
      shippingOtherInput.removeAttribute("required");
    }

    if (val === "มารับเอง") {
      addressField.style.display = "none";
      addressInput.removeAttribute("required");
    } else {
      addressField.style.display = "block";
      addressInput.setAttribute("required", "required");
    }
  }
  shippingMethodSelect.addEventListener("change", updateShippingFieldsVisibility);
  updateShippingFieldsVisibility();

  function renumberItems() {
    var rows = itemsContainer.querySelectorAll(".item-row");
    rows.forEach(function (row, i) {
      row.querySelector(".item-num").textContent =
        "รายการที่ " + (i + 1) + (i === 0 ? " – ผ้าที่ต้องการ * (สั่งได้หลายรายการ)" : "");
      var removeBtn = row.querySelector(".remove-item-btn");
      removeBtn.style.display = rows.length > 1 ? "inline-block" : "none";
    });
  }

  function addItemRow() {
    var row = document.createElement("div");
    row.className = "item-row";
    row.innerHTML =
      '<div class="item-row-header">' +
        '<span class="item-num">รายการที่</span>' +
        '<button type="button" class="remove-item-btn">ลบรายการนี้</button>' +
      '</div>' +
      '<div class="item-line">' +
        '<input type="text" class="item-fabric" placeholder="ผ้าที่ต้องการ เช่น ผ้าลายดอกสีฟ้า" />' +
        '<input type="number" class="item-qty" placeholder="จำนวน" min="0" step="any" />' +
        '<select class="item-unit">' +
          '<option value="หลา">หลา</option>' +
          '<option value="เมตร">เมตร</option>' +
          '<option value="ไม้">ไม้</option>' +
        '</select>' +
      '</div>';
    row.querySelector(".remove-item-btn").addEventListener("click", function () {
      if (itemsContainer.querySelectorAll(".item-row").length <= 1) return;
      row.remove();
      renumberItems();
    });
    itemsContainer.appendChild(row);
    renumberItems();
  }

  addItemBtn.addEventListener("click", function () {
    addItemRow();
  });

  addItemRow();

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorMsg.style.display = "none";

    var name = document.getElementById("name").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var code = document.getElementById("code").value.trim();
    var note = document.getElementById("note").value.trim();
    var shippingMethodRaw = shippingMethodSelect.value;
    var shippingOther = shippingOtherInput.value.trim();
    var shippingAddress = addressInput.value.trim();

    var items = [];
    itemsContainer.querySelectorAll(".item-row").forEach(function (row) {
      var fabricText = row.querySelector(".item-fabric").value.trim();
      var qtyRaw = row.querySelector(".item-qty").value.trim();
      var unit = row.querySelector(".item-unit").value;
      if (fabricText) {
        items.push({
          fabric_text: fabricText,
          qty: qtyRaw ? Number(qtyRaw) : null,
          unit: unit || null,
        });
      }
    });

    if (!name || !phone || items.length === 0) {
      errorMsg.textContent = "กรุณากรอกชื่อ เบอร์โทร และผ้าที่ต้องการอย่างน้อย 1 รายการ";
      errorMsg.style.display = "block";
      return;
    }

    if (!shippingMethodRaw) {
      errorMsg.textContent = "กรุณาเลือกวิธีจัดส่ง";
      errorMsg.style.display = "block";
      return;
    }

    if (shippingMethodRaw === "อื่นๆ" && !shippingOther) {
      errorMsg.textContent = "กรุณาระบุวิธีจัดส่ง";
      errorMsg.style.display = "block";
      return;
    }

    var shippingMethod = shippingMethodRaw === "อื่นๆ" ? shippingOther : shippingMethodRaw;

    if (shippingMethodRaw !== "มารับเอง" && !shippingAddress) {
      errorMsg.textContent = "กรุณากรอกที่อยู่จัดส่ง";
      errorMsg.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "กำลังส่ง...";

    fetch(SUPABASE_URL + "/rest/v1/order_requests", {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({
        customer_name: name,
        customer_phone: phone,
        customer_code: code || null,
        items: items,
        shipping_method: shippingMethod || null,
        shipping_address: shippingAddress || null,
        note: note || null,
      }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("ส่งคำขอไม่สำเร็จ (" + res.status + ")");
        form.reset();
        itemsContainer.innerHTML = "";
        addItemRow();
        updateShippingFieldsVisibility();
        formView.style.display = "none";
        successView.style.display = "block";
      })
      .catch(function (err) {
        errorMsg.textContent = "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง หรือโทรติดต่อร้านโดยตรง";
        errorMsg.style.display = "block";
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "ส่งคำขอ";
      });
  });

  newRequestBtn.addEventListener("click", function () {
    successView.style.display = "none";
    formView.style.display = "block";
  });
</script>

</body>
</html>
