<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ส่งคำขอสั่งผ้า - ร้านผ้าศิริเจริญ</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: "Sarabun", "Tahoma", "Leelawadee UI", "Segoe UI", sans-serif;
    background: #f4f5f7;
    margin: 0;
    padding: 24px 16px;
    color: #111;
  }
  .card {
    max-width: 460px;
    margin: 0 auto;
    background: #fff;
    border-radius: 12px;
    border: 1px solid #e2e2e2;
    padding: 24px;
  }
  h1 {
    font-size: 20px;
    font-weight: 600;
    margin: 0 0 4px;
  }
  .subtitle {
    font-size: 14px;
    color: #666;
    margin: 0 0 20px;
  }
  label {
    display: block;
    font-size: 13px;
    color: #555;
    margin-bottom: 4px;
    margin-top: 14px;
  }
  label:first-of-type { margin-top: 0; }
  input[type="text"],
  input[type="tel"],
  input[type="number"],
  textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    font-family: inherit;
    background: #fff;
  }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus {
    outline: none;
    border-color: #2563eb;
  }
  .row { display: flex; gap: 12px; }
  .row > div { flex: 1; }
  button {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: #2563eb;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  button:disabled { background: #93b4ea; cursor: default; }
  .hint {
    font-size: 12px;
    color: #888;
    text-align: center;
    margin-top: 10px;
  }
  .error {
    font-size: 13px;
    color: #d33;
    margin-top: 10px;
    display: none;
  }
  .success-box {
    text-align: center;
    padding: 20px 0;
  }
  .success-box .icon {
    font-size: 40px;
    margin-bottom: 8px;
  }
  .success-box h2 {
    font-size: 18px;
    margin: 0 0 8px;
  }
  .success-box p {
    font-size: 14px;
    color: #666;
    margin: 0;
  }
  .success-box button {
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="card">
  <div id="formView">
    <h1>ส่งคำขอสั่งผ้า</h1>
    <p class="subtitle">ร้านผ้าศิริเจริญ</p>

    <form id="orderForm">
      <label for="name">ชื่อ-นามสกุล *</label>
      <input type="text" id="name" placeholder="สมชาย ใจดี" required />

      <label for="phone">เบอร์โทร *</label>
      <input type="tel" id="phone" placeholder="081-234-5678" required />

      <label for="code">รหัสลูกค้า (ถ้ามี)</label>
      <input type="text" id="code" placeholder="เช่น CU00001" />

      <label for="fabric">ผ้าที่ต้องการ *</label>
      <textarea id="fabric" placeholder="เช่น ผ้าลายดอกสีฟ้า หรือรหัส 021-9800-1" required></textarea>

      <div class="row">
        <div>
          <label for="qty">จำนวน</label>
          <input type="number" id="qty" placeholder="5" min="0" step="any" />
        </div>
        <div>
          <label for="unit">หน่วย</label>
          <input type="text" id="unit" placeholder="หลา" />
        </div>
      </div>

      <label for="note">หมายเหตุ</label>
      <input type="text" id="note" placeholder="ไม่บังคับ" />

      <button type="submit" id="submitBtn">ส่งคำขอ</button>
      <p class="error" id="errorMsg"></p>
      <p class="hint">ทางร้านจะติดต่อกลับพร้อมแจ้งราคา</p>
    </form>
  </div>

  <div id="successView" style="display:none;">
    <div class="success-box">
      <div class="icon">✓</div>
      <h2>ส่งคำขอเรียบร้อยแล้ว</h2>
      <p>ทางร้านผ้าศิริเจริญได้รับคำขอของคุณแล้ว จะติดต่อกลับพร้อมแจ้งราคาเร็ว ๆ นี้</p>
      <button id="newRequestBtn">ส่งคำขอใหม่</button>
    </div>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://hpygvqhajpvhseamdfdc.supabase.co";
  var SUPABASE_ANON_KEY = "sb_publishable_jVV5H3D5A94bE7X6pIwtvw_hP6v_NHR";

  var form = document.getElementById("orderForm");
  var submitBtn = document.getElementById("submitBtn");
  var errorMsg = document.getElementById("errorMsg");
  var formView = document.getElementById("formView");
  var successView = document.getElementById("successView");
  var newRequestBtn = document.getElementById("newRequestBtn");

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    errorMsg.style.display = "none";

    var name = document.getElementById("name").value.trim();
    var phone = document.getElementById("phone").value.trim();
    var code = document.getElementById("code").value.trim();
    var fabric = document.getElementById("fabric").value.trim();
    var qtyRaw = document.getElementById("qty").value.trim();
    var unit = document.getElementById("unit").value.trim();
    var note = document.getElementById("note").value.trim();

    if (!name || !phone || !fabric) {
      errorMsg.textContent = "กรุณากรอกชื่อ เบอร์โทร และผ้าที่ต้องการให้ครบถ้วน";
      errorMsg.style.display = "block";
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = "กำลังส่ง...";

    fetch(SUPABASE_URL + "/rest/v1/order_requests", {
      method: "POST",
      headers: {
        apikey: SUPABASE_ANON_KEY,
        Authorization: "Bearer " + SUPABASE_ANON_KEY,
        "Content-Type": "application/json",
        Prefer: "return=minimal",
      },
      body: JSON.stringify({
        customer_name: name,
        customer_phone: phone,
        customer_code: code || null,
        fabric_text: fabric,
        qty: qtyRaw ? Number(qtyRaw) : null,
        unit: unit || null,
        note: note || null,
      }),
    })
      .then(function (res) {
        if (!res.ok) throw new Error("ส่งคำขอไม่สำเร็จ (" + res.status + ")");
        form.reset();
        formView.style.display = "none";
        successView.style.display = "block";
      })
      .catch(function (err) {
        errorMsg.textContent = "เกิดข้อผิดพลาด กรุณาลองใหม่อีกครั้ง หรือโทรติดต่อร้านโดยตรง";
        errorMsg.style.display = "block";
      })
      .finally(function () {
        submitBtn.disabled = false;
        submitBtn.textContent = "ส่งคำขอ";
      });
  });

  newRequestBtn.addEventListener("click", function () {
    successView.style.display = "none";
    formView.style.display = "block";
  });
</script>

</body>
</html>
